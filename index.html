            ctx.beginPath();
            ctx.arc(0, 0, 15, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.fill();

            ctx.restore();

            if (st % tickEvery === 0) {
              for (const p of players) {
                if (p.team !== effect.team) continue;
                if (p.hp <= 0) continue;
                const d = Math.hypot(p.x - effect.centerX, p.y - effect.centerY);
                if (d <= zoneR) {
                  p.hp -= dmgPerTick;
                  createExplosion(p.x, p.y, p.team);
                  createDamageNumber(p.x, p.y, dmgPerTick);
                  effects.push({
                    type: "bladeCut",
                    x: p.x, y: p.y,
                    team: p.team,
                    life: 40, maxLife: 40,
                  });
                  playMeteorImpact(p.team, 0.4);
                  if (p.hp <= 0) {
                    createKillEffect(p);
                    playKillSound(panForTeamRandom(p.team));
                    rewardSenderForGiftKill(effect.senderId, 25);
                  }
                }
              }
            }

            if (effect.life <= 5 && !effect.finished) {
              effect.finished = true;
              effects.push({
                type: "bladeBurst",
                x: effect.x, y: effect.y,
                team: effect.team,
                life: 70, maxLife: 70,
              });
              for (let k = 0; k < 15; k++) {
                const a = (Math.PI * 2 * k) / 15;
                effects.push({
                  type: "bladeShard",
                  x: effect.x, y: effect.y,
                  vx: Math.cos(a) * random(6, 14),
                  vy: Math.sin(a) * random(6, 14),
                  angle: a,
                  team: effect.team,
                  life: 80, maxLife: 80,
                });
              }
              playLaserFire(effect.sourceTeam, 0.5);
            }
          }

          if (effect.type === "bladeCut") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(effect.x, effect.y);
            ctx.strokeStyle = "#ff0044";
            ctx.lineWidth = 10;
            ctx.lineCap = "round";
            ctx.shadowColor = "#ff0044";
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.moveTo(-50, -50);
            ctx.lineTo(50, 50);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(50, -50);
            ctx.lineTo(-50, 50);
            ctx.stroke();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 4;
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(-50, -50);
            ctx.lineTo(50, 50);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(50, -50);
            ctx.lineTo(-50, 50);
            ctx.stroke();
            ctx.restore();
          }

          if (effect.type === "bladeBurst") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            for (let ring = 0; ring < 3; ring++) {
              const rp = Math.max(0, progress - ring * 0.12);
              const r = rp * (500 + ring * 150);
              ctx.beginPath();
              ctx.arc(effect.x, effect.y, r, 0, Math.PI * 2);
              ctx.strokeStyle = ring === 0
                ? `rgba(255,255,255,${alpha})`
                : ring === 1
                  ? `rgba(255,80,180,${alpha * 0.8})`
                  : `rgba(180,60,255,${alpha * 0.6})`;
              ctx.lineWidth = 20 * (1 - rp) + 3;
              ctx.stroke();
            }
          }

          if (effect.type === "bladeShard") {
            effect.x += effect.vx;
            effect.y += effect.vy;
            effect.vx *= 0.96;
            effect.vy *= 0.96;
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(effect.x, effect.y);
            ctx.rotate(effect.angle + progress * 4);
            ctx.beginPath();
            ctx.moveTo(20, 0);
            ctx.lineTo(-8, -5);
            ctx.lineTo(-8, 5);
            ctx.closePath();
            const grad = ctx.createLinearGradient(-8, -5, 20, 5);
            grad.addColorStop(0, "rgba(200,200,220,0.9)");
            grad.addColorStop(0.5, "rgba(255,255,255,1)");
            grad.addColorStop(1, "rgba(180,60,255,0.9)");
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = "rgba(255,220,255,0.9)";
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.restore();
          }

          if (effect.type === "meteor") {
            const p = progress;
            const startX = effect.startX;
            const startY = effect.startY;
            const curX = startX + (effect.targetX - startX) * p;
            const curY = startY + (effect.targetY - startY) * p;

            ctx.save();
            for (let k = 1; k <= 20; k++) {
              const tp = Math.max(0, p - k * 0.035);
              const tx = startX + (effect.targetX - startX) * tp;
              const ty = startY + (effect.targetY - startY) * tp;
              const alpha = (1 - k / 20) * (1 - p * 0.3);
              const size = 45 - k * 2;

              ctx.beginPath();
              ctx.arc(tx, ty, size, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(255,80,0,${alpha * 0.5})`;
              ctx.fill();
              ctx.beginPath();
              ctx.arc(tx, ty, size * 0.6, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(255,180,80,${alpha * 0.7})`;
              ctx.fill();
            }
            ctx.restore();

            ctx.save();
            ctx.shadowColor = "#ff4400";
            ctx.shadowBlur = 50;
            ctx.fillStyle = "#ff5500";
            ctx.beginPath();
            ctx.arc(curX, curY, 50, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowColor = "#ffffff";
            ctx.shadowBlur = 30;
            ctx.fillStyle = "#ffeeaa";
            ctx.beginPath();
            ctx.arc(curX, curY, 25, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            if (progress >= 0.95 && !effect.exploded) {
              effect.exploded = true;

              const impactX = effect.targetX;
              const impactY = effect.targetY;

              const target = effect.targetRef;
              if (target && target.hp > 0) {
                const DMG = effect.damage || 15;
                target.hp -= DMG;
                createDamageNumber(target.x, target.y, DMG);

                if (target.hp <= 0) {
                  createKillEffect(target);
                  playKillSound(panForTeamRandom(target.team));
                  rewardSenderForGiftKill(effect.senderId, 25);
                }
              }

              const splashR = effect.splashRadius || 180;
              const splashDmg = effect.splashDamage || 8;
              const enemyTeam = effect.team;

              for (const p of players) {
                if (p.team !== enemyTeam) continue;
                if (p === target) continue;
                if (p.hp <= 0) continue;
                const d = Math.hypot(p.x - impactX, p.y - impactY);
                if (d <= splashR) {
                  p.hp -= splashDmg;
                  createDamageNumber(p.x, p.y, splashDmg);

                  if (p.hp <= 0) {
                    createKillEffect(p);
                    playKillSound(panForTeamRandom(p.team));
                    rewardSenderForGiftKill(effect.senderId, 25);
                  }
                }
              }

              createExplosion(impactX, impactY, effect.team);
              screenShake = Math.max(screenShake, 30);

              if (effect.senderId) {
                const sender = players.find((p) => p.id === effect.senderId && p.hp > 0);
                if (sender) sender.heal(15);
              }

              effects.push({
                type: "meteorImpact",
                x: impactX, y: impactY,
                team: effect.team,
                life: 60, maxLife: 60,
                splashRadius: splashR,
              });
              playMeteorImpact(effect.team, 0.5);
            }
          }

          if (effect.type === "meteorImpact") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;

            if (progress < 0.6) {
              const sr = progress * (effect.splashRadius || 180);
              ctx.beginPath();
              ctx.arc(effect.x, effect.y, sr, 0, Math.PI * 2);
              ctx.strokeStyle = `rgba(255,200,120,${alpha * 0.5})`;
              ctx.lineWidth = 8 * (1 - progress) + 2;
              ctx.stroke();
            }

            for (let ring = 0; ring < 3; ring++) {
              const rp = Math.max(0, progress - ring * 0.12);
              const r = rp * (250 + ring * 80);
              ctx.beginPath();
              ctx.arc(effect.x, effect.y, r, 0, Math.PI * 2);
              ctx.strokeStyle = ring === 0
                ? `rgba(255,255,200,${alpha})`
                : ring === 1
                  ? `rgba(255,140,40,${alpha * 0.8})`
                  : `rgba(200,60,0,${alpha * 0.6})`;
              ctx.lineWidth = 15 * (1 - rp) + 3;
              ctx.stroke();
            }
            if (progress < 0.3) {
              const grad = ctx.createRadialGradient(
                effect.x, effect.y, 0, effect.x, effect.y, 150);
              grad.addColorStop(0, `rgba(255,255,255,${1 - progress * 3})`);
              grad.addColorStop(0.5, `rgba(255,180,80,${(1 - progress * 3) * 0.7})`);
              grad.addColorStop(1, "rgba(255,60,0,0)");
              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.arc(effect.x, effect.y, 150, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          if (effect.type === "wipeEnemyDarken") {
            const alpha = Math.min(1, effect.life / 60) *
                          Math.min(1, (effect.maxLife - effect.life + 30) / 40) * 0.7;
            if (alpha < 0.05) continue;
            const w = effect.right - effect.left;
            ctx.fillStyle = `rgba(0,0,0,${alpha})`;
            ctx.fillRect(effect.left, 0, w, GAME_HEIGHT);
          }

          if (effect.type === "vortexSpiral") {
            const alpha = Math.min(1, effect.life / 40) * 0.85;
            if (alpha < 0.05) continue;
            const spin = Date.now() * 0.004;
            const maxR = effect.maxRadius || GAME_HEIGHT * 0.5;
            ctx.save();
            const enemyLeft = effect.x - maxR;
            const enemyRight = effect.x + maxR;
            ctx.beginPath();
            ctx.rect(enemyLeft, 0, enemyRight - enemyLeft, GAME_HEIGHT);
            ctx.clip();
            ctx.globalAlpha = alpha;
            for (let arm = 0; arm < 5; arm++) {
              const armOffset = (Math.PI * 2 * arm) / 5 + spin;
              ctx.beginPath();
              for (let t = 0; t < 1; t += 0.03) {
                const r = t * maxR;
                const angle = armOffset + t * 3;
                const x = effect.x + Math.cos(angle) * r;
                const y = effect.y + Math.sin(angle) * r;
                if (t === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
              }
              ctx.strokeStyle = `rgba(180,80,255,${alpha * 0.7})`;
              ctx.lineWidth = 14;
              ctx.lineCap = "round";
              ctx.stroke();
              ctx.strokeStyle = `rgba(255,180,255,${alpha * 0.9})`;
              ctx.lineWidth = 4;
              ctx.stroke();
            }
            const pulse = 1 + Math.sin(Date.now() * 0.01) * 0.2;
            const grad = ctx.createRadialGradient(
              effect.x, effect.y, 0, effect.x, effect.y, 150 * pulse);
            grad.addColorStop(0, `rgba(255,180,255,${alpha})`);
            grad.addColorStop(0.4, `rgba(180,60,255,${alpha * 0.8})`);
            grad.addColorStop(1, `rgba(60,0,120,0)`);
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, 150 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          if (effect.type === "vortexPull") {
            const player = effect.playerRef;
            if (!player || player.hp <= 0) continue;

            const totalElapsed = effect.maxLife - effect.life;
            let progressInPull;
            let holdPhase = false;

            if (totalElapsed < effect.pullFrames) {
              progressInPull = totalElapsed / effect.pullFrames;
            } else if (totalElapsed < effect.pullFrames + effect.holdFrames) {
              progressInPull = 1;
              holdPhase = true;
            } else {
              progressInPull = 1;
              holdPhase = true;
            }

            const spinAngle = effect.startAngle +
                              progressInPull * 12 * Math.PI * effect.spinSpeed * effect.spinDirection;

            const easedProgress = 1 - Math.pow(1 - progressInPull, 2);
            const radius = effect.startRadius * (1 - easedProgress);

            const wobble = holdPhase ? Math.sin(Date.now() * 0.02 + effect.startAngle * 10) * 8 : 0;

            const px = effect.centerX + Math.cos(spinAngle) * radius + wobble;
            const py = effect.centerY + Math.sin(spinAngle) * radius + wobble;

            player.x = px;
            player.y = py;

            ctx.save();
            for (let t = 1; t <= 4; t++) {
              const tP = Math.max(0, progressInPull - t * 0.04);
              const tAngle = effect.startAngle +
                             tP * 12 * Math.PI * effect.spinSpeed * effect.spinDirection;
              const tEasedProgress = 1 - Math.pow(1 - tP, 2);
              const tRadius = effect.startRadius * (1 - tEasedProgress);
              const tx = effect.centerX + Math.cos(tAngle) * tRadius;
              const ty = effect.centerY + Math.sin(tAngle) * tRadius;

              ctx.globalAlpha = 0.25 - t * 0.05;
              ctx.beginPath();
              ctx.arc(tx, ty, player.radius * (0.85 - t * 0.1), 0, Math.PI * 2);
              ctx.fillStyle = "rgba(180,80,255,1)";
              ctx.fill();
            }
            ctx.restore();

            ctx.save();
            ctx.translate(px, py);
            const rotationSpeed = holdPhase ? 0.15 : 0.35;
            ctx.rotate(progressInPull * rotationSpeed * effect.spinDirection * 20);

            const auraR = player.radius + 10 + Math.sin(Date.now() * 0.02) * 3;
            ctx.beginPath();
            ctx.arc(0, 0, auraR, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(200,80,255,${0.6 + Math.sin(Date.now() * 0.03) * 0.3})`;
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
            ctx.clip();
            if (player.img.complete) {
              try {
                ctx.drawImage(player.img, -player.radius, -player.radius,
                              player.radius * 2, player.radius * 2);
              } catch (e) {
                ctx.fillStyle = "#777";
                ctx.fillRect(-player.radius, -player.radius,
                             player.radius * 2, player.radius * 2);
              }
            }
            ctx.restore();

            if (holdPhase) {
              ctx.save();
              ctx.globalAlpha = 0.5 + Math.random() * 0.3;
              ctx.strokeStyle = "#cc66ff";
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(px, py);
              const midX = (px + effect.centerX) / 2 + (Math.random() - 0.5) * 30;
              const midY = (py + effect.centerY) / 2 + (Math.random() - 0.5) * 30;
              ctx.lineTo(midX, midY);
              ctx.lineTo(effect.centerX, effect.centerY);
              ctx.stroke();
              ctx.restore();
            }
          }

          if (effect.type === "wipeExplosion") {
            const p = progress;
            const alpha = 1 - p;
            if (p < 0.25) {
              ctx.fillStyle = `rgba(255,255,255,${(1 - p * 4) * 0.95})`;
              ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            }
            for (let layer = 0; layer < 3; layer++) {
              const layerP = Math.max(0, p - layer * 0.1);
              const r = layerP * (600 + layer * 200);
              const layerAlpha = (1 - layerP) * alpha;
              ctx.beginPath();
              ctx.arc(effect.x, effect.y, r, 0, Math.PI * 2);
              ctx.strokeStyle = layer === 0
                ? `rgba(255,255,255,${layerAlpha})`
                : layer === 1
                  ? `rgba(255,180,100,${layerAlpha * 0.8})`
                  : `rgba(180,60,255,${layerAlpha * 0.6})`;
              ctx.lineWidth = (30 - layer * 8) * (1 - layerP) + 3;
              ctx.stroke();
            }
          }

          if (effect.type === "bgCrack") {
            const alpha = Math.min(1, effect.life / 30) * (1 - progress * 0.3);
            if (alpha < 0.05) continue;
            ctx.save();
            if (effect.boundsLeft !== undefined && effect.boundsRight !== undefined) {
              ctx.beginPath();
              ctx.rect(effect.boundsLeft, 0,
                       effect.boundsRight - effect.boundsLeft, GAME_HEIGHT);
              ctx.clip();
            }
            ctx.globalAlpha = alpha;
            ctx.lineCap = "round";
            ctx.strokeStyle = `rgba(0,0,0,${alpha * 0.9})`;
            ctx.lineWidth = 12;
            ctx.beginPath();
            let cx = effect.x, cy = effect.y;
            ctx.moveTo(cx, cy);
            const segments = 12;
            const segLen = effect.length / segments;
            for (let k = 0; k < segments; k++) {
              const angle = effect.angle + (Math.random() - 0.5) * 0.5;
              cx += Math.cos(angle) * segLen;
              cy += Math.sin(angle) * segLen;
              ctx.lineTo(cx, cy);
            }
            ctx.stroke();
            ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.8})`;
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.restore();
          }

          if (effect.type === "glassShard") {
            effect.x += effect.vx;
            effect.y += effect.vy;
            effect.vx *= 0.97;
            effect.vy *= 0.97;
            effect.angle += effect.spin;
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(effect.x, effect.y);
            ctx.rotate(effect.angle);
            ctx.beginPath();
            ctx.moveTo(0, -effect.size * 0.5);
            ctx.lineTo(effect.size * 0.4, effect.size * 0.3);
            ctx.lineTo(-effect.size * 0.4, effect.size * 0.3);
            ctx.closePath();
            const grad = ctx.createLinearGradient(
              -effect.size * 0.4, -effect.size * 0.5,
              effect.size * 0.4, effect.size * 0.3);
            grad.addColorStop(0, `rgba(200,220,255,${alpha})`);
            grad.addColorStop(0.5, `rgba(140,180,255,${alpha * 0.8})`);
            grad.addColorStop(1, `rgba(80,120,200,${alpha * 0.6})`);
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.9})`;
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
          }

          if (effect.type === "floatingSkull") {
            const alpha = Math.min(1, effect.life / 40) * 0.5;
            if (alpha < 0.05) continue;
            const y = effect.y - (effect.y - effect.targetY) * progress;
            const x = effect.x + effect.drift * progress * 100 +
                      Math.sin(Date.now() * 0.002 + effect.x) * 15;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.textAlign = "center";
            ctx.font = "36px Arial";
            ctx.fillStyle = "#dddddd";
            ctx.fillText("💀", x, y);
            ctx.restore();
          }

          if (effect.type === "finalDarkness" &&
              effect.left !== undefined && effect.right !== undefined) {
            const alpha = Math.min(1, (effect.maxLife - effect.life) / 30) *
                          Math.min(1, effect.life / 40) * 0.8;
            if (alpha < 0.05) continue;
            const w = effect.right - effect.left;
            ctx.fillStyle = `rgba(0,0,0,${alpha})`;
            ctx.fillRect(effect.left, 0, w, GAME_HEIGHT);
          }

          if (effect.type === "wipeShockwave") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            const maxR = Math.hypot(GAME_WIDTH, GAME_HEIGHT) * 0.6;
            const r = progress * maxR;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, r, 0, Math.PI * 2);
            ctx.strokeStyle = effect.team === "A"
              ? `rgba(255,48,79,${alpha})`
              : `rgba(0,217,255,${alpha})`;
            ctx.lineWidth = 25 * (1 - progress) + 4;
            ctx.stroke();
          }
        }

        if (bannerLife > 0) {
          bannerLife--;
          const p = 1 - bannerLife / bannerMaxLife;
          let alpha;
          if (p < 0.15) alpha = p / 0.15;
          else if (p > 0.75) alpha = (1 - p) / 0.25;
          else alpha = 1;
          const scale = 1 + Math.sin(p * Math.PI) * 0.15;
          const y = GAME_HEIGHT * 0.4;
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.textAlign = "center";
          ctx.font = `bold ${Math.floor(90 * scale)}px Arial`;
          ctx.fillStyle = bannerTeam === "A" ? "#ff5a76" : "#3ee6ff";
          ctx.fillText(bannerText, GAME_WIDTH / 2, y);
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 4;
          ctx.strokeText(bannerText, GAME_WIDTH / 2, y);
          ctx.restore();
        }
      }

      function rewardSenderForGiftKill(senderId, amount = 25) {
        if (!senderId) return;
        const sender = players.find((p) => p.id === senderId && p.hp > 0);
        if (!sender) return;
        sender.kills++;
        sender.radius = Math.min(70, 55 + sender.kills * 2);
        sender.maxHp = Math.min(
          MAX_HP_CAP,
          Math.max(sender.maxHp, START_HP + sender.kills * 15)
        );
        sender.hp = Math.min(sender.maxHp, sender.hp + amount);
        sender.damage = 1;
        sender.bulletSize = Math.min(10, 5 + sender.kills * 0.25);
        logDebug(`GIFT KILL reward → ${sender.username} (+${amount} HP)`);
      }

      /* ============================================================
         GIFT ATTACK
      ============================================================ */
      function giftAttack(coins, senderTeam, giftName, senderId) {
        const enemyTeam = senderTeam === "A" ? "B" : "A";
        const targets = players.filter((p) => p.team === enemyTeam && p.hp > 0);
        if (targets.length === 0) return;
        const name = (giftName || "").toLowerCase();

        // Determine launch icon by gift
        let launchIcon = "✨";
        if (name.includes("rose")) launchIcon = "🌹";
        else if (name.includes("heart")) launchIcon = "💗";
        else if (name.includes("mind")) launchIcon = "🧠";
        else if (name.includes("ghost")) launchIcon = "👻";
        else if (name.includes("lightning")) launchIcon = "⚡";

        else if (coins >= 500 && coins < 1000) launchIcon = "☄️";

        // Spawn pulse + glow at sender's avatar
        spawnGiftLaunch(senderId, senderTeam, launchIcon);

        if (name.includes("rose")) {
          playRoseSound(senderTeam);
          const lockedTarget = targets[Math.floor(Math.random() * targets.length)];

          const enemyCenterX = senderTeam === "A"
            ? GAME_WIDTH * 0.75
            : GAME_WIDTH * 0.25;

          const ROSE_BULLETS = 5;
          const STREAM_DELAY = 180;

          for (let i = 0; i < ROSE_BULLETS; i++) {
            setTimeout(() => {
              if (!lockedTarget || lockedTarget.hp <= 0) return;

              const origin = getSenderOrigin(senderId, senderTeam);
              const startX = origin.x;
              const startY = origin.y;

              const angleToTarget = Math.atan2(
                lockedTarget.y - startY,
                lockedTarget.x - startX

              bullets.push({
                x: startX + random(-15, 15),
                y: startY + random(-15, 15),
                team: senderTeam,
                ownerId: "__gift__",

                targetId: lockedTarget.id,

                missileType: "rose",
                spin: Math.random() * Math.PI * 2,
                spiral: true,
                spiralCenterX: enemyCenterX,
                spiralCenterY: enemyCenterY,
                spiralRadius: 200 + Math.random() * 120,
                spiralAngle: angleToTarget + (Math.random() < 0.5 ? 0.6 : -0.6),

      /* ============================================================
         BACKGROUND
      ============================================================ */
      function drawBackground() {
        const halfW = GAME_WIDTH / 2;
        if (IMG_BG_A.complete && IMG_BG_A.naturalWidth > 0) {
          ctx.drawImage(IMG_BG_A, 0, 0, halfW, GAME_HEIGHT);
        } else {
          ctx.fillStyle = FALLBACK_BG_A;
          ctx.fillRect(0, 0, halfW, GAME_HEIGHT);
        }
        if (IMG_BG_B.complete && IMG_BG_B.naturalWidth > 0) {
          ctx.drawImage(IMG_BG_B, halfW, 0, halfW, GAME_HEIGHT);
        } else {
          ctx.fillStyle = FALLBACK_BG_B;
          ctx.fillRect(halfW, 0, halfW, GAME_HEIGHT);
        }
        ctx.fillStyle = "rgba(255,255,255,0.2)";
        ctx.fillRect(GAME_WIDTH / 2 - 3, 0, 6, GAME_HEIGHT);
        ctx.fillStyle = "#222";
        ctx.font = "bold 130px Arial";
        ctx.textAlign = "center";
        ctx.fillText("A", GAME_WIDTH * 0.25, 150);
        ctx.fillStyle = "#fff";
        ctx.fillText("B", GAME_WIDTH * 0.75, 150);
        const teamA = players.filter((p) => p.team === "A").length;
        const teamB = players.filter((p) => p.team === "B").length;
        ctx.font = "bold 35px Arial";
        ctx.fillStyle = "#222";
        ctx.fillText(`${teamA} players`, GAME_WIDTH * 0.25, 205);
        ctx.fillStyle = "#fff";
        ctx.fillText(`${teamB} players`, GAME_WIDTH * 0.75, 205);
      }

      function removeDeadPlayers() {
        for (let i = players.length - 1; i >= 0; i--) {
          if (players[i].hp <= 0) players.splice(i, 1);
        }
      }

      /* ============================================================
         STATUS BAR
      ============================================================ */
      function setStatus(text, cls) {
        const el = document.getElementById("status");
        el.textContent = text;
        el.classList.remove("connected", "disconnected", "connecting");
        if (cls) el.classList.add(cls);
      }

      function updateStatus() {
        const a = players.filter((p) => p.team === "A").length;
        const b = players.filter((p) => p.team === "B").length;

        let prefix = "🟡";
        let cls = "connecting";
        if (socket && socket.readyState === WebSocket.OPEN) {
          prefix = "🟢"; cls = "connected";
        } else if (socket && (socket.readyState === WebSocket.CLOSED ||
                              socket.readyState === WebSocket.CLOSING)) {
          prefix = "🔴"; cls = "disconnected";
        }

        setStatus(
          `${prefix} TEAM A: ${a}  |  TEAM B: ${b}` +
          (cls === "connected" ? "" : "  (test mode)"),
          cls
        );
      }

      /* ============================================================
         GAME LOOP
      ============================================================ */
      function gameLoop(now) {
        ctx.save();
        if (screenShake > 0) {
          const dx = random(-screenShake, screenShake);
          const dy = random(-screenShake, screenShake);
          ctx.translate(dx, dy);
          screenShake *= 0.9;
          if (screenShake < 1) screenShake = 0;
        }
        drawBackground();
        for (const player of players) {
          if (player.hp > 0) player.update(now);
        }
        for (const player of players) {
          if (player.hp > 0) player.draw();
        }
        updateBullets();
        drawEffects();
        removeDeadPlayers();
        updateStatus();
        ctx.restore();
        requestAnimationFrame(gameLoop);
      }

      /* ============================================================
         TIKFINITY WEBSOCKET
      ============================================================ */
      let socket = null;
      let reconnectTimer = null;

      function connectTikFinity() {
        try {
          setStatus("🟡 Connecting to TikFinity...", "connecting");
          logDebug("WS CONNECTING...");

          socket = new WebSocket("ws://localhost:21213/");

          socket.onopen = () => {
            setStatus("🟢 TikFinity CONNECTED", "connected");
            logDebug("WS CONNECTED");
          };

          socket.onmessage = (event) => {
            let data;
            try { data = JSON.parse(event.data); }
            catch (e) {
              logDebug("Non-JSON: " + String(event.data).slice(0, 120));
              return;
            }

            logDebug("EVENT: " + data.event + " | " +
                     JSON.stringify(data.data || {}).slice(0, 160));

            const evt = (data.event || data.type || "").toLowerCase();

            if (evt === "chat" || evt === "comment") handleChat(data);
            else if (evt === "gift") handleGift(data);
          };

          socket.onerror = () => {
            setStatus("🔴 TikFinity NOT CONNECTED (test mode)", "disconnected");
            logDebug("WS ERROR");
          };

          socket.onclose = () => {
            setStatus("🔴 TikFinity DISCONNECTED (test mode)", "disconnected");
            logDebug("WS CLOSED - retrying in 3s");
            if (reconnectTimer) clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(() => connectTikFinity(), 3000);
          };
        } catch (error) {
          console.log("WebSocket unavailable", error);
          setStatus("🔴 TikFinity NOT CONNECTED (test mode)", "disconnected");
          logDebug("WS THROW: " + error.message);
          if (reconnectTimer) clearTimeout(reconnectTimer);
          reconnectTimer = setTimeout(() => connectTikFinity(), 3000);
        }
      }

      function pick(obj, ...keys) {
        if (!obj) return undefined;
        for (const k of keys) {
          if (obj[k] !== undefined && obj[k] !== null && obj[k] !== "") {
            return obj[k];
          }
        }
        return undefined;
      }

      function handleChat(data) {
        const info = data.data || data;
        const username = pick(
          info,
          "uniqueId", "userId", "unique_id", "user_id",
          "nickname", "nickName", "nick_name", "displayName"
        ) || "viewer";
        const comment = String(
          pick(info, "comment", "text", "message", "content") || ""
        ).trim().toLowerCase();
        const avatar = pick(
          info,
          "profilePictureUrl", "profilePicture", "avatarUrl",
          "profile_picture_url", "avatar"
        ) || DEFAULT_AVATAR;

        logDebug(`CHAT user=${username} comment="${comment}"`);

        if (comment === "a" || comment === "team a") addPlayer(username, avatar, "A");
        else if (comment === "b" || comment === "team b") addPlayer(username, avatar, "B");
      }

      function handleGift(data) {
        const info = data.data || data;
        const username = pick(
          info,
          "uniqueId", "userId", "unique_id", "user_id", "nickname", "nickName"
        ) || "viewer";
        const giftName = String(pick(
          info, "giftName", "gift_name", "giftId", "gift_id"
        ) || "");
        const coinsRaw = pick(
          info, "diamondCount", "diamonds", "coins",
          "diamond_count", "giftDiamondCount"
        );
        const coins = parseInt(coinsRaw) || 1;

        logDebug(`GIFT user=${username} name="${giftName}" coins=${coins}`);

        const player = players.find((p) => p.id === username);
        if (!player) {
          logDebug(`Gift ignored - user ${username} not on a team`);
          return;
        }
        giftAttack(coins, player.team, giftName, player.id);
      }

      /* ============================================================
         TEST BUTTONS
      ============================================================ */
      let testNumber = 0;
      let testGiftToggle = 0;

      document.getElementById("teamAButton").onclick = () => {
        testNumber++;
        addPlayer("TestA" + testNumber, DEFAULT_AVATAR, "A");
      };
      document.getElementById("teamBButton").onclick = () => {
        testNumber++;
        addPlayer("TestB" + testNumber, DEFAULT_AVATAR, "B");
      };
      document.getElementById("giftButton").onclick = () => {
        testGiftToggle++;
        const mod = testGiftToggle % 8;
        const sender = players.find(p => p.team === "A");
        const sid = sender ? sender.id : null;
        if (mod === 1) giftAttack(1, "A", "Rose", sid);
        else if (mod === 2) giftAttack(5, "A", "Heart Me", sid);
        else if (mod === 3) giftAttack(10, "A", "Mind Blown", sid);
        else if (mod === 4) giftAttack(20, "A", "Ghost", sid);
        else if (mod === 5) giftAttack(50, "A", "Lightning", sid);
        else if (mod === 6) giftAttack(100, "A", "Mega Strike", sid);
        else if (mod === 7) giftAttack(500, "A", "Nuke", sid);
        else giftAttack(1000, "A", "Total Wipe", sid);
      };
      document.getElementById("muteButton").onclick = () => {
        soundEnabled = !soundEnabled;
        document.getElementById("muteButton").textContent =
          soundEnabled ? "🔊" : "🔇";
      };
      document.getElementById("resetButton").onclick = () => {
        players = []; bullets = []; effects = [];
        screenShake = 0; bannerLife = 0;
        updateStatus();
        logDebug("RESET");
      };

      /* ============================================================
         START
      ============================================================ */
      connectTikFinity();
      requestAnimationFrame(gameLoop);
    </script>
  </body>
</html>
