<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TikTok Battle — Messi vs Ronaldo</title>

    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #111; overflow: hidden; font-family: Arial, sans-serif;
      }
      #game-wrapper {
        width: 100vw; height: 100vh;
        margin: auto; position: relative;
        overflow: hidden; background: #111;
        display: flex; align-items: center; justify-content: center;
      }
      canvas {
        display: block;
        max-width: 100%; max-height: 100%;
        width: auto; height: auto;
        aspect-ratio: 9 / 16;
        object-fit: contain;
      }
      #status {
        position: absolute; top: 10px; left: 10px; right: 10px;
        z-index: 20; padding: 8px 12px;
        background: rgba(0,0,0,0.65); color: white;
        border-radius: 8px; font-size: 13px; text-align: center;
        font-weight: bold;
        transition: background 0.3s, color 0.3s;
      }
      #status.connected { background: rgba(20,120,40,0.85); color: #b6ffb6; }
      #status.disconnected { background: rgba(140,20,20,0.85); color: #ffc0c0; }
      #status.connecting { background: rgba(140,110,20,0.85); color: #ffe9a0; }
      #joinPopups {
        position: absolute; top: 48px; left: 50%;
        transform: translateX(-50%);
        z-index: 22;
        display: flex; flex-direction: column;
        align-items: center; gap: 6px;
        pointer-events: none;
      }
      .joinPopup {
        background: rgba(0,0,0,0.8);
        color: #fff;
        padding: 6px 14px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 14px;
        border: 2px solid #fff;
        opacity: 0;
        transform: translateY(-12px);
        animation: joinPop 1.8s ease-out forwards;
      }
      .joinPopup.teamA { border-color: #2b7bd6; color: #9fd4ff; }
      .joinPopup.teamB { border-color: #0f8a3c; color: #7dffa3; }
      @keyframes joinPop {
        0%   { opacity: 0; transform: translateY(-12px) scale(0.9); }
        15%  { opacity: 1; transform: translateY(0) scale(1); }
        80%  { opacity: 1; transform: translateY(0) scale(1); }
        100% { opacity: 0; transform: translateY(-8px) scale(0.95); }
      }
      #debug {
        position: absolute; top: 50px; left: 10px; right: 10px;
        z-index: 25; padding: 8px 12px;
        background: rgba(0,0,0,0.75); color: #9f9;
        border-radius: 8px; font-size: 11px;
        font-family: monospace; text-align: left;
        max-height: 220px; overflow-y: auto;
        display: none; white-space: pre-wrap; word-break: break-all;
      }
      #debug.visible { display: block; }
      #controls {
        position: absolute; bottom: 10px; left: 50%;
        transform: translateX(-50%);
        z-index: 20; display: flex; gap: 6px;
        justify-content: center; flex-wrap: wrap;
        max-width: 95vw;
      }
      button {
        border: none; border-radius: 8px;
        padding: 8px 12px; font-weight: bold; cursor: pointer;
      }
      #teamAButton { background: #2b7bd6; color: white; }
      #teamBButton { background: #0f8a3c; color: white; }
      #giftButton  { background: #ffd166; color: black; }
      #resetButton { background: white; color: black; }
      #muteButton  { background: #333; color: white; }
      #debugButton { background: #444; color: white; }
    </style>
  </head>

  <body>
    <div id="game-wrapper">
      <canvas id="battleCanvas"></canvas>
      <div id="status">Connecting to TikFinity...</div>
      <div id="joinPopups"></div>
      <div id="debug"></div>
      <div id="controls">
        <button id="teamAButton">Test Messi</button>
        <button id="teamBButton">Test Ronaldo</button>
        <button id="giftButton">Test Gift</button>
        <button id="muteButton">🔊</button>
        <button id="debugButton">🐞</button>
        <button id="resetButton">Reset</button>
      </div>
    </div>

    <script>
      /* ============================================================
         CONFIG
      ============================================================ */
      const canvas = document.getElementById("battleCanvas");
      const ctx = canvas.getContext("2d");

      const GAME_WIDTH = 1080;
      const GAME_HEIGHT = 1920;
      canvas.width = GAME_WIDTH;
      canvas.height = GAME_HEIGHT;

      const START_HP = 250;
      const MAX_HP_CAP = 5000;
      const LIKE_HEAL_AMOUNT = 1;

      const TIKTOK_GIFT_IDS = {
        5655: "Rose",
        5658: "TikTok",
        5567: "Heart Me",
        5487: "Heart",
        5269: "Finger Heart",
        5509: "Hand Hearts",
        6104: "Mind Blown",
        6161: "Ghost",
        6053: "Lightning",
        6064: "Ice Cream Cone",
        5461: "Doughnut",
      };

      function fitCanvas() {
        const wrapper = document.getElementById("game-wrapper");
        const wW = wrapper.clientWidth;
        const wH = wrapper.clientHeight;
        const gameRatio = GAME_WIDTH / GAME_HEIGHT;
        const screenRatio = wW / wH;
        let cssW, cssH;
        if (screenRatio > gameRatio) { cssH = wH; cssW = wH * gameRatio; }
        else { cssW = wW; cssH = wW / gameRatio; }
        canvas.style.width = cssW + "px";
        canvas.style.height = cssH + "px";
      }
      window.addEventListener("resize", fitCanvas);
      window.addEventListener("orientationchange", fitCanvas);
      fitCanvas();

      /* ============================================================
         DEBUG PANEL
      ============================================================ */
      const debugEl = document.getElementById("debug");
      const debugLines = [];
      function logDebug(msg) {
        const time = new Date().toLocaleTimeString();
        debugLines.push(`[${time}] ${msg}`);
        if (debugLines.length > 40) debugLines.shift();
        debugEl.textContent = debugLines.join("\n");
        debugEl.scrollTop = debugEl.scrollHeight;
        console.log("[BATTLE]", msg);
      }
      document.getElementById("debugButton").onclick = () => {
        debugEl.classList.toggle("visible");
      };

      /* ============================================================
         BACKGROUND IMAGE
      ============================================================ */
      const IMG_BG = new Image();
      IMG_BG.src = "./ab.jpg";
      const FALLBACK_BG = "#111";

      /* ============================================================
         SOUND ENGINE
      ============================================================ */
      let audioCtx = null;
      let soundEnabled = true;

      function initAudio() {
        if (!audioCtx) {
          try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
          catch (e) { console.log("Audio not supported", e); }
        }
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      }
      document.addEventListener("click", initAudio, { once: false });

      function makePanner(pan = 0) {
        if (!audioCtx) return null;
        if (audioCtx.createStereoPanner) {
          const p = audioCtx.createStereoPanner();
          p.pan.setValueAtTime(Math.max(-1, Math.min(1, pan)), audioCtx.currentTime);
          p.connect(audioCtx.destination);
          return p;
        }
        return null;
      }
      function panForTeam(team) { return team === "A" ? -0.7 : 0.7; }
      function panForTeamRandom(team) {
        return panForTeam(team) + (Math.random() - 0.5) * 0.3;
      }

      function playTone({ freq=440, type="sine", duration=0.2, volume=0.2,
                          delay=0, sweepTo=null, sweepTime=null, pan=0 }) {
        if (!soundEnabled || !audioCtx) return;
        const now = audioCtx.currentTime + delay;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (sweepTo !== null) {
          osc.frequency.exponentialRampToValueAtTime(
            Math.max(1, sweepTo), now + (sweepTime || duration));
        }
        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        const panner = makePanner(pan);
        if (panner) gain.connect(panner); else gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + duration + 0.05);
      }

      function playNoise({ duration=0.4, volume=0.3, delay=0, filterFreq=800, pan=0 }) {
        if (!soundEnabled || !audioCtx) return;
        const now = audioCtx.currentTime + delay;
        const bufferSize = Math.floor(audioCtx.sampleRate * duration);
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
        }
        const src = audioCtx.createBufferSource();
        src.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(filterFreq, now);
        filter.frequency.exponentialRampToValueAtTime(100, now + duration);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        src.connect(filter);
        filter.connect(gain);
        const panner = makePanner(pan);
        if (panner) gain.connect(panner); else gain.connect(audioCtx.destination);
        src.start(now); src.stop(now + duration);
      }

      function playRoseSound(team="A") {
        const pan = panForTeamRandom(team);
        for (let i = 0; i < 5; i++) {
          playTone({ freq: 800, type: "square", duration: 0.08,
                     volume: 0.12, delay: i * 0.06, sweepTo: 300, pan });
        }
      }
      function playHeartSound(team="A") {
        const pan = panForTeamRandom(team);
        [523, 659, 784, 1047].forEach((f, i) => {
          playTone({ freq: f, type: "sine", duration: 0.35,
                     volume: 0.18, delay: i * 0.09, pan });
        });
        playTone({ freq: 1500, type: "triangle", duration: 0.4,
                   volume: 0.1, delay: 0.4, sweepTo: 2400, pan });
      }
      function playMindSound(team="A") {
        const pan = panForTeamRandom(team);
        playTone({ freq: 200, type: "sawtooth", duration: 0.5,
                   volume: 0.15, sweepTo: 1600, pan });
        for (let i = 0; i < 8; i++) {
          playTone({ freq: 400 + Math.random() * 800, type: "square",
                     duration: 0.04, volume: 0.1, delay: 0.5 + i * 0.05, pan });
        }
      }
      function playGhostAmbience(team="A", volume=0.35, duration=3) {
        const pan = panForTeam(team);
        if (!soundEnabled || !audioCtx) return;
        const panner = makePanner(pan);
        if (!panner) return;
        const now = audioCtx.currentTime;
        const droneOsc = audioCtx.createOscillator();
        const droneGain = audioCtx.createGain();
        droneOsc.type = "sawtooth";
        droneOsc.frequency.setValueAtTime(55, now);
        droneOsc.frequency.linearRampToValueAtTime(50, now + duration);
        const droneFilter = audioCtx.createBiquadFilter();
        droneFilter.type = "lowpass";
        droneFilter.frequency.setValueAtTime(200, now);
        droneFilter.Q.setValueAtTime(5, now);
        droneGain.gain.setValueAtTime(0, now);
        droneGain.gain.linearRampToValueAtTime(volume * 0.4, now + 0.4);
        droneGain.gain.setValueAtTime(volume * 0.4, now + duration - 0.6);
        droneGain.gain.linearRampToValueAtTime(0, now + duration);
        droneOsc.connect(droneFilter);
        droneFilter.connect(droneGain);
        droneGain.connect(panner);
        droneOsc.start(now); droneOsc.stop(now + duration);
      }
      function playGhostWail(team="A", volume=0.4, delay=0) {
        const pan = panForTeamRandom(team);
        if (!soundEnabled || !audioCtx) return;
        const now = audioCtx.currentTime + delay;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 1.2);
        const lfo = audioCtx.createOscillator();
        const lfoGain = audioCtx.createGain();
        lfo.frequency.setValueAtTime(6, now);
        lfoGain.gain.setValueAtTime(40, now);
        lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
        lfo.start(now); lfo.stop(now + 1.2);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(volume, now + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
        osc.connect(gain);
        const panner = makePanner(pan);
        if (panner) gain.connect(panner); else gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 1.2);
      }
      function playGhostScream(team="A", volume=0.45, delay=0) {
        const pan = panForTeamRandom(team);
        if (!soundEnabled || !audioCtx) return;
        const now = audioCtx.currentTime + delay;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.6);
        const lfo = audioCtx.createOscillator();
        const lfoGain = audioCtx.createGain();
        lfo.frequency.setValueAtTime(12, now);
        lfoGain.gain.setValueAtTime(80, now);
        lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
        lfo.start(now); lfo.stop(now + 0.7);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(volume, now + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
        osc.connect(gain);
        const panner = makePanner(pan);
        if (panner) gain.connect(panner); else gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.7);
      }
      function playLightningCrack(team="A", volume=0.5) {
        const pan = panForTeamRandom(team);
        playNoise({ duration: 0.15, volume, filterFreq: 6000, pan });
        playTone({ freq: 3000, type: "square", duration: 0.1,
                   volume: volume * 0.6, sweepTo: 300, pan });
      }
      function playThunderRumble(team="A", volume=0.4, delay=0) {
        const pan = panForTeam(team);
        playNoise({ duration: 2.5, volume, filterFreq: 400, delay, pan });
      }
      function playThunderBoom(team="A", volume=0.35, delay=0) {
        const pan = panForTeam(team);
        playTone({ freq: 120, type: "sine", duration: 1.8,
                   volume, delay, sweepTo: 30, pan });
      }
      function playLaserCharge(team="A", volume=0.35, duration=1.1) {
        const pan = panForTeam(team);
        if (!soundEnabled || !audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(80, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + duration);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(volume * 0.6, now + duration * 0.7);
        gain.gain.linearRampToValueAtTime(volume, now + duration);
        osc.connect(gain);
        const panner = makePanner(pan);
        if (panner) gain.connect(panner); else gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + duration + 0.05);
      }
      function playLaserFire(team="A", volume=0.5) {
        const pan = panForTeam(team);
        playTone({ freq: 200, type: "sine", duration: 1.8,
                   volume, sweepTo: 40, pan });
        playTone({ freq: 2500, type: "sawtooth", duration: 0.3,
                   volume: volume * 0.7, sweepTo: 200, pan });
        playNoise({ duration: 0.6, volume: volume * 0.6, filterFreq: 6000, pan });
      }
      function playMeteorWhoosh(team="A", volume=0.3, delay=0) {
        const pan = panForTeamRandom(team);
        playTone({ freq: 1200, type: "sawtooth", duration: 0.4,
                   volume, delay, sweepTo: 200, pan });
        playNoise({ duration: 0.4, volume: volume * 0.5,
                    filterFreq: 2000, delay, pan });
      }
      function playMeteorImpact(team="A", volume=0.5, delay=0) {
        const pan = panForTeamRandom(team);
        playNoise({ duration: 0.6, volume, filterFreq: 1500, delay, pan });
        playTone({ freq: 150, type: "sine", duration: 0.5,
                   volume: volume * 0.7, delay, sweepTo: 30, pan });
      }
      function playNukeSound(team="A") {
        const pan = panForTeam(team);
        playNoise({ duration: 1.5, volume: 0.4, filterFreq: 2000, pan });
        playTone({ freq: 100, type: "sine", duration: 1.6,
                   volume: 0.35, sweepTo: 20, pan });
        for (let i = 0; i < 5; i++) {
          playNoise({ duration: 0.3, volume: 0.15, filterFreq: 3000,
                      delay: 0.3 + i * 0.15, pan });
        }
      }
      function playWipeSound(team="A") {
        const pan = panForTeam(team);
        playTone({ freq: 200, type: "sawtooth", duration: 1.0,
                   volume: 0.2, sweepTo: 3000, pan });
        playTone({ freq: 300, type: "sine", duration: 2.0,
                   volume: 0.4, delay: 1.0, sweepTo: 25, pan });
      }
      function playHitSound(pan=0) {
        playTone({ freq: 1200, type: "square", duration: 0.04,
                   volume: 0.05, sweepTo: 400, pan });
      }
      function playKillSound(pan=0) {
        playTone({ freq: 880, type: "triangle", duration: 0.08, volume: 0.15, pan });
        playTone({ freq: 1175, type: "triangle", duration: 0.08,
                   volume: 0.15, delay: 0.08, pan });
        playTone({ freq: 1568, type: "triangle", duration: 0.12,
                   volume: 0.15, delay: 0.16, pan });
      }
      function playSawSpin(team="A", volume=0.4, duration=3) {
        const pan = panForTeam(team);
        for (let i = 0; i < 15; i++) {
          playTone({ freq: 1500 + Math.random() * 500,
                     type: "square", duration: 0.03,
                     volume: volume * 0.3,
                     delay: i * 0.15, pan });
        }
      }
      function playRocketLaunch(team = "A") {
        const pan = panForTeamRandom(team);
        playTone({ freq: 900, type: "sawtooth", duration: 0.18,
                   volume: 0.16, sweepTo: 200, pan });
        playTone({ freq: 180, type: "sine", duration: 0.1,
                   volume: 0.2, sweepTo: 60, delay: 0.04, pan });
      }
      function playGrenadeLaunch(team = "A") {
        const pan = panForTeamRandom(team);
        playTone({ freq: 1400, type: "square", duration: 0.06,
                   volume: 0.18, sweepTo: 500, pan });
        playTone({ freq: 400, type: "sawtooth", duration: 0.3,
                   volume: 0.14, sweepTo: 180, delay: 0.05, pan });
      }
      function playGrenadeExplosion(team = "A") {
        const pan = panForTeamRandom(team);
        playNoise({ duration: 0.2, volume: 0.55, filterFreq: 5000, pan });
        playTone({ freq: 140, type: "sine", duration: 0.9,
                   volume: 0.5, sweepTo: 30, pan });
        playNoise({ duration: 1.0, volume: 0.3, filterFreq: 400,
                    delay: 0.08, pan });
      }

      function playTornadoSound(team="A", volume=0.4, duration=3.0) {
        if (!soundEnabled || !audioCtx) return;
        const pan = panForTeam(team);
        const panner = makePanner(pan);
        if (!panner) return;
        const now = audioCtx.currentTime;
        const bufferSize = Math.floor(audioCtx.sampleRate * duration);
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          const t = i / bufferSize;
          const env = Math.pow(t, 0.6) * (1 - Math.pow(t, 4));
          const turbulence = 0.6 + Math.sin(t * 200 + Math.random() * 3) * 0.4;
          data[i] = (Math.random() * 2 - 1) * env * turbulence;
        }
        const src = audioCtx.createBufferSource();
        src.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(300, now);
        filter.frequency.exponentialRampToValueAtTime(900, now + duration);
        filter.Q.setValueAtTime(1.2, now);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(volume, now + duration * 0.6);
        gain.gain.linearRampToValueAtTime(0, now + duration);
        src.connect(filter);
        filter.connect(gain);
        gain.connect(panner);
        src.start(now); src.stop(now + duration);
      }
      function playWipeBlast(team="A", volume=0.6) {
        if (!soundEnabled || !audioCtx) return;
        const pan = panForTeam(team);
        const panner = makePanner(pan);
        if (!panner) return;
        const now = audioCtx.currentTime;
        const boomOsc = audioCtx.createOscillator();
        const boomGain = audioCtx.createGain();
        boomOsc.type = "sine";
        boomOsc.frequency.setValueAtTime(120, now);
        boomOsc.frequency.exponentialRampToValueAtTime(25, now + 2.5);
        boomGain.gain.setValueAtTime(0, now);
        boomGain.gain.linearRampToValueAtTime(volume, now + 0.03);
        boomGain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
        boomOsc.connect(boomGain);
        boomGain.connect(panner);
        boomOsc.start(now); boomOsc.stop(now + 2.5);
      }
      function playApocalypseSiren(team="A", volume=0.35, duration=2.5) {
        if (!soundEnabled || !audioCtx) return;
        const pan = panForTeam(team);
        const panner = makePanner(pan);
        if (!panner) return;
        const now = audioCtx.currentTime;
        const baseOsc = audioCtx.createOscillator();
        const baseGain = audioCtx.createGain();
        baseOsc.type = "sawtooth";
        baseOsc.frequency.setValueAtTime(400, now);
        baseOsc.frequency.linearRampToValueAtTime(900, now + duration);
        const lfo = audioCtx.createOscillator();
        const lfoGain = audioCtx.createGain();
        lfo.type = "sine";
        lfo.frequency.setValueAtTime(0.5, now);
        lfo.frequency.linearRampToValueAtTime(2.5, now + duration);
        lfoGain.gain.setValueAtTime(150, now);
        lfoGain.gain.linearRampToValueAtTime(250, now + duration);
        lfo.connect(lfoGain);
        lfoGain.connect(baseOsc.frequency);
        lfo.start(now); lfo.stop(now + duration);
        const filter = audioCtx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(800, now);
        filter.frequency.linearRampToValueAtTime(1400, now + duration);
        filter.Q.setValueAtTime(3, now);
        baseGain.gain.setValueAtTime(0, now);
        baseGain.gain.linearRampToValueAtTime(volume * 0.7, now + duration * 0.4);
        baseGain.gain.linearRampToValueAtTime(volume * 0.5, now + duration * 0.7);
        baseGain.gain.linearRampToValueAtTime(volume, now + duration);
        baseOsc.connect(filter);
        filter.connect(baseGain);
        baseGain.connect(panner);
        baseOsc.start(now); baseOsc.stop(now + duration);
      }

      /* ============================================================
         STATE
      ============================================================ */
      let players = [];
      let bullets = [];
      let effects = [];
      let grenades = [];
      let screenShake = 0;

      const DEFAULT_AVATAR =
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">
            <rect width="300" height="300" fill="#777"/>
            <circle cx="150" cy="110" r="55" fill="#ddd"/>
            <path d="M70 270 C75 195 225 195 230 270" fill="#ddd"/>
        </svg>`);

      function random(min, max) { return Math.random() * (max - min) + min; }
      function distance(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

      function deepPick(obj, ...keys) {
        if (!obj) return undefined;
        for (const k of keys) {
          if (obj[k] !== undefined && obj[k] !== null && obj[k] !== "") return obj[k];
        }
        const containers = ["user", "fromUser", "sender", "userData", "data", "gift"];
        for (const c of containers) {
          if (obj[c] && typeof obj[c] === "object") {
            for (const k of keys) {
              if (obj[c][k] !== undefined && obj[c][k] !== null && obj[c][k] !== "") {
                return obj[c][k];
              }
            }
          }
        }
        if (obj.gift && typeof obj.gift === "object") {
          if (obj.gift.name) return obj.gift.name;
          if (obj.gift.giftName) return obj.gift.giftName;
          if (obj.gift.id) return obj.gift.id;
        }
        if (obj.profilePicture && obj.profilePicture.url) return obj.profilePicture.url;
        if (obj.user && obj.user.profilePicture && obj.user.profilePicture.url) {
          return obj.user.profilePicture.url;
        }
        return undefined;
      }

      /* ============================================================
         JOIN POPUP
      ============================================================ */
      function showJoinPopup(username, team) {
        const container = document.getElementById("joinPopups");
        if (!container) return;

        const el = document.createElement("div");
        el.className = "joinPopup " + (team === "A" ? "teamA" : "teamB");

        const teamLabel = team === "A" ? "MESSI" : "RONALDO";
        el.textContent = `${username} joined ${teamLabel}!`;

        container.appendChild(el);
        setTimeout(() => el.remove(), 1800);

        while (container.children.length > 4) {
          container.removeChild(container.firstChild);
        }
      }

      /* ============================================================
         PLAYER
      ============================================================ */
      class Player {
        constructor(id, username, avatar, team) {
          this.id = id;
          this.username = username || "viewer";
          this.team = team;
          this.kills = 0;
          this.radius = 40;
          this.hp = START_HP;
          this.maxHp = START_HP;
          this.damage = 1;
          this.bulletSize = 5;
          this.speed = random(1.6, 2.6);
          this.lastShot = 0;
          this.shootDelay = 1000;
          this.angle = random(0, Math.PI * 2);
          if (team === "A") this.x = random(80, 450);
          else this.x = random(630, 1000);
          this.y = random(300, 1650);
          this.img = new Image();
          this.img.src = avatar || DEFAULT_AVATAR;
          this.img.onerror = () => { this.img.src = DEFAULT_AVATAR; };

          this.megaScale = 1;
          this.megaTimer = 0;
        }

        grow() {
          this.kills++;
          this.radius = Math.min(62, 50 + this.kills * 1.8);
          this.maxHp = Math.min(MAX_HP_CAP, Math.max(this.maxHp, START_HP + this.kills * 15));
          this.hp = Math.min(this.maxHp, this.hp + 30);
          this.hp = Math.min(this.maxHp, this.hp + 25);
          this.damage = 1;
          this.bulletSize = Math.min(10, 5 + this.kills * 0.25);
          this.speed = Math.min(4.0, this.speed + 0.06);
        }

        heal(amount) {
          if (this.hp <= 0) return 0;
          const before = this.hp;
          this.hp = Math.min(this.maxHp, this.hp + amount);
          return this.hp - before;
        }

        findEnemy() {
          const enemies = players.filter((p) => p.team !== this.team && p.hp > 0);
          if (enemies.length === 0) return null;
          let closest = enemies[0];
          let closestDistance = distance(this, closest);
          for (let i = 1; i < enemies.length; i++) {
            const d = distance(this, enemies[i]);
            if (d < closestDistance) { closest = enemies[i]; closestDistance = d; }
          }
          return closest;
        }

        shoot(now) {
          if (now - this.lastShot < this.shootDelay) return;
          const target = this.findEnemy();
          if (!target) return;
          const angle = Math.atan2(target.y - this.y, target.x - this.x);
          bullets.push({
            x: this.x, y: this.y, team: this.team, ownerId: this.id,
            targetId: target.id, angle,
            speed: 30,
            damage: this.damage,
            size: this.bulletSize,
            missileType: "normal",
          });
          this.lastShot = now;
        }

        move() {
          this.angle += random(-0.015, 0.015);

          let nx = this.x + Math.cos(this.angle) * this.speed;
          let ny = this.y + Math.sin(this.angle) * this.speed;

          const minX = this.team === "A" ? 60 : 580;
          const maxX = this.team === "A" ? 500 : 1020;
          const minY = 180;
          const maxY = 1750;

          if (nx < minX || nx > maxX) {
            this.angle = Math.PI - this.angle;
            nx = Math.max(minX, Math.min(maxX, nx));
          }
          if (ny < minY || ny > maxY) {
            this.angle = -this.angle;
            ny = Math.max(minY, Math.min(maxY, ny));
          }

          this.angle += random(-0.05, 0.05);
          if (this.angle > Math.PI) this.angle -= Math.PI * 2;
          if (this.angle < -Math.PI) this.angle += Math.PI * 2;

          this.x = nx;
          this.y = ny;
        }

        update(now) { this.move(); this.shoot(now); }

        draw() {
          ctx.save();

          const scale = this.megaScale || 1;

          if (scale > 1.05) {
            const pulse = 1 + Math.sin(Date.now() * 0.006) * 0.08;
            const glowR = this.radius * scale * 1.6 * pulse;

            const grad = ctx.createRadialGradient(
              this.x, this.y, 0, this.x, this.y, glowR);
            grad.addColorStop(0, "rgba(255,255,255,0.35)");
            grad.addColorStop(0.4, this.team === "A"
              ? "rgba(120,200,255,0.25)"
              : "rgba(120,255,150,0.25)");
            grad.addColorStop(1, "rgba(0,0,0,0)");
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(this.x, this.y, glowR, 0, Math.PI * 2);
            ctx.fill();

            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(Date.now() * 0.002);
            ctx.beginPath();
            ctx.arc(0, 0, this.radius * scale * 1.2, 0, Math.PI * 2);
            ctx.strokeStyle = this.team === "A"
              ? "rgba(150,220,255,0.9)"
              : "rgba(150,255,180,0.9)";
            ctx.lineWidth = 6;
            ctx.shadowColor = this.team === "A" ? "#5cc9ff" : "#3aff6c";
            ctx.shadowBlur = 40;
            ctx.stroke();
            ctx.restore();
          }

          const drawRadius = this.radius * scale;

          const barScale = scale > 1.05 ? scale : 1;
          const barWidth = this.radius * 2 * barScale;
          const barHeight = 18 * barScale;
          const barX = this.x - barWidth / 2;
          const barY = this.y - this.radius * barScale - 35 * barScale;
          ctx.fillStyle = "#333";
          ctx.fillRect(barX, barY, barWidth, barHeight);
          ctx.fillStyle = "#39ff14";
          const hpPercent = Math.max(0, this.hp / this.maxHp);
          ctx.fillRect(barX, barY, barWidth * hpPercent, barHeight);

          ctx.textAlign = "center";
          const baseFont = Math.max(22, Math.min(40, this.radius * 0.6));
          const nameFont = scale > 1.05
            ? Math.floor(baseFont * scale * 0.7)
            : baseFont;
          ctx.font = "bold " + nameFont + "px Arial";
          ctx.fillStyle = this.team === "A" ? "#111" : "#fff";

          let displayName = this.username;
          if (scale <= 1.05 && displayName.length > 12) {
            displayName = displayName.substring(0, 12) + "...";
          }
          const nameY = this.y - this.radius * scale - 40;
          const nameText = displayName + "  💀" + this.kills;

          if (scale > 1.05) {
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 5;
            ctx.strokeText(nameText, this.x, nameY);
          }
          ctx.fillText(nameText, this.x, nameY);

          ctx.save();
          ctx.beginPath();
          ctx.arc(this.x, this.y, drawRadius, 0, Math.PI * 2);
          ctx.clip();
          if (this.img.complete) {
            try {
              ctx.drawImage(this.img,
                this.x - drawRadius, this.y - drawRadius,
                drawRadius * 2, drawRadius * 2);
            } catch (e) { drawDefaultAvatar(this.x, this.y, drawRadius); }
          } else drawDefaultAvatar(this.x, this.y, drawRadius);
          ctx.restore();

          if (scale > 1.05) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(this.x, this.y, drawRadius, 0, Math.PI * 2);
            ctx.strokeStyle = this.team === "A" ? "#7cc9ff" : "#6effa0";
            ctx.lineWidth = 8;
            ctx.shadowColor = this.team === "A" ? "#5cc9ff" : "#3aff6c";
            ctx.shadowBlur = 40;
            ctx.stroke();
            ctx.restore();
          }

          ctx.restore();
        }
      }

      function drawDefaultAvatar(x, y, radius) {
        ctx.fillStyle = "#777";
        ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
        ctx.fillStyle = "#ddd";
        ctx.beginPath();
        ctx.arc(x, y - radius * 0.2, radius * 0.35, 0, Math.PI * 2);
        ctx.fill();
      }

      function addPlayer(username, avatar, team) {
        if (!username) username = "viewer_" + Math.floor(Math.random() * 9999);
        const existing = players.find((p) => p.id === username);
        if (existing) {
          existing.hp = Math.min(existing.maxHp, existing.hp + 20);
          logDebug(`Already joined: ${username} (${existing.team})`);
          return existing;
        }
        const player = new Player(username, username, avatar, team);
        players.push(player);
        createJoinEffect(player);
        updateStatus();
        logDebug(`+ ${username} joined TEAM ${team}`);
        return player;
      }

      function createJoinEffect(player) {
        effects.push({ type: "join", x: player.x, y: player.y,
                       team: player.team, life: 60, maxLife: 60 });
      }

      function getSenderOrigin(senderId, senderTeam) {
        const sender = players.find(p => p.id === senderId && p.hp > 0);
        if (sender) return { x: sender.x, y: sender.y, player: sender };
        return {
          x: senderTeam === "A" ? random(30, 300) : random(780, 1050),
          y: random(300, 1600),
          player: null,
        };
      }

      function spawnGiftLaunch(senderId, senderTeam, icon) {
        const origin = getSenderOrigin(senderId, senderTeam);
        effects.push({
          type: "giftLaunch",
          x: origin.x,
          y: origin.y,
          team: senderTeam,
          icon: icon || "✨",
          life: 45, maxLife: 45,
          playerRef: origin.player,
        });
        if (origin.player) {
          effects.push({
            type: "senderGlow",
            playerRef: origin.player,
            team: senderTeam,
            life: 120, maxLife: 120,
          });
        }
        return origin;
      }

      /* ============================================================
         ROSE VOLLEY — LOCKED ON ONE ENEMY, CURVED ARCS
         Arc fades near the target so roses always land.
      ============================================================ */
      function fireRoseVolley(senderTeam, senderId, lockedTarget) {
        if (!lockedTarget || lockedTarget.hp <= 0) return;

        const targetId = lockedTarget.id;
        const ROSE_BULLETS = 5;
        const STREAM_DELAY = 280;

        for (let i = 0; i < ROSE_BULLETS; i++) {
          setTimeout(() => {
            const target = players.find(p => p.id === targetId && p.hp > 0);
            if (!target) return;

            const origin = getSenderOrigin(senderId, senderTeam);

            const spread = (i - 2) * 30;
            const startX = origin.x + (senderTeam === "A" ? -30 : 30);
            const startY = origin.y + spread;

            const angleToTarget = Math.atan2(
              target.y - startY,
              target.x - startX
            );

            const arcDirection = (i % 2 === 0) ? 1 : -1;

            effects.push({
              type: "roseLaunch",
              x: startX, y: startY,
              team: senderTeam,
              life: 18, maxLife: 18,
            });

            bullets.push({
              x: startX,
              y: startY,
              team: senderTeam,
              ownerId: "__gift__",
              senderId,
              targetId: target.id,
              angle: angleToTarget,
              speed: 34,
              damage: 3,
              size: 18,
              missileType: "rose",
              homing: true,
              homingStrength: 0.25,
              trailTimer: 0,
              arcPhase: 0,
              arcAmount: 260 + Math.random() * 80,
              arcDirection,
              arcDuration: 55,
              life: 200,
            });

            effects.push({
              type: "spark",
              x: startX, y: startY,
              team: senderTeam,
              life: 15, maxLife: 15,
            });
          }, i * STREAM_DELAY);
        }
      }

      /* ============================================================
         HEART VOLLEY
      ============================================================ */
      function fireHeartVolley(senderTeam, senderId, enemyTargets) {
        const enemyTeam = senderTeam === "A" ? "B" : "A";
        const origin = getSenderOrigin(senderId, senderTeam);

        const enemyLeft  = enemyTeam === "A" ? 0 : GAME_WIDTH / 2;
        const enemyRight = enemyTeam === "A" ? GAME_WIDTH / 2 : GAME_WIDTH;
        const centerX = (enemyLeft + enemyRight) / 2;
        const centerY = GAME_HEIGHT / 2;

        const shuffled = [...(enemyTargets || [])].sort(() => Math.random() - 0.5);
        const hitList = [];
        for (let i = 0; i < 5; i++) {
          hitList.push(shuffled.length ? shuffled[i % shuffled.length] : null);
        }

        effects.push({
          type: "bigHeart",
          startX: origin.x,
          startY: origin.y,
          targetX: centerX,
          targetY: centerY,
          x: origin.x,
          y: origin.y,
          team: senderTeam,
          senderId,
          hitList,
          life: 110, maxLife: 110,
          stageTimer: 0,
          flyDuration: 40,
          startSize: 30,
          endSize: 120,
          size: 30,
          exploded: false,
        });
      }

      /* ============================================================
         GRENADE VOLLEY
      ============================================================ */
      function fireGrenadeVolley(senderTeam, senderId, enemyTargets) {
        if (!enemyTargets || enemyTargets.length === 0) return;

        const GRENADE_COUNT = 3;
        const STREAM_DELAY = 350;

        const shuffled = [...enemyTargets].sort(() => Math.random() - 0.5);

        for (let i = 0; i < GRENADE_COUNT; i++) {
          setTimeout(() => {
            const origin = getSenderOrigin(senderId, senderTeam);

            let target = shuffled[i % shuffled.length];
            const enemyTeam = senderTeam === "A" ? "B" : "A";
            if (!target || target.hp <= 0) {
              const alive = players.filter(p => p.team === enemyTeam && p.hp > 0);
              if (alive.length === 0) return;
              target = alive[Math.floor(Math.random() * alive.length)];
            }

            const startX = origin.x;
            const startY = origin.y;
            const endX = target.x + random(-40, 40);
            const endY = target.y + random(-40, 40);
            const dx = endX - startX;
            const dy = endY - startY;
            const dist = Math.hypot(dx, dy);
            const flightFrames = Math.max(40, Math.floor(dist / 12));

            grenades.push({
              startX, startY, endX, endY,
              frame: 0,
              flightFrames,
              arcHeight: Math.min(400, dist * 0.5),
              team: senderTeam,
              senderId,
              spin: random(0, Math.PI * 2),
              spinSpeed: random(0.25, 0.45) * (Math.random() < 0.5 ? 1 : -1),
              trail: [],
            });

            playGrenadeLaunch(senderTeam);
          }, i * STREAM_DELAY);
        }
      }

      function fireMissiles({ senderTeam, targets, count = 5, damage = 4,
                              missileType = "rocket", senderId }) {
        if (!targets || targets.length === 0) return;
        const STREAM_DELAY = 120;
        for (let i = 0; i < count; i++) {
          setTimeout(() => {
            const origin = getSenderOrigin(senderId, senderTeam);
            const target = targets[i % targets.length];
            if (!target || target.hp <= 0) return;
            const angleToTarget = Math.atan2(
              target.y - origin.y,
              target.x - origin.x
            );
            bullets.push({
              x: origin.x, y: origin.y,
              team: senderTeam,
              ownerId: "__gift__",
              senderId,
              targetId: target.id,
              angle: angleToTarget,
              speed: 24,
              damage,
              size: 14,
              missileType,
            });
          }, i * STREAM_DELAY);
        }
      }

      /* ============================================================
         SAW BLADE HELPER
      ============================================================ */
      function drawSawBlade(x, y, radius, angle, color = "#e8e8f4", glow = "#ff00ff", spikes = 12) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.shadowColor = glow;
        ctx.shadowBlur = 35;

        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.72, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(20,0,40,0.95)";
        ctx.fill();

        ctx.beginPath();
        const outer = radius;
        const inner = radius * 0.72;
        for (let i = 0; i < spikes; i++) {
          const a1 = (i / spikes) * Math.PI * 2;
          const a2 = ((i + 0.5) / spikes) * Math.PI * 2;
          const a3 = ((i + 1) / spikes) * Math.PI * 2;
          const p1x = Math.cos(a1) * inner, p1y = Math.sin(a1) * inner;
          const p2x = Math.cos(a2) * outer, p2y = Math.sin(a2) * outer;
          const p3x = Math.cos(a3) * inner, p3y = Math.sin(a3) * inner;
          if (i === 0) ctx.moveTo(p1x, p1y);
          else ctx.lineTo(p1x, p1y);
          ctx.lineTo(p2x, p2y);
          ctx.lineTo(p3x, p3y);
        }
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.18, 0, Math.PI * 2);
        ctx.fillStyle = "#222";
        ctx.fill();
        ctx.strokeStyle = "#ff66ff";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.restore();
      }

      /* ============================================================
         GRENADE UPDATE
      ============================================================ */
      function updateGrenades() {
        for (let i = grenades.length - 1; i >= 0; i--) {
          const g = grenades[i];
          g.frame++;
          g.spin += g.spinSpeed;

          const t = Math.min(1, g.frame / g.flightFrames);
          const x = g.startX + (g.endX - g.startX) * t;
          const arcOffset = -Math.sin(t * Math.PI) * g.arcHeight;
          const y = g.startY + (g.endY - g.startY) * t + arcOffset;

          g.trail.push({ x, y });
          if (g.trail.length > 12) g.trail.shift();

          ctx.save();
          for (let k = 0; k < g.trail.length; k++) {
            const tp = g.trail[k];
            const alpha = (k / g.trail.length) * 0.35;
            const r = 6 + k * 0.8;
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.arc(tp.x, tp.y, r, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(90,90,90,1)";
            ctx.fill();
          }
          ctx.restore();

          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(g.spin);
          ctx.shadowColor = "#3aff6c";
          ctx.shadowBlur = 25;

          ctx.beginPath();
          ctx.arc(0, 0, 22, 0, Math.PI * 2);
          const bodyGrad = ctx.createRadialGradient(-6, -6, 2, 0, 0, 24);
          bodyGrad.addColorStop(0, "#6aff9b");
          bodyGrad.addColorStop(0.4, "#2e8c4d");
          bodyGrad.addColorStop(1, "#0a2b17");
          ctx.fillStyle = bodyGrad;
          ctx.fill();

          ctx.shadowBlur = 0;
          ctx.beginPath();
          ctx.arc(-6, -6, 6, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(220,255,230,0.8)";
          ctx.fill();

          ctx.strokeStyle = "rgba(0,0,0,0.5)";
          ctx.lineWidth = 1.5;
          for (let s = -18; s <= 18; s += 6) {
            ctx.beginPath();
            ctx.moveTo(s, -22);
            ctx.lineTo(s, 22);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-22, s);
            ctx.lineTo(22, s);
            ctx.stroke();
          }

          ctx.beginPath();
          ctx.arc(0, -22, 6, 0, Math.PI * 2);
          ctx.fillStyle = "#d9d9d9";
          ctx.fill();
          ctx.strokeStyle = "#333";
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(6, -26, 5, 0, Math.PI * 2);
          ctx.strokeStyle = "#ffcc55";
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.restore();

          const blink = Math.floor(g.frame / 6) % 2 === 0;
          if (blink) {
            ctx.save();
            ctx.globalAlpha = 0.9;
            ctx.shadowColor = "#ff2222";
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.arc(x, y, 5, 0, Math.PI * 2);
            ctx.fillStyle = "#ff3333";
            ctx.fill();
            ctx.restore();
          }

          if (t >= 1) {
            explodeGrenade(g.endX, g.endY, g.team, g.senderId);
            grenades.splice(i, 1);
          }
        }
      }

      function explodeGrenade(x, y, senderTeam, senderId) {
        const enemyTeam = senderTeam === "A" ? "B" : "A";
        const BLAST_RADIUS = 160;
        const MAIN_DMG = 12;
        const SPLASH_DMG = 6;

        let primary = null;
        let bestD = Infinity;
        for (const p of players) {
          if (p.team !== enemyTeam || p.hp <= 0) continue;
          const d = Math.hypot(p.x - x, p.y - y);
          if (d < bestD) { bestD = d; primary = p; }
        }

        for (const p of players) {
          if (p.team !== enemyTeam || p.hp <= 0) continue;
          const d = Math.hypot(p.x - x, p.y - y);
          if (d > BLAST_RADIUS) continue;
          const dmg = (p === primary) ? MAIN_DMG : SPLASH_DMG;
          p.hp -= dmg;
          createDamageNumber(p.x, p.y, dmg);
          if (p.hp <= 0) {
            createKillEffect(p);
            playKillSound(panForTeamRandom(p.team));
            rewardSenderForGiftKill(senderId, 25);
          }
        }

        if (senderId) {
          const sender = players.find(p => p.id === senderId && p.hp > 0);
          if (sender) {
            const healed = sender.heal(2);
            if (healed > 0) createHealNumber(sender.x, sender.y, healed);
          }
        }

        effects.push({
          type: "grenadeBlast",
          x, y,
          team: senderTeam,
          life: 45, maxLife: 45,
          radius: BLAST_RADIUS,
        });

        for (let k = 0; k < 14; k++) {
          const a = Math.random() * Math.PI * 2;
          const sp = random(6, 14);
          effects.push({
            type: "grenadeShard",
            x, y,
            vx: Math.cos(a) * sp,
            vy: Math.sin(a) * sp,
            angle: a,
            spin: random(-0.4, 0.4),
            team: senderTeam,
            life: 70, maxLife: 70,
          });
        }

        for (let k = 0; k < 8; k++) {
          const a = Math.random() * Math.PI * 2;
          effects.push({
            type: "spark",
            x: x + Math.cos(a) * random(0, 30),
            y: y + Math.sin(a) * random(0, 30),
            team: senderTeam,
            life: 20, maxLife: 20,
          });
        }

        screenShake = Math.max(screenShake, 22);
        playGrenadeExplosion(senderTeam);
      }

      /* ============================================================
         BULLET UPDATE
      ============================================================ */
      function updateBullets() {
        for (let i = bullets.length - 1; i >= 0; i--) {
          const bullet = bullets[i];

          const isRose = bullet.ownerId === "__gift__" && bullet.missileType === "rose";
          const isHeart = bullet.ownerId === "__gift__" && bullet.missileType === "heart";

          if (isRose && bullet.homing) {
            const target = players.find(p => p.id === bullet.targetId && p.hp > 0);

            let distanceToTarget = Infinity;

            if (target) {
              const dx = target.x - bullet.x;
              const dy = target.y - bullet.y;
              distanceToTarget = Math.hypot(dx, dy);

              const wantAngle = Math.atan2(dy, dx);
              let diff = wantAngle - bullet.angle;
              while (diff > Math.PI) diff -= Math.PI * 2;
              while (diff < -Math.PI) diff += Math.PI * 2;
              const homing = distanceToTarget < 250 ? 0.5 : 0.25;
              bullet.angle += diff * homing;
            }

            const arc = bullet.arcAmount || 120;
            const dir = bullet.arcDirection || 1;
            const dur = bullet.arcDuration || 45;

            bullet.arcPhase = (bullet.arcPhase || 0) + (Math.PI / dur);

            const arcStrength = Math.min(1, Math.max(0,
              (distanceToTarget - 120) / 280));
            const arcOffset = Math.sin(bullet.arcPhase) * arc * dir * arcStrength;

            const straightX = Math.cos(bullet.angle) * bullet.speed;
            const straightY = Math.sin(bullet.angle) * bullet.speed;
            const perpX = -Math.sin(bullet.angle);
            const perpY = Math.cos(bullet.angle);

            bullet.x += straightX + perpX * arcOffset * 0.14;
            bullet.y += straightY + perpY * arcOffset * 0.14;

            bullet.life = (bullet.life || 200) - 1;
            if (bullet.life <= 0) {
              bullets.splice(i, 1);
              continue;
            }

            bullet.trailTimer = (bullet.trailTimer || 0) + 1;
            if (bullet.trailTimer % 2 === 0) {
              effects.push({
                type: "rosePetal",
                x: bullet.x, y: bullet.y,
                team: bullet.team,
                life: 25, maxLife: 25,
              });
            }
          }
          else if (isHeart && bullet.heartFallback) {
            const enemyTeam = bullet.team === "A" ? "B" : "A";
            let target = players.find(p => p.id === bullet.targetId && p.hp > 0);

            if (!target) {
              const alive = players.filter(p => p.team === enemyTeam && p.hp > 0);
              if (alive.length > 0) {
                let nearest = alive[0];
                let bestD = Math.hypot(bullet.x - nearest.x, bullet.y - nearest.y);
                for (let k = 1; k < alive.length; k++) {
                  const d = Math.hypot(bullet.x - alive[k].x, bullet.y - alive[k].y);
                  if (d < bestD) { nearest = alive[k]; bestD = d; }
                }
                target = nearest;
                bullet.targetId = target.id;
                bullet.heartLastX = target.x;
                bullet.heartLastY = target.y;
              } else {
                target = {
                  id: "__none__",
                  x: bullet.heartLastX,
                  y: bullet.heartLastY,
                  hp: 1,
                  team: enemyTeam,
                };
              }
            } else {
              bullet.heartLastX = target.x;
              bullet.heartLastY = target.y;
            }

            const dx = target.x - bullet.x;
            const dy = target.y - bullet.y;
            const wantAngle = Math.atan2(dy, dx);
            let diff = wantAngle - bullet.angle;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            bullet.angle += diff * 0.18;

            bullet.x += Math.cos(bullet.angle) * bullet.speed;
            bullet.y += Math.sin(bullet.angle) * bullet.speed;

            if (target.id === "__none__") {
              const dToSpot = Math.hypot(bullet.x - bullet.heartLastX,
                                         bullet.y - bullet.heartLastY);
              if (dToSpot < 20) {
                createExplosion(bullet.x, bullet.y, bullet.team);
                bullets.splice(i, 1);
                continue;
              }
            }
          }
          else {
            bullet.x += Math.cos(bullet.angle) * bullet.speed;
            bullet.y += Math.sin(bullet.angle) * bullet.speed;
          }

          if (bullet.x < -120 || bullet.x > GAME_WIDTH + 120 ||
              bullet.y < -120 || bullet.y > GAME_HEIGHT + 120) {
            bullets.splice(i, 1);
            continue;
          }

          const isGift = bullet.ownerId === "__gift__";
          const teamColor = bullet.team === "A" ? "#ff304f" : "#00d9ff";
          const teamGlow = bullet.team === "A"
            ? "rgba(255,48,79,0.9)" : "rgba(0,217,255,0.9)";

          ctx.save();
          ctx.translate(bullet.x, bullet.y);
          ctx.rotate(bullet.angle);

          if (isGift && bullet.missileType === "heart") {
            ctx.shadowColor = "#ff3e8a";
            ctx.shadowBlur = 30;
            ctx.font = `${bullet.size * 2.4}px Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("💗", 0, 0);
            if (Math.random() < 0.5) {
              effects.push({
                type: "heartTrail",
                x: bullet.x - Math.cos(bullet.angle) * 20,
                y: bullet.y - Math.sin(bullet.angle) * 20,
                life: 20, maxLife: 20,
              });
            }
          }
          else if (isGift && bullet.missileType === "rose") {
            const flameFlicker = 0.8 + Math.random() * 0.4;
            const flameLen = bullet.size * (1.4 + flameFlicker * 0.6);
            const flameWid = bullet.size * 0.7 * flameFlicker;

            ctx.save();
            ctx.shadowColor = "#ff8800";
            ctx.shadowBlur = 30;
            const outerGrad = ctx.createLinearGradient(-flameLen, 0, 0, 0);
            outerGrad.addColorStop(0, "rgba(255,80,0,0)");
            outerGrad.addColorStop(0.5, "rgba(255,140,40,0.7)");
            outerGrad.addColorStop(1, "rgba(255,220,120,1)");
            ctx.fillStyle = outerGrad;
            ctx.beginPath();
            ctx.moveTo(-flameLen, 0);
            ctx.lineTo(0, -flameWid);
            ctx.lineTo(0, flameWid);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            ctx.shadowColor = bullet.team === "A"
              ? "rgba(255,80,120,0.9)"
              : "rgba(80,200,255,0.9)";
            ctx.shadowBlur = 30;
            ctx.font = `${bullet.size * 2.4}px Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🌹", 0, 0);
          }
          else if (isGift && bullet.missileType === "rocket") {
            const bodyLen = bullet.size * 5;
            const bodyWid = bullet.size * 1.3;
            const flameLen = bullet.size * (2 + Math.random());

            ctx.shadowColor = "#ff6600";
            ctx.shadowBlur = 25;

            const fg = ctx.createLinearGradient(-bodyLen * 0.5 - flameLen, 0, -bodyLen * 0.5, 0);
            fg.addColorStop(0, "rgba(255,50,0,0)");
            fg.addColorStop(0.5, "rgba(255,140,30,0.85)");
            fg.addColorStop(1, "rgba(255,240,140,1)");
            ctx.fillStyle = fg;
            ctx.beginPath();
            ctx.moveTo(-bodyLen * 0.5 - flameLen, 0);
            ctx.lineTo(-bodyLen * 0.5, -bodyWid * 0.8);
            ctx.lineTo(-bodyLen * 0.5, bodyWid * 0.8);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = "#dddddd";
            ctx.beginPath();
            ctx.roundRect(-bodyLen * 0.5, -bodyWid * 0.5, bodyLen, bodyWid, bodyWid * 0.5);
            ctx.fill();

            ctx.fillStyle = teamColor;
            ctx.beginPath();
            ctx.moveTo(bodyLen * 0.5, -bodyWid * 0.5);
            ctx.lineTo(bodyLen * 0.5, bodyWid * 0.5);
            ctx.lineTo(bodyLen * 0.5 + bodyWid * 1.2, 0);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(-bodyLen * 0.4, -bodyWid * 0.5);
            ctx.lineTo(-bodyLen * 0.5, -bodyWid * 1.4);
            ctx.lineTo(-bodyLen * 0.25, -bodyWid * 0.5);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(-bodyLen * 0.4, bodyWid * 0.5);
            ctx.lineTo(-bodyLen * 0.5, bodyWid * 1.4);
            ctx.lineTo(-bodyLen * 0.25, bodyWid * 0.5);
            ctx.closePath();
            ctx.fill();
          }
          else if (isGift) {
            ctx.shadowColor = teamGlow;
            ctx.shadowBlur = 25;
            const bodyLen = bullet.size * 4.5;
            const bodyWid = bullet.size * 1.1;
            ctx.fillStyle = teamColor;
            ctx.beginPath();
            ctx.roundRect(-bodyLen * 0.5, -bodyWid * 0.5,
                          bodyLen, bodyWid, bodyWid * 0.5);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = "rgba(0,0,0,0.25)";
            ctx.beginPath();
            ctx.roundRect(-bodyLen * 0.45, -bodyWid * 0.15,
                          bodyLen * 0.9, bodyWid * 0.3, bodyWid * 0.15);
            ctx.fill();
            ctx.shadowColor = "#ffffff";
            ctx.shadowBlur = 15;
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(bodyLen * 0.5, 0, bodyWid * 0.55, 0, Math.PI * 2);
            ctx.fill();
          }
          else {
            ctx.shadowColor = teamColor;
            ctx.shadowBlur = 12;
            ctx.fillStyle = teamColor;
            ctx.beginPath();
            ctx.roundRect(-bullet.size * 2.5, -bullet.size * 0.55,
                          bullet.size * 5, bullet.size * 1.1, bullet.size * 0.5);
            ctx.fill();
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(bullet.size * 2, 0, bullet.size * 0.35, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();

          let hit = null;
          for (const player of players) {
            if (player.team === bullet.team) continue;
            if (player.hp <= 0) continue;
            const d = Math.hypot(player.x - bullet.x, player.y - bullet.y);
            if (d < player.radius + bullet.size) { hit = player; break; }
          }

          if (hit) {
            hit.hp -= bullet.damage;
            createDamageNumber(hit.x, hit.y, Math.round(bullet.damage));

            if (isGift && bullet.senderId) {
              const sender = players.find(p => p.id === bullet.senderId && p.hp > 0);
              if (sender) {
                let healAmt = 1;
                if (bullet.missileType === "heart") healAmt = 2;
                else if (bullet.missileType === "rocket") healAmt = 1;
                else if (bullet.missileType === "rose") healAmt = 1;
                const healed = sender.heal(healAmt);
                if (healed > 0) createHealNumber(sender.x, sender.y, healed);
              }
            }

            const hitPan = panForTeamRandom(hit.team);
            if (isGift) {
              createExplosion(hit.x, hit.y, hit.team);
            } else {
              playHitSound(hitPan);
            }
            bullets.splice(i, 1);
            if (hit.hp <= 0) {
              const killer = players.find((p) => p.id === bullet.ownerId);
              if (killer) killer.grow();
              if (isGift && bullet.senderId) {
                const sender = players.find((p) => p.id === bullet.senderId);
                if (sender && sender.id !== (killer && killer.id)) {
                  sender.grow();
                }
              }
              createKillEffect(hit);
              playKillSound(hitPan);
            }
          }
        }
      }

      function createExplosion(x, y, team) {
        effects.push({ type: "explosion", x, y, team, life: 35, maxLife: 35 });
        for (let i = 0; i < 6; i++) {
          const a = (Math.PI * 2 * i) / 6 + Math.random() * 0.5;
          effects.push({
            type: "particle", x, y,
            vx: Math.cos(a) * random(4, 9),
            vy: Math.sin(a) * random(4, 9),
            team, life: 30, maxLife: 30,
          });
        }
      }
      function createKillEffect(player) {
        effects.push({ type: "kill", x: player.x, y: player.y,
                       life: 70, maxLife: 70 });
      }
      function createDamageNumber(x, y, amount) {
        effects.push({
          type: "damageNumber",
          x: x + random(-15, 15),
          y: y - 30,
          amount: amount,
          life: 60, maxLife: 60,
        });
      }
      function createHealNumber(x, y, amount) {
        effects.push({
          type: "healNumber",
          x: x + random(-15, 15),
          y: y - 30,
          amount: amount,
          life: 60, maxLife: 60,
        });
      }

      function drawLightningArc(x1, y1, x2, y2, alpha) {
        if (alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha = alpha;
        const dx = x2 - x1;
        const dy = y2 - y1;
        const dist = Math.hypot(dx, dy);
        const segments = Math.max(4, Math.floor(dist / 40));
        ctx.strokeStyle = `rgba(150,200,255,${alpha * 0.8})`;
        ctx.lineWidth = 6;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        for (let i = 1; i < segments; i++) {
          const t = i / segments;
          const jx = (Math.random() - 0.5) * 40;
          const jy = (Math.random() - 0.5) * 40;
          ctx.lineTo(x1 + dx * t + jx, y1 + dy * t + jy);
        }
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      }

      /* ============================================================
         DRAW EFFECTS
      ============================================================ */
      function drawEffects() {
        for (let i = effects.length - 1; i >= 0; i--) {
          const effect = effects[i];
          if (effect.delay && effect.delay > 0) { effect.delay--; continue; }
          effect.life--;
          if (effect.life <= 0) { effects.splice(i, 1); continue; }
          const progress = 1 - effect.life / effect.maxLife;
          const alphaFade = Math.min(1, effect.life / 20);
          if (alphaFade < 0.02 && effect.type !== "huntingGhost" &&
              effect.type !== "chainLightning" &&
              effect.type !== "vortexPull" &&
              effect.type !== "vortexSpiral" &&
              effect.type !== "deathSawEmerge" &&
              effect.type !== "meteor" &&
              effect.type !== "bigHeart") continue;

          if (effect.type === "giftLaunch") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            const r = 20 + progress * 150;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, r, 0, Math.PI * 2);
            ctx.strokeStyle = effect.team === "A"
              ? `rgba(120,200,255,${alpha})`
              : `rgba(120,255,150,${alpha})`;
            ctx.lineWidth = 10 * (1 - progress) + 2;
            ctx.stroke();
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.font = "90px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowColor = effect.team === "A" ? "#5cc9ff" : "#3aff6c";
            ctx.shadowBlur = 30;
            ctx.fillText(effect.icon, effect.x, effect.y - progress * 90);
            ctx.restore();
          }

          if (effect.type === "senderGlow") {
            const p = effect.playerRef;
            if (!p || p.hp <= 0) continue;
            const alpha = Math.min(1, effect.life / 40);
            const r = p.radius + 18 + Math.sin(Date.now() * 0.012) * 6;
            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.strokeStyle = effect.team === "A"
              ? `rgba(120,200,255,${alpha})`
              : `rgba(120,255,150,${alpha})`;
            ctx.lineWidth = 6;
            ctx.shadowColor = effect.team === "A" ? "#5cc9ff" : "#3aff6c";
            ctx.shadowBlur = 25;
            ctx.stroke();
            ctx.shadowBlur = 0;
          }

          if (effect.type === "join") {
            const radius = 30 + progress * 120;
            const a = 1 - progress;
            if (a < 0.05) continue;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, radius, 0, Math.PI * 2);
            ctx.strokeStyle = effect.team === "A"
              ? `rgba(120,200,255,${a})` : `rgba(120,255,150,${a})`;
            ctx.lineWidth = 10;
            ctx.stroke();
          }

          if (effect.type === "explosion") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            const tc = effect.team === "A" ? "120,200,255" : "120,255,150";
            const r1 = 15 + progress * 100;
            const grad = ctx.createRadialGradient(
              effect.x, effect.y, 0, effect.x, effect.y, r1);
            grad.addColorStop(0, `rgba(${tc},${alpha * 0.5})`);
            grad.addColorStop(0.4, `rgba(${tc},${alpha * 0.3})`);
            grad.addColorStop(1, `rgba(${tc},0)`);
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, r1, 0, Math.PI * 2);
            ctx.fill();
            const r2 = 20 * (1 - progress) + 5;
            ctx.fillStyle = `rgba(255,255,255,${alpha * 0.9})`;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, r2, 0, Math.PI * 2);
            ctx.fill();
          }

          if (effect.type === "particle") {
            effect.x += effect.vx;
            effect.y += effect.vy;
            effect.vx *= 0.94;
            effect.vy *= 0.94;
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            const size = 5 * (1 - progress) + 1;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, size, 0, Math.PI * 2);
            ctx.fillStyle = effect.team === "A"
              ? `rgba(120,200,255,${alpha})`
              : `rgba(120,255,150,${alpha})`;
            ctx.fill();
          }

          if (effect.type === "spark") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, 4 + progress * 6, 0, Math.PI * 2);
            ctx.fillStyle = effect.team === "A"
              ? `rgba(120,200,255,${alpha})`
              : `rgba(120,255,150,${alpha})`;
            ctx.fill();
          }

          if (effect.type === "roseLaunch") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            const r = 10 + progress * 50;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.shadowColor = effect.team === "A" ? "#ff5c8a" : "#5cc9ff";
            ctx.shadowBlur = 30;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, r, 0, Math.PI * 2);
            ctx.strokeStyle = effect.team === "A"
              ? `rgba(255,100,150,${alpha})`
              : `rgba(100,200,255,${alpha})`;
            ctx.lineWidth = 8 * (1 - progress) + 2;
            ctx.stroke();
            ctx.restore();
          }

          if (effect.type === "heartTrail") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.font = "20px Arial";
            ctx.textAlign = "center";
            ctx.fillText("💗", effect.x, effect.y);
            ctx.restore();
          }

          if (effect.type === "rosePetal") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            ctx.save();
            ctx.globalAlpha = alpha * 0.8;
            ctx.font = "18px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = effect.team === "A" ? "#ff5c8a" : "#5cc9ff";
            ctx.fillText("🌸", effect.x, effect.y);
            ctx.restore();
          }

          if (effect.type === "kill") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            ctx.textAlign = "center";
            ctx.font = "bold 45px Arial";
            ctx.fillStyle = `rgba(255,255,255,${alpha})`;
            ctx.fillText("💀", effect.x, effect.y - progress * 100);
          }

          if (effect.type === "damageNumber") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            const y = effect.y - progress * 40;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.textAlign = "center";
            ctx.font = "bold 32px Arial";
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 4;
            ctx.strokeText("-" + effect.amount, effect.x, y);
            ctx.fillStyle = "#ff3030";
            ctx.fillText("-" + effect.amount, effect.x, y);
            ctx.restore();
          }

          if (effect.type === "healNumber") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            const y = effect.y - progress * 40;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.textAlign = "center";
            ctx.font = "bold 32px Arial";
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 4;
            ctx.strokeText("+" + effect.amount, effect.x, y);
            ctx.fillStyle = "#39ff14";
            ctx.fillText("+" + effect.amount, effect.x, y);
            ctx.restore();
          }

          if (effect.type === "likeHeal") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            const r = 40 + progress * 60;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, r, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(57,255,20,${alpha})`;
            ctx.lineWidth = 6 * (1 - progress) + 2;
            ctx.shadowColor = "#39ff14";
            ctx.shadowBlur = 25;
            ctx.stroke();
            ctx.shadowBlur = 0;
          }

          if (effect.type === "grenadeBlast") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            const coreR = 30 + progress * 60;
            const coreGrad = ctx.createRadialGradient(
              effect.x, effect.y, 0, effect.x, effect.y, coreR);
            coreGrad.addColorStop(0, `rgba(255,255,220,${alpha})`);
            coreGrad.addColorStop(0.35, `rgba(255,180,60,${alpha * 0.85})`);
            coreGrad.addColorStop(0.7, `rgba(255,80,0,${alpha * 0.6})`);
            coreGrad.addColorStop(1, "rgba(120,20,0,0)");
            ctx.fillStyle = coreGrad;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, coreR, 0, Math.PI * 2);
            ctx.fill();
            if (progress < 0.7) {
              const ringR = progress * (effect.radius || 160);
              ctx.beginPath();
              ctx.arc(effect.x, effect.y, ringR, 0, Math.PI * 2);
              ctx.strokeStyle = `rgba(255,220,140,${alpha * 0.8})`;
              ctx.lineWidth = 10 * (1 - progress) + 2;
              ctx.stroke();
            }
          }

          if (effect.type === "grenadeShard") {
            effect.x += effect.vx;
            effect.y += effect.vy;
            effect.vx *= 0.94;
            effect.vy *= 0.94;
            effect.angle += effect.spin;
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(effect.x, effect.y);
            ctx.rotate(effect.angle);
            ctx.beginPath();
            ctx.moveTo(8, 0);
            ctx.lineTo(-4, -3);
            ctx.lineTo(-4, 3);
            ctx.closePath();
            const g2 = ctx.createLinearGradient(-4, -3, 8, 3);
            g2.addColorStop(0, "rgba(80,80,80,0.9)");
            g2.addColorStop(0.5, "rgba(200,200,200,1)");
            g2.addColorStop(1, "rgba(60,60,60,0.9)");
            ctx.fillStyle = g2;
            ctx.fill();
            ctx.restore();
          }

          /* ----- MIND BLOWN ----- */
          if (effect.type === "mindCharge") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            const r = 20 + progress * 60;
            const pulse = 1 + Math.sin(Date.now() * 0.03) * 0.15;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.shadowColor = "#b060ff";
            ctx.shadowBlur = 40;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, r * pulse, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(180,80,255,0.6)";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, r * pulse * 0.55, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255,255,255,0.9)";
            ctx.fill();
            ctx.restore();
          }

          if (effect.type === "mindLaser") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;

            const dx = effect.endX - effect.startX;
            const dy = effect.endY - effect.startY;
            const angle = Math.atan2(dy, dx);
            const len = Math.hypot(dx, dy);

            ctx.save();
            ctx.translate(effect.startX, effect.startY);
            ctx.rotate(angle);

            const flicker = 0.85 + Math.random() * 0.3;
            ctx.shadowColor = "#c060ff";
            ctx.shadowBlur = 40;
            ctx.fillStyle = `rgba(180,80,255,${alpha * 0.5})`;
            ctx.beginPath();
            ctx.roundRect(0, -22 * flicker, len, 44 * flicker, 22);
            ctx.fill();

            ctx.shadowBlur = 20;
            ctx.fillStyle = `rgba(255,255,255,${alpha})`;
            ctx.beginPath();
            ctx.roundRect(0, -8 * flicker, len, 16 * flicker, 8);
            ctx.fill();

            for (let s = 0; s < 4; s++) {
              const sx = Math.random() * 40;
              ctx.beginPath();
              ctx.arc(sx, (Math.random() - 0.5) * 40, 4, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(255,220,255,${alpha})`;
              ctx.fill();
            }

            ctx.restore();

            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.shadowColor = "#ff80ff";
            ctx.shadowBlur = 60;
            const flare = 40 + Math.sin(Date.now() * 0.05) * 10;
            ctx.beginPath();
            ctx.arc(effect.endX, effect.endY, flare, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255,200,255,0.8)";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(effect.endX, effect.endY, flare * 0.5, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255,255,255,1)";
            ctx.fill();
            ctx.restore();
          }

          if (effect.type === "mindImpact") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            const r = 30 + progress * 80;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, r, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(200,100,255,${alpha})`;
            ctx.lineWidth = 10 * (1 - progress) + 2;
            ctx.shadowColor = "#c060ff";
            ctx.shadowBlur = 30;
            ctx.stroke();
            ctx.font = `${50 + progress * 20}px Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = `rgba(255,255,255,${alpha})`;
            ctx.fillText("🧠", effect.x, effect.y);
            ctx.restore();
          }

          /* ----- BIG HEART ----- */
          if (effect.type === "bigHeart") {
            effect.stageTimer++;
            const p = Math.min(1, effect.stageTimer / effect.flyDuration);
            const eased = 1 - Math.pow(1 - p, 2);

            effect.x = effect.startX + (effect.targetX - effect.startX) * eased;
            effect.y = effect.startY + (effect.targetY - effect.startY) * eased;
            effect.size = effect.startSize + (effect.endSize - effect.startSize) * eased;

            ctx.save();
            ctx.shadowColor = "#ff3e8a";
            ctx.shadowBlur = 40 + effect.size * 0.4;
            ctx.font = `${effect.size}px Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("💗", effect.x, effect.y);
            ctx.restore();

            if (p >= 1 && !effect.exploded) {
              effect.exploded = true;

              effects.push({
                type: "heartBurst",
                x: effect.x, y: effect.y,
                life: 45, maxLife: 45,
                team: effect.team,
              });
              playHeartSound(effect.team);

              const enemyTeam = effect.team === "A" ? "B" : "A";
              for (let hI = 0; hI < 5; hI++) {
                let target = effect.hitList[hI];
                if (!target || target.hp <= 0) {
                  const alive = players.filter(pl => pl.team === enemyTeam && pl.hp > 0);
                  if (alive.length === 0) target = null;
                  else target = alive[Math.floor(Math.random() * alive.length)];
                }

                const angleOut = (Math.PI * 2 * hI) / 5 + Math.random() * 0.3;
                const spawnX = effect.x + Math.cos(angleOut) * 30;
                const spawnY = effect.y + Math.sin(angleOut) * 30;

                const aimAngle = target
                  ? Math.atan2(target.y - spawnY, target.x - spawnX)
                  : angleOut;

                bullets.push({
                  x: spawnX, y: spawnY,
                  team: effect.team,
                  ownerId: "__gift__",
                  senderId: effect.senderId,
                  targetId: target ? target.id : "__none__",
                  angle: aimAngle,
                  speed: 24,
                  damage: 5,
                  size: 16,
                  missileType: "heart",
                  heartFallback: true,
                  heartLastX: target ? target.x : spawnX + Math.cos(angleOut) * 400,
                  heartLastY: target ? target.y : spawnY + Math.sin(angleOut) * 400,
                });
              }

              effect.life = Math.min(effect.life, 5);
            }
          }

          if (effect.type === "heartBurst") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            for (let ring = 0; ring < 3; ring++) {
