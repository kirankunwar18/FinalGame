<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TikTok Comment Battle</title>

    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #111; overflow: hidden; font-family: Arial, sans-serif;
      }
      #game-wrapper {
        width: 100vw; height: 100vh;
        margin: auto; position: relative;
        overflow: hidden; background: #111;
        display: flex; align-items: center; justify-content: center;
      }
      canvas {
        display: block;
        max-width: 100%; max-height: 100%;
        width: auto; height: auto;
        aspect-ratio: 9 / 16;
        object-fit: contain;
      }
      #status {
        position: absolute; top: 10px; left: 10px; right: 10px;
        z-index: 20; padding: 8px 12px;
        background: rgba(0,0,0,0.65); color: white;
        border-radius: 8px; font-size: 13px; text-align: center;
        font-weight: bold;
        transition: background 0.3s, color 0.3s;
      }
      #status.connected { background: rgba(20,120,40,0.85); color: #b6ffb6; }
      #status.disconnected { background: rgba(140,20,20,0.85); color: #ffc0c0; }
      #status.connecting { background: rgba(140,110,20,0.85); color: #ffe9a0; }
      #debug {
        position: absolute; top: 50px; left: 10px; right: 10px;
        z-index: 25; padding: 8px 12px;
        background: rgba(0,0,0,0.75); color: #9f9;
        border-radius: 8px; font-size: 11px;
        font-family: monospace; text-align: left;
        max-height: 180px; overflow-y: auto;
        display: none; white-space: pre-wrap; word-break: break-all;
      }
      #debug.visible { display: block; }
      #controls {
        position: absolute; bottom: 10px; left: 50%;
        transform: translateX(-50%);
        z-index: 20; display: flex; gap: 6px;
        justify-content: center; flex-wrap: wrap;
        max-width: 95vw;
      }
      button {
        border: none; border-radius: 8px;
        padding: 8px 12px; font-weight: bold; cursor: pointer;
      }
      #teamAButton { background: #e63946; color: white; }
      #teamBButton { background: #00b4d8; color: white; }
      #giftButton  { background: #ffd166; color: black; }
      #resetButton { background: white; color: black; }
      #muteButton  { background: #333; color: white; }
      #debugButton { background: #444; color: white; }
    </style>
  </head>

  <body>
    <div id="game-wrapper">
      <canvas id="battleCanvas"></canvas>
      <div id="status">Connecting to TikFinity...</div>
      <div id="debug"></div>
      <div id="controls">
        <button id="teamAButton">Test A</button>
        <button id="teamBButton">Test B</button>
        <button id="giftButton">Test Gift</button>
        <button id="muteButton">🔊</button>
        <button id="debugButton">🐞</button>
        <button id="resetButton">Reset</button>
      </div>
    </div>

    <script>
      /* ============================================================
         CONFIG
      ============================================================ */
      const canvas = document.getElementById("battleCanvas");
      const ctx = canvas.getContext("2d");

      const GAME_WIDTH = 1080;
      const GAME_HEIGHT = 1920;
      canvas.width = GAME_WIDTH;
      canvas.height = GAME_HEIGHT;

      const START_HP = 250;
      const MAX_HP_CAP = 5000;

      function fitCanvas() {
        const wrapper = document.getElementById("game-wrapper");
        const wW = wrapper.clientWidth;
        const wH = wrapper.clientHeight;
        const gameRatio = GAME_WIDTH / GAME_HEIGHT;
        const screenRatio = wW / wH;
        let cssW, cssH;
        if (screenRatio > gameRatio) { cssH = wH; cssW = wH * gameRatio; }
        else { cssW = wW; cssH = wW / gameRatio; }
        canvas.style.width = cssW + "px";
        canvas.style.height = cssH + "px";
      }
      window.addEventListener("resize", fitCanvas);
      window.addEventListener("orientationchange", fitCanvas);
      fitCanvas();

      /* ============================================================
         DEBUG PANEL
      ============================================================ */
      const debugEl = document.getElementById("debug");
      const debugLines = [];
      function logDebug(msg) {
        const time = new Date().toLocaleTimeString();
        debugLines.push(`[${time}] ${msg}`);
        if (debugLines.length > 30) debugLines.shift();
        debugEl.textContent = debugLines.join("\n");
        debugEl.scrollTop = debugEl.scrollHeight;
      }
      document.getElementById("debugButton").onclick = () => {
        debugEl.classList.toggle("visible");
      };

      /* ============================================================
         BACKGROUND IMAGES
      ============================================================ */
      const IMG_BG_A = new Image();
      IMG_BG_A.src = "./messi.jpg";
      const IMG_BG_B = new Image();
      IMG_BG_B.src = "./ronaldo.jpg";
      const FALLBACK_BG_A = "#f4f4f4";
      const FALLBACK_BG_B = "#0d1b2a";

      /* ============================================================
         SOUND ENGINE
      ============================================================ */
      let audioCtx = null;
      let soundEnabled = true;

      function initAudio() {
        if (!audioCtx) {
          try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
          catch (e) { console.log("Audio not supported", e); }
        }
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      }
      document.addEventListener("click", initAudio, { once: false });

      function makePanner(pan = 0) {
        if (!audioCtx) return null;
        if (audioCtx.createStereoPanner) {
          const p = audioCtx.createStereoPanner();
          p.pan.setValueAtTime(Math.max(-1, Math.min(1, pan)), audioCtx.currentTime);
          p.connect(audioCtx.destination);
          return p;
        }
        return null;
      }
      function panForTeam(team) { return team === "A" ? -0.7 : 0.7; }
      function panForTeamRandom(team) {
        return panForTeam(team) + (Math.random() - 0.5) * 0.3;
      }

      function playTone({ freq=440, type="sine", duration=0.2, volume=0.2,
                          delay=0, sweepTo=null, sweepTime=null, pan=0 }) {
        if (!soundEnabled || !audioCtx) return;
        const now = audioCtx.currentTime + delay;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (sweepTo !== null) {
          osc.frequency.exponentialRampToValueAtTime(
            Math.max(1, sweepTo), now + (sweepTime || duration));
        }
        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        const panner = makePanner(pan);
        if (panner) gain.connect(panner); else gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + duration + 0.05);
      }

      function playNoise({ duration=0.4, volume=0.3, delay=0, filterFreq=800, pan=0 }) {
        if (!soundEnabled || !audioCtx) return;
        const now = audioCtx.currentTime + delay;
        const bufferSize = Math.floor(audioCtx.sampleRate * duration);
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
        }
        const src = audioCtx.createBufferSource();
        src.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(filterFreq, now);
        filter.frequency.exponentialRampToValueAtTime(100, now + duration);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        src.connect(filter);
        filter.connect(gain);
        const panner = makePanner(pan);
        if (panner) gain.connect(panner); else gain.connect(audioCtx.destination);
        src.start(now); src.stop(now + duration);
      }

      function playRoseSound(team="A") {
        const pan = panForTeamRandom(team);
        for (let i = 0; i < 5; i++) {
          playTone({ freq: 800, type: "square", duration: 0.08,
                     volume: 0.12, delay: i * 0.06, sweepTo: 300, pan });
        }
      }
      function playHeartSound(team="A") {
        const pan = panForTeamRandom(team);
        [523, 659, 784, 1047].forEach((f, i) => {
          playTone({ freq: f, type: "sine", duration: 0.35,
                     volume: 0.18, delay: i * 0.09, pan });
        });
        playTone({ freq: 1500, type: "triangle", duration: 0.4,
                   volume: 0.1, delay: 0.4, sweepTo: 2400, pan });
      }
      function playMindSound(team="A") {
        const pan = panForTeamRandom(team);
        playTone({ freq: 200, type: "sawtooth", duration: 0.5,
                   volume: 0.15, sweepTo: 1600, pan });
        for (let i = 0; i < 8; i++) {
          playTone({ freq: 400 + Math.random() * 800, type: "square",
                     duration: 0.04, volume: 0.1, delay: 0.5 + i * 0.05, pan });
        }
      }
      function playGhostAmbience(team="A", volume=0.35, duration=3) {
        const pan = panForTeam(team);
        if (!soundEnabled || !audioCtx) return;
        const panner = makePanner(pan);
        if (!panner) return;
        const now = audioCtx.currentTime;
        const droneOsc = audioCtx.createOscillator();
        const droneGain = audioCtx.createGain();
        droneOsc.type = "sawtooth";
        droneOsc.frequency.setValueAtTime(55, now);
        droneOsc.frequency.linearRampToValueAtTime(50, now + duration);
        const droneFilter = audioCtx.createBiquadFilter();
        droneFilter.type = "lowpass";
        droneFilter.frequency.setValueAtTime(200, now);
        droneFilter.Q.setValueAtTime(5, now);
        droneGain.gain.setValueAtTime(0, now);
        droneGain.gain.linearRampToValueAtTime(volume * 0.4, now + 0.4);
        droneGain.gain.setValueAtTime(volume * 0.4, now + duration - 0.6);
        droneGain.gain.linearRampToValueAtTime(0, now + duration);
        droneOsc.connect(droneFilter);
        droneFilter.connect(droneGain);
        droneGain.connect(panner);
        droneOsc.start(now); droneOsc.stop(now + duration);
      }
      function playGhostWail(team="A", volume=0.4, delay=0) {
        const pan = panForTeamRandom(team);
        if (!soundEnabled || !audioCtx) return;
        const now = audioCtx.currentTime + delay;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 1.2);
        const lfo = audioCtx.createOscillator();
        const lfoGain = audioCtx.createGain();
        lfo.frequency.setValueAtTime(6, now);
        lfoGain.gain.setValueAtTime(40, now);
        lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
        lfo.start(now); lfo.stop(now + 1.2);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(volume, now + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
        osc.connect(gain);
        const panner = makePanner(pan);
        if (panner) gain.connect(panner); else gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 1.2);
      }
      function playGhostScream(team="A", volume=0.45, delay=0) {
        const pan = panForTeamRandom(team);
        if (!soundEnabled || !audioCtx) return;
        const now = audioCtx.currentTime + delay;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.6);
        const lfo = audioCtx.createOscillator();
        const lfoGain = audioCtx.createGain();
        lfo.frequency.setValueAtTime(12, now);
        lfoGain.gain.setValueAtTime(80, now);
        lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
        lfo.start(now); lfo.stop(now + 0.7);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(volume, now + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
        osc.connect(gain);
        const panner = makePanner(pan);
        if (panner) gain.connect(panner); else gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.7);
      }
      function playLightningCrack(team="A", volume=0.5) {
        const pan = panForTeamRandom(team);
        playNoise({ duration: 0.15, volume, filterFreq: 6000, pan });
        playTone({ freq: 3000, type: "square", duration: 0.1,
                   volume: volume * 0.6, sweepTo: 300, pan });
      }
      function playThunderRumble(team="A", volume=0.4, delay=0) {
        const pan = panForTeam(team);
        playNoise({ duration: 2.5, volume, filterFreq: 400, delay, pan });
      }
      function playThunderBoom(team="A", volume=0.35, delay=0) {
        const pan = panForTeam(team);
        playTone({ freq: 120, type: "sine", duration: 1.8,
                   volume, delay, sweepTo: 30, pan });
      }
      function playLaserCharge(team="A", volume=0.35, duration=1.1) {
        const pan = panForTeam(team);
        if (!soundEnabled || !audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(80, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + duration);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(volume * 0.6, now + duration * 0.7);
        gain.gain.linearRampToValueAtTime(volume, now + duration);
        osc.connect(gain);
        const panner = makePanner(pan);
        if (panner) gain.connect(panner); else gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + duration + 0.05);
        for (let i = 0; i < 10; i++) {
          playTone({ freq: 400 + i * 100, type: "square", duration: 0.08,
                     volume: 0.05 * (i / 10),
                     delay: (i * duration) / 10, pan });
        }
      }
      function playLaserFire(team="A", volume=0.5) {
        const pan = panForTeam(team);
        playTone({ freq: 200, type: "sine", duration: 1.8,
                   volume, sweepTo: 40, pan });
        playTone({ freq: 2500, type: "sawtooth", duration: 0.3,
                   volume: volume * 0.7, sweepTo: 200, pan });
        playNoise({ duration: 0.6, volume: volume * 0.6, filterFreq: 6000, pan });
      }
      function playMeteorWhoosh(team="A", volume=0.3, delay=0) {
        const pan = panForTeamRandom(team);
        playTone({ freq: 1200, type: "sawtooth", duration: 0.4,
                   volume, delay, sweepTo: 200, pan });
        playNoise({ duration: 0.4, volume: volume * 0.5,
                    filterFreq: 2000, delay, pan });
      }
      function playMeteorImpact(team="A", volume=0.5, delay=0) {
        const pan = panForTeamRandom(team);
        playNoise({ duration: 0.6, volume, filterFreq: 1500, delay, pan });
        playTone({ freq: 150, type: "sine", duration: 0.5,
                   volume: volume * 0.7, delay, sweepTo: 30, pan });
      }
      function playNukeSound(team="A") {
        const pan = panForTeam(team);
        playNoise({ duration: 1.5, volume: 0.4, filterFreq: 2000, pan });
        playTone({ freq: 100, type: "sine", duration: 1.6,
                   volume: 0.35, sweepTo: 20, pan });
        for (let i = 0; i < 5; i++) {
          playNoise({ duration: 0.3, volume: 0.15, filterFreq: 3000,
                      delay: 0.3 + i * 0.15, pan });
        }
      }
      function playWipeSound(team="A") {
        const pan = panForTeam(team);
        playTone({ freq: 200, type: "sawtooth", duration: 1.0,
                   volume: 0.2, sweepTo: 3000, pan });
        playTone({ freq: 300, type: "sine", duration: 2.0,
                   volume: 0.4, delay: 1.0, sweepTo: 25, pan });
      }
      function playHitSound(pan=0) {
        playTone({ freq: 1200, type: "square", duration: 0.04,
                   volume: 0.05, sweepTo: 400, pan });
      }
      function playKillSound(pan=0) {
        playTone({ freq: 880, type: "triangle", duration: 0.08, volume: 0.15, pan });
        playTone({ freq: 1175, type: "triangle", duration: 0.08,
                   volume: 0.15, delay: 0.08, pan });
        playTone({ freq: 1568, type: "triangle", duration: 0.12,
                   volume: 0.15, delay: 0.16, pan });
      }
      function playSawSpin(team="A", volume=0.4, duration=3) {
        const pan = panForTeam(team);
        for (let i = 0; i < 15; i++) {
          playTone({ freq: 1500 + Math.random() * 500,
                     type: "square", duration: 0.03,
                     volume: volume * 0.3,
                     delay: i * 0.15, pan });
        }
      }

      function playTornadoSound(team="A", volume=0.4, duration=3.0) {
        if (!soundEnabled || !audioCtx) return;
        const pan = panForTeam(team);
        const panner = makePanner(pan);
        if (!panner) return;
        const now = audioCtx.currentTime;
        const bufferSize = Math.floor(audioCtx.sampleRate * duration);
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          const t = i / bufferSize;
          const env = Math.pow(t, 0.6) * (1 - Math.pow(t, 4));
          const turbulence = 0.6 + Math.sin(t * 200 + Math.random() * 3) * 0.4;
          data[i] = (Math.random() * 2 - 1) * env * turbulence;
        }
        const src = audioCtx.createBufferSource();
        src.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(300, now);
        filter.frequency.exponentialRampToValueAtTime(900, now + duration);
        filter.Q.setValueAtTime(1.2, now);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(volume, now + duration * 0.6);
        gain.gain.linearRampToValueAtTime(0, now + duration);
        src.connect(filter);
        filter.connect(gain);
        gain.connect(panner);
        src.start(now); src.stop(now + duration);

        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + duration);
        const lfo = audioCtx.createOscillator();
        const lfoGain = audioCtx.createGain();
        lfo.frequency.setValueAtTime(4, now);
        lfo.frequency.linearRampToValueAtTime(12, now + duration);
        lfoGain.gain.setValueAtTime(50, now);
        lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
        lfo.start(now); lfo.stop(now + duration);
        oscGain.gain.setValueAtTime(0, now);
        oscGain.gain.linearRampToValueAtTime(volume * 0.3, now + duration * 0.5);
        oscGain.gain.linearRampToValueAtTime(0, now + duration);
        osc.connect(oscGain);
        oscGain.connect(panner);
        osc.start(now); osc.stop(now + duration);
      }
      function playWipeBlast(team="A", volume=0.6) {
        if (!soundEnabled || !audioCtx) return;
        const pan = panForTeam(team);
        const panner = makePanner(pan);
        if (!panner) return;
        const now = audioCtx.currentTime;
        const crackBuffer = audioCtx.createBuffer(
          1, Math.floor(audioCtx.sampleRate * 0.15), audioCtx.sampleRate);
        const crackData = crackBuffer.getChannelData(0);
        for (let i = 0; i < crackData.length; i++) {
          crackData[i] = (Math.random() * 2 - 1) *
                         Math.pow(1 - i / crackData.length, 2);
        }
        const crackSrc = audioCtx.createBufferSource();
        crackSrc.buffer = crackBuffer;
        const crackFilter = audioCtx.createBiquadFilter();
        crackFilter.type = "highpass";
        crackFilter.frequency.setValueAtTime(3000, now);
        const crackGain = audioCtx.createGain();
        crackGain.gain.setValueAtTime(volume * 0.9, now);
        crackGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        crackSrc.connect(crackFilter);
        crackFilter.connect(crackGain);
        crackGain.connect(panner);
        crackSrc.start(now); crackSrc.stop(now + 0.2);

        const boomOsc = audioCtx.createOscillator();
        const boomGain = audioCtx.createGain();
        boomOsc.type = "sine";
        boomOsc.frequency.setValueAtTime(120, now);
        boomOsc.frequency.exponentialRampToValueAtTime(25, now + 2.5);
        boomGain.gain.setValueAtTime(0, now);
        boomGain.gain.linearRampToValueAtTime(volume, now + 0.03);
        boomGain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
        boomOsc.connect(boomGain);
        boomGain.connect(panner);
        boomOsc.start(now); boomOsc.stop(now + 2.5);

        const rumbleBuffer = audioCtx.createBuffer(
          1, Math.floor(audioCtx.sampleRate * 2.5), audioCtx.sampleRate);
        const rumbleData = rumbleBuffer.getChannelData(0);
        for (let i = 0; i < rumbleData.length; i++) {
          const t = i / rumbleData.length;
          rumbleData[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 1.5);
        }
        const rumbleSrc = audioCtx.createBufferSource();
        rumbleSrc.buffer = rumbleBuffer;
        const rumbleFilter = audioCtx.createBiquadFilter();
        rumbleFilter.type = "lowpass";
        rumbleFilter.frequency.setValueAtTime(500, now);
        rumbleFilter.frequency.exponentialRampToValueAtTime(80, now + 2.5);
        const rumbleGain = audioCtx.createGain();
        rumbleGain.gain.setValueAtTime(volume * 0.7, now);
        rumbleGain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
        rumbleSrc.connect(rumbleFilter);
        rumbleFilter.connect(rumbleGain);
        rumbleGain.connect(panner);
        rumbleSrc.start(now); rumbleSrc.stop(now + 2.5);
      }
      function playGlassCrack(team="A", volume=0.5) {
        if (!soundEnabled || !audioCtx) return;
        const pan = panForTeam(team);
        const panner = makePanner(pan);
        if (!panner) return;
        const now = audioCtx.currentTime;
        const crackBuffer = audioCtx.createBuffer(
          1, Math.floor(audioCtx.sampleRate * 0.2), audioCtx.sampleRate);
        const crackData = crackBuffer.getChannelData(0);
        for (let i = 0; i < crackData.length; i++) {
          const t = i / crackData.length;
          crackData[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 3);
        }
        const crackSrc = audioCtx.createBufferSource();
        crackSrc.buffer = crackBuffer;
        const crackFilter = audioCtx.createBiquadFilter();
        crackFilter.type = "highpass";
        crackFilter.frequency.setValueAtTime(2000, now);
        const crackGain = audioCtx.createGain();
        crackGain.gain.setValueAtTime(volume, now);
        crackGain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        crackSrc.connect(crackFilter);
        crackFilter.connect(crackGain);
        crackGain.connect(panner);
        crackSrc.start(now); crackSrc.stop(now + 0.25);

        for (let i = 0; i < 8; i++) {
          const freq = 1800 + Math.random() * 2400;
          playTone({ freq, type: "sine", duration: 0.08,
                     volume: volume * 0.3,
                     delay: 0.05 + i * 0.07 + Math.random() * 0.05,
                     sweepTo: freq * 0.6, pan });
        }
      }
      function playWipeCrack(team="A", volume=0.5, delay=0) {
        if (!soundEnabled || !audioCtx) return;
        const pan = panForTeam(team);
        const panner = makePanner(pan);
        if (!panner) return;
        const now = audioCtx.currentTime + delay;
        const bufferSize = Math.floor(audioCtx.sampleRate * 0.5);
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          const t = i / bufferSize;
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2) *
                    (Math.random() < 0.3 ? 1 : 0.5);
        }
        const src = audioCtx.createBufferSource();
        src.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(1200, now);
        filter.frequency.exponentialRampToValueAtTime(200, now + 0.5);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        src.connect(filter);
        filter.connect(gain);
        gain.connect(panner);
        src.start(now); src.stop(now + 0.6);
        playTone({ freq: 80, type: "sine", duration: 0.4,
                   volume: volume * 0.6, delay, sweepTo: 30, pan });
      }
      function playApocalypseSiren(team="A", volume=0.35, duration=2.5) {
        if (!soundEnabled || !audioCtx) return;
        const pan = panForTeam(team);
        const panner = makePanner(pan);
        if (!panner) return;
        const now = audioCtx.currentTime;
        const baseOsc = audioCtx.createOscillator();
        const baseGain = audioCtx.createGain();
        baseOsc.type = "sawtooth";
        baseOsc.frequency.setValueAtTime(400, now);
        baseOsc.frequency.linearRampToValueAtTime(900, now + duration);
        const lfo = audioCtx.createOscillator();
        const lfoGain = audioCtx.createGain();
        lfo.type = "sine";
        lfo.frequency.setValueAtTime(0.5, now);
        lfo.frequency.linearRampToValueAtTime(2.5, now + duration);
        lfoGain.gain.setValueAtTime(150, now);
        lfoGain.gain.linearRampToValueAtTime(250, now + duration);
        lfo.connect(lfoGain);
        lfoGain.connect(baseOsc.frequency);
        lfo.start(now); lfo.stop(now + duration);
        const filter = audioCtx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(800, now);
        filter.frequency.linearRampToValueAtTime(1400, now + duration);
        filter.Q.setValueAtTime(3, now);
        baseGain.gain.setValueAtTime(0, now);
        baseGain.gain.linearRampToValueAtTime(volume * 0.7, now + duration * 0.4);
        baseGain.gain.linearRampToValueAtTime(volume * 0.5, now + duration * 0.7);
        baseGain.gain.linearRampToValueAtTime(volume, now + duration);
        baseOsc.connect(filter);
        filter.connect(baseGain);
        baseGain.connect(panner);
        baseOsc.start(now); baseOsc.stop(now + duration);

        const harmOsc = audioCtx.createOscillator();
        const harmGain = audioCtx.createGain();
        harmOsc.type = "sine";
        harmOsc.frequency.setValueAtTime(800, now);
        harmOsc.frequency.linearRampToValueAtTime(1800, now + duration);
        const lfo2 = audioCtx.createOscillator();
        const lfo2Gain = audioCtx.createGain();
        lfo2.type = "sine";
        lfo2.frequency.setValueAtTime(0.5, now);
        lfo2.frequency.linearRampToValueAtTime(2.5, now + duration);
        lfo2Gain.gain.setValueAtTime(300, now);
        lfo2Gain.gain.linearRampToValueAtTime(500, now + duration);
        lfo2.connect(lfo2Gain);
        lfo2Gain.connect(harmOsc.frequency);
        lfo2.start(now); lfo2.stop(now + duration);
        harmGain.gain.setValueAtTime(0, now);
        harmGain.gain.linearRampToValueAtTime(volume * 0.25, now + duration * 0.5);
        harmGain.gain.linearRampToValueAtTime(volume * 0.4, now + duration);
        harmOsc.connect(harmGain);
        harmGain.connect(panner);
        harmOsc.start(now); harmOsc.stop(now + duration);
      }

      /* ============================================================
         STATE
      ============================================================ */
      let players = [];
      let bullets = [];
      let effects = [];
      let screenShake = 0;
      let playerCounter = 0;
      let bannerText = "";
      let bannerLife = 0;
      let bannerMaxLife = 90;
      let bannerTeam = "A";

      const DEFAULT_AVATAR =
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">
            <rect width="300" height="300" fill="#777"/>
            <circle cx="150" cy="110" r="55" fill="#ddd"/>
            <path d="M70 270 C75 195 225 195 230 270" fill="#ddd"/>
        </svg>`);

      function random(min, max) { return Math.random() * (max - min) + min; }
      function distance(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

      /* ============================================================
         PLAYER
      ============================================================ */
      class Player {
        constructor(id, username, avatar, team) {
          this.id = id;
          this.username = username || "viewer";
          this.team = team;
          this.kills = 0;
          this.radius = 45;
          this.hp = START_HP;
          this.maxHp = START_HP;
          this.damage = 1;
          this.bulletSize = 5;
          this.speed = random(0.2, 0.6);
          this.lastShot = 0;
          this.shootDelay = 1000;
          this.angle = random(0, Math.PI * 2);
          if (team === "A") this.x = random(80, 450);
          else this.x = random(630, 1000);
          this.y = random(300, 1650);
          this.img = new Image();
          this.img.crossOrigin = "anonymous";
          this.img.src = avatar || DEFAULT_AVATAR;
          this.img.onerror = () => { this.img.src = DEFAULT_AVATAR; };
        }

        grow() {
          this.kills++;
          this.radius = Math.min(70, 55 + this.kills * 2);
          this.maxHp = Math.min(MAX_HP_CAP, Math.max(this.maxHp, START_HP + this.kills * 15));
          this.hp = Math.min(this.maxHp, this.hp + 30);
          this.hp = Math.min(this.maxHp, this.hp + 25);
          this.damage = 1;
          this.bulletSize = Math.min(10, 5 + this.kills * 0.25);
        }

        heal(amount) {
          if (this.hp <= 0) return 0;
          const before = this.hp;
          this.hp = Math.min(this.maxHp, this.hp + amount);
          return this.hp - before;
        }

        findEnemy() {
          const enemies = players.filter((p) => p.team !== this.team && p.hp > 0);
          if (enemies.length === 0) return null;
          let closest = enemies[0];
          let closestDistance = distance(this, closest);
          for (let i = 1; i < enemies.length; i++) {
            const d = distance(this, enemies[i]);
            if (d < closestDistance) { closest = enemies[i]; closestDistance = d; }
          }
          return closest;
        }

        shoot(now) {
          if (now - this.lastShot < this.shootDelay) return;
          const target = this.findEnemy();
          if (!target) return;
          const angle = Math.atan2(target.y - this.y, target.x - this.x);
          bullets.push({
            x: this.x, y: this.y, team: this.team, ownerId: this.id,
            targetId: target.id, angle,
            speed: 30,
            damage: this.damage,
            size: this.bulletSize,
            missileType: "normal",
          });
          this.lastShot = now;
        }

        move() {
          this.angle += random(-0.015, 0.015);
          this.x += Math.cos(this.angle) * this.speed;
          this.y += Math.sin(this.angle) * this.speed;
          if (this.team === "A") this.x = Math.max(60, Math.min(500, this.x));
          else this.x = Math.max(580, Math.min(1020, this.x));
          this.y = Math.max(180, Math.min(1750, this.y));
        }

        update(now) { this.move(); this.shoot(now); }

        draw() {
          ctx.save();
          const barWidth = this.radius * 2;
          const barHeight = 18;
          const barX = this.x - this.radius;
          const barY = this.y - this.radius - 35;
          ctx.fillStyle = "#333";
          ctx.fillRect(barX, barY, barWidth, barHeight);
          ctx.fillStyle = "#39ff14";
          const hpPercent = Math.max(0, this.hp / this.maxHp);
          ctx.fillRect(barX, barY, barWidth * hpPercent, barHeight);

          ctx.textAlign = "center";
          ctx.font = "bold " + Math.max(22, Math.min(40, this.radius * 0.6)) + "px Arial";
          ctx.fillStyle = this.team === "A" ? "#111" : "#fff";
          let displayName = this.username;
          if (displayName.length > 12) displayName = displayName.substring(0, 12) + "...";
          ctx.fillText(displayName + "  💀" + this.kills,
                       this.x, this.y - this.radius - 52);

          ctx.save();
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.clip();
          if (this.img.complete) {
            try {
              ctx.drawImage(this.img,
                this.x - this.radius, this.y - this.radius,
                this.radius * 2, this.radius * 2);
            } catch (e) { drawDefaultAvatar(this.x, this.y, this.radius); }
          } else drawDefaultAvatar(this.x, this.y, this.radius);
          ctx.restore();

          ctx.restore();
        }
      }

      function drawDefaultAvatar(x, y, radius) {
        ctx.fillStyle = "#777";
        ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
        ctx.fillStyle = "#ddd";
        ctx.beginPath();
        ctx.arc(x, y - radius * 0.2, radius * 0.35, 0, Math.PI * 2);
        ctx.fill();
      }

      function addPlayer(username, avatar, team) {
        if (!username) username = "viewer_" + Math.floor(Math.random() * 9999);
        const existing = players.find((p) => p.id === username);
        if (existing) {
          existing.hp = Math.min(existing.maxHp, existing.hp + 20);
          logDebug(`Already joined: ${username} (${existing.team})`);
          return;
        }
        const player = new Player(username, username, avatar, team);
        players.push(player);
        createJoinEffect(player);
        updateStatus();
        logDebug(`+ ${username} joined TEAM ${team}`);
      }

      function createJoinEffect(player) {
        effects.push({ type: "join", x: player.x, y: player.y,
                       team: player.team, life: 60, maxLife: 60 });
      }

      /* ============================================================
         SENDER ORIGIN HELPERS
      ============================================================ */
      function getSenderOrigin(senderId, senderTeam) {
        const sender = players.find(p => p.id === senderId && p.hp > 0);
        if (sender) return { x: sender.x, y: sender.y, player: sender };
        return {
          x: senderTeam === "A" ? random(30, 300) : random(780, 1050),
          y: random(300, 1600),
          player: null,
        };
      }

      // Spawns a launch pulse + icon at the sender's avatar
      function spawnGiftLaunch(senderId, senderTeam, icon) {
        const origin = getSenderOrigin(senderId, senderTeam);
        effects.push({
          type: "giftLaunch",
          x: origin.x,
          y: origin.y,
          team: senderTeam,
          icon: icon || "✨",
          life: 45, maxLife: 45,
          playerRef: origin.player,
        });
        if (origin.player) {
          effects.push({
            type: "senderGlow",
            playerRef: origin.player,
            team: senderTeam,
            life: 120, maxLife: 120,
          });
        }
        return origin;
      }

      function fireMissiles({ senderTeam, targets, count, damage,
                              missileType, bannerText: bText,
                              bannerTeam: bTeam, senderId }) {
        bannerText = bText;
        bannerTeam = bTeam;
        bannerLife = bannerMaxLife;

        const sender = players.find(p => p.id === senderId && p.hp > 0);

        for (let i = 0; i < count; i++) {
          const target = targets[Math.floor(Math.random() * targets.length)];
          const startX = sender ? sender.x
            : (senderTeam === "A" ? random(30, 300) : random(780, 1050));
          const startY = sender ? sender.y : random(300, 1600);
          const angle = Math.atan2(target.y - startY, target.x - startX);
          bullets.push({
            x: startX, y: startY, team: senderTeam, ownerId: "__gift__",
            senderId,
            targetId: target.id, angle, speed: 18, damage, size: 14,
            missileType,
          });
        }
      }

      /* ============================================================
         BULLET UPDATE
      ============================================================ */
      function updateBullets() {
        for (let i = bullets.length - 1; i >= 0; i--) {
          const bullet = bullets[i];

          const isRose = bullet.ownerId === "__gift__" && bullet.missileType === "rose";

          if (isRose && bullet.spiral) {
            bullet.spiralFrames = (bullet.spiralFrames || 0) + 1;

            if (bullet.spiralFrames < bullet.spiralDiveAt) {
              bullet.spiralAngle += bullet.spiralSpeed * bullet.spiralDirection;
              bullet.x = bullet.spiralCenterX +
                         Math.cos(bullet.spiralAngle) * bullet.spiralRadius;
              bullet.y = bullet.spiralCenterY +
                         Math.sin(bullet.spiralAngle) * bullet.spiralRadius;
              bullet.spin = (bullet.spin || 0) + 0.15;

              if (Math.random() < 0.5) {
                effects.push({
                  type: "rosePetal",
                  x: bullet.x, y: bullet.y,
                  team: bullet.team,
                  life: 30, maxLife: 30,
                });
              }
            } else {
              const target = players.find(p => p.id === bullet.targetId && p.hp > 0);
              if (target) {
                const dx = target.x - bullet.x;
                const dy = target.y - bullet.y;
                const wantAngle = Math.atan2(dy, dx);
                let diff = wantAngle - bullet.angle;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                bullet.angle += diff * 0.3;
              }
              bullet.x += Math.cos(bullet.angle) * (bullet.speed + 10);
              bullet.y += Math.sin(bullet.angle) * (bullet.speed + 10);
              bullet.spin = (bullet.spin || 0) + 0.4;
            }
          } else {
            bullet.x += Math.cos(bullet.angle) * bullet.speed;
            bullet.y += Math.sin(bullet.angle) * bullet.speed;
          }

          if (bullet.x < -80 || bullet.x > GAME_WIDTH + 80 ||
              bullet.y < -80 || bullet.y > GAME_HEIGHT + 80) {
            bullets.splice(i, 1);
            continue;
          }

          const isGift = bullet.ownerId === "__gift__";
          const teamColor = bullet.team === "A" ? "#ff304f" : "#00d9ff";
          const teamGlow = bullet.team === "A"
            ? "rgba(255,48,79,0.9)" : "rgba(0,217,255,0.9)";

          if (isGift && bullet.missileType === "rocket" && Math.random() < 0.7) {
            effects.push({
              type: "spark",
              x: bullet.x - Math.cos(bullet.angle) * 18,
              y: bullet.y - Math.sin(bullet.angle) * 18,
              team: bullet.team, life: 15, maxLife: 15,
            });
          }

          ctx.save();
          ctx.translate(bullet.x, bullet.y);
          ctx.rotate(bullet.angle);

          if (isGift && bullet.missileType === "heart") {
            ctx.shadowColor = "#ff3e8a";
            ctx.shadowBlur = 30;
            ctx.font = `${bullet.size * 3}px Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("💗", 0, 0);
            if (Math.random() < 0.4) {
              effects.push({
                type: "heartTrail",
                x: bullet.x - Math.cos(bullet.angle) * 20,
                y: bullet.y - Math.sin(bullet.angle) * 20,
                life: 20, maxLife: 20,
              });
            }
          }
          else if (isGift && bullet.missileType === "rose") {
            const spinTime = Date.now() * 0.008;
            const baseSpin = bullet.spin || 0;
            ctx.save();
            ctx.rotate(baseSpin + spinTime);
            ctx.shadowColor = bullet.team === "A"
              ? "rgba(255,80,120,0.9)"
              : "rgba(80,200,255,0.9)";
            ctx.shadowBlur = 22;
            ctx.font = `${bullet.size * 2.2}px Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🌹", 0, 0);
            ctx.restore();

            if (Math.random() < 0.6) {
              effects.push({
                type: "rosePetal",
                x: bullet.x - Math.cos(bullet.angle) * 18,
                y: bullet.y - Math.sin(bullet.angle) * 18,
                team: bullet.team,
                life: 25, maxLife: 25,
              });
            }
          }
          else if (isGift) {
            ctx.shadowColor = teamGlow;
            ctx.shadowBlur = 25;
            const bodyLen = bullet.size * 4.5;
            const bodyWid = bullet.size * 1.1;
            ctx.fillStyle = teamColor;
            ctx.beginPath();
            ctx.roundRect(-bodyLen * 0.5, -bodyWid * 0.5,
                          bodyLen, bodyWid, bodyWid * 0.5);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = "rgba(0,0,0,0.25)";
            ctx.beginPath();
            ctx.roundRect(-bodyLen * 0.45, -bodyWid * 0.15,
                          bodyLen * 0.9, bodyWid * 0.3, bodyWid * 0.15);
            ctx.fill();
            ctx.shadowColor = "#ffffff";
            ctx.shadowBlur = 15;
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(bodyLen * 0.5, 0, bodyWid * 0.55, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowColor = teamGlow;
            ctx.shadowBlur = 20;
            ctx.fillStyle = teamGlow;
            ctx.beginPath();
            ctx.moveTo(-bodyLen * 0.5, -bodyWid * 0.4);
            ctx.lineTo(-bodyLen * 0.5, bodyWid * 0.4);
            ctx.lineTo(-bodyLen * 0.5 - bullet.size * 2.2, 0);
            ctx.closePath();
            ctx.fill();
          }
          else {
            ctx.shadowColor = teamColor;
            ctx.shadowBlur = 12;
            ctx.fillStyle = teamColor;
            ctx.beginPath();
            ctx.roundRect(-bullet.size * 2.5, -bullet.size * 0.55,
                          bullet.size * 5, bullet.size * 1.1, bullet.size * 0.5);
            ctx.fill();
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(bullet.size * 2, 0, bullet.size * 0.35, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();

          let hit = null;
          for (const player of players) {
            if (player.team === bullet.team) continue;
            if (player.hp <= 0) continue;
            const d = Math.hypot(player.x - bullet.x, player.y - bullet.y);
            if (d < player.radius + bullet.size) { hit = player; break; }
          }

          if (hit) {
            hit.hp -= bullet.damage;
            createDamageNumber(hit.x, hit.y, Math.round(bullet.damage));

            const hitPan = panForTeamRandom(hit.team);
            if (isGift) {
              createExplosion(hit.x, hit.y, hit.team);
            } else {
              playHitSound(hitPan);
            }
            bullets.splice(i, 1);
            if (hit.hp <= 0) {
              const killer = players.find((p) => p.id === bullet.ownerId);
              if (killer) killer.grow();
              if (isGift && bullet.senderId) {
                const sender = players.find((p) => p.id === bullet.senderId);
                if (sender && sender.id !== (killer && killer.id)) {
                  sender.grow();
                }
              }
              createKillEffect(hit);
              playKillSound(hitPan);
            }
          }
        }
      }

      function createExplosion(x, y, team) {
        effects.push({ type: "explosion", x, y, team, life: 35, maxLife: 35 });
        for (let i = 0; i < 6; i++) {
          const a = (Math.PI * 2 * i) / 6 + Math.random() * 0.5;
          effects.push({
            type: "particle", x, y,
            vx: Math.cos(a) * random(4, 9),
            vy: Math.sin(a) * random(4, 9),
            team, life: 30, maxLife: 30,
          });
        }
      }
      function createKillEffect(player) {
        effects.push({ type: "kill", x: player.x, y: player.y,
                       life: 70, maxLife: 70 });
      }
      function createDamageNumber(x, y, amount) {
        effects.push({
          type: "damageNumber",
          x: x + random(-15, 15),
          y: y - 30,
          amount: amount,
          life: 60, maxLife: 60,
        });
      }
      function createHealNumber() { /* silent on purpose */ }

      function drawLightningArc(x1, y1, x2, y2, alpha) {
        if (alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha = alpha;
        const dx = x2 - x1;
        const dy = y2 - y1;
        const dist = Math.hypot(dx, dy);
        const segments = Math.max(4, Math.floor(dist / 40));
        ctx.strokeStyle = `rgba(150,200,255,${alpha * 0.8})`;
        ctx.lineWidth = 6;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        for (let i = 1; i < segments; i++) {
          const t = i / segments;
          const jx = (Math.random() - 0.5) * 40;
          const jy = (Math.random() - 0.5) * 40;
          ctx.lineTo(x1 + dx * t + jx, y1 + dy * t + jy);
        }
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      }

      /* ============================================================
         DRAW EFFECTS
      ============================================================ */
      function drawEffects() {
        for (let i = effects.length - 1; i >= 0; i--) {
          const effect = effects[i];
          if (effect.delay && effect.delay > 0) { effect.delay--; continue; }
          effect.life--;
          if (effect.life <= 0) { effects.splice(i, 1); continue; }
          const progress = 1 - effect.life / effect.maxLife;
          const alphaFade = Math.min(1, effect.life / 20);
          if (alphaFade < 0.02 && effect.type !== "huntingGhost" &&
              effect.type !== "chainLightning" &&
              effect.type !== "vortexPull" &&
              effect.type !== "vortexSpiral" &&
              effect.type !== "deathSaw" &&
              effect.type !== "meteor" &&
              effect.type !== "deathSawEmerge") continue;

          /* ===== giftLaunch pulse at sender ===== */
          if (effect.type === "giftLaunch") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;

            const r = 20 + progress * 150;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, r, 0, Math.PI * 2);
            ctx.strokeStyle = effect.team === "A"
              ? `rgba(255,80,120,${alpha})`
              : `rgba(80,200,255,${alpha})`;
            ctx.lineWidth = 10 * (1 - progress) + 2;
            ctx.stroke();

            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.font = "80px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowColor = effect.team === "A" ? "#ff5c8a" : "#5cc9ff";
            ctx.shadowBlur = 30;
            ctx.fillText(effect.icon, effect.x, effect.y - progress * 90);
            ctx.restore();
          }

          /* ===== senderGlow ring on sender's avatar ===== */
          if (effect.type === "senderGlow") {
            const p = effect.playerRef;
            if (!p || p.hp <= 0) continue;
            const alpha = Math.min(1, effect.life / 40);
            const r = p.radius + 18 + Math.sin(Date.now() * 0.012) * 6;
            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.strokeStyle = effect.team === "A"
              ? `rgba(255,80,120,${alpha})`
              : `rgba(80,200,255,${alpha})`;
            ctx.lineWidth = 6;
            ctx.shadowColor = effect.team === "A" ? "#ff5c8a" : "#5cc9ff";
            ctx.shadowBlur = 25;
            ctx.stroke();
            ctx.shadowBlur = 0;
          }

          if (effect.type === "join") {
            const radius = 30 + progress * 120;
            const a = 1 - progress;
            if (a < 0.05) continue;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, radius, 0, Math.PI * 2);
            ctx.strokeStyle = effect.team === "A"
              ? `rgba(255,48,79,${a})` : `rgba(0,217,255,${a})`;
            ctx.lineWidth = 10;
            ctx.stroke();
          }

          if (effect.type === "explosion") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            const tc = effect.team === "A" ? "255,48,79" : "0,217,255";
            const r1 = 15 + progress * 100;
            const grad = ctx.createRadialGradient(
              effect.x, effect.y, 0, effect.x, effect.y, r1);
            grad.addColorStop(0, `rgba(${tc},${alpha * 0.5})`);
            grad.addColorStop(0.4, `rgba(${tc},${alpha * 0.3})`);
            grad.addColorStop(1, `rgba(${tc},0)`);
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, r1, 0, Math.PI * 2);
            ctx.fill();
            const r2 = 20 * (1 - progress) + 5;
            ctx.fillStyle = `rgba(255,255,255,${alpha * 0.9})`;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, r2, 0, Math.PI * 2);
            ctx.fill();
          }

          if (effect.type === "particle") {
            effect.x += effect.vx;
            effect.y += effect.vy;
            effect.vx *= 0.94;
            effect.vy *= 0.94;
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            const size = 5 * (1 - progress) + 1;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, size, 0, Math.PI * 2);
            ctx.fillStyle = effect.team === "A"
              ? `rgba(255,120,150,${alpha})`
              : `rgba(120,220,255,${alpha})`;
            ctx.fill();
          }

          if (effect.type === "spark") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, 4 + progress * 6, 0, Math.PI * 2);
            ctx.fillStyle = effect.team === "A"
              ? `rgba(255,120,150,${alpha})`
              : `rgba(120,220,255,${alpha})`;
            ctx.fill();
          }

          if (effect.type === "heartTrail") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.font = "20px Arial";
            ctx.textAlign = "center";
            ctx.fillText("💗", effect.x, effect.y);
            ctx.restore();
          }

          if (effect.type === "rosePetal") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            ctx.save();
            ctx.globalAlpha = alpha * 0.8;
            ctx.font = "18px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = effect.team === "A" ? "#ff5c8a" : "#5cc9ff";
            ctx.fillText("🌸", effect.x, effect.y);
            ctx.restore();
          }

          if (effect.type === "emojiParticle") {
            effect.x += effect.vx;
            effect.y += effect.vy;
            effect.vx *= 0.94;
            effect.vy *= 0.94;
            const alpha = 1 - progress;
            if (alpha < 0.1) continue;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.font = "32px Arial";
            ctx.textAlign = "center";
            ctx.fillText(effect.emoji, effect.x, effect.y);
            ctx.restore();
          }

          if (effect.type === "kill") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            ctx.textAlign = "center";
            ctx.font = "bold 45px Arial";
            ctx.fillStyle = `rgba(255,255,255,${alpha})`;
            ctx.fillText("💀", effect.x, effect.y - progress * 100);
          }

          if (effect.type === "damageNumber") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            const y = effect.y - progress * 40;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.textAlign = "center";
            ctx.font = "bold 32px Arial";
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 4;
            ctx.strokeText("-" + effect.amount, effect.x, y);
            ctx.fillStyle = "#ff3030";
            ctx.fillText("-" + effect.amount, effect.x, y);
            ctx.restore();
          }

          if (effect.type === "brainwave") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            const r = 80 + progress * 500;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, r, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(160,80,255,${alpha * 0.8})`;
            ctx.lineWidth = 12 * (1 - progress) + 3;
            ctx.stroke();
          }
          if (effect.type === "brainExplode") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.font = "60px Arial";
            ctx.textAlign = "center";
            ctx.fillText("🧠", effect.x, effect.y);
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, 20 + progress * 60, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255,80,180,${alpha})`;
            ctx.lineWidth = 8 * (1 - progress) + 2;
            ctx.stroke();
            ctx.restore();
          }

          /* ===== GHOST WITH EMERGE PHASE ===== */
          if (effect.type === "huntingGhost") {
            effect.stageTimer = (effect.stageTimer || 0) + 1;

            // EMERGE PHASE
            if (effect.phase === "emerging") {
              const p = Math.min(1, effect.stageTimer / effect.emergeDuration);
              const sender = effect.senderRef;
              if (!sender || sender.hp <= 0) { effect.life = 0; continue; }

              // Stay at sender's position, grow from 0 to full size
              effect.x = sender.x;
              effect.y = sender.y;
              effect.emergeProgress = p;

              const size = 90 * p;
              ctx.save();
              ctx.shadowColor = "#88ffbb";
              ctx.shadowBlur = 40 * p;
              ctx.font = `${size}px Arial`;
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.globalAlpha = p;
              ctx.fillStyle = "#ffffff";
              ctx.fillText("👻", effect.x, effect.y);
              ctx.restore();

              // Emerge ring
              ctx.save();
              ctx.globalAlpha = (1 - p) * 0.8;
              ctx.beginPath();
              ctx.arc(effect.x, effect.y, 30 + p * 80, 0, Math.PI * 2);
              ctx.strokeStyle = `rgba(136,255,187,${1 - p})`;
              ctx.lineWidth = 8 * (1 - p) + 2;
              ctx.stroke();
              ctx.restore();

              if (p >= 1) {
                effect.phase = "flying";
                effect.stageTimer = 0;
              }
              continue;
            }

            // FLYING PHASE (existing logic)
            const huntList = effect.huntList || [];
            if (huntList.length === 0) continue;

            while (effect.currentIndex < huntList.length &&
                   (!huntList[effect.currentIndex] ||
                    huntList[effect.currentIndex].hp <= 0)) {
              effect.currentIndex++;
            }

            if (effect.currentIndex >= huntList.length) {
              effect.life = Math.min(effect.life, 20);
              continue;
            }

            const target = huntList[effect.currentIndex];
            const dx = target.x - effect.x;
            const dy = target.y - effect.y;
            const dist = Math.hypot(dx, dy);
            const speed = 14;

            if (dist < speed + 4) {
              if (target.hp > 0) {
                const DMG = 2;
                target.hp -= DMG;
                createDamageNumber(target.x, target.y, DMG);

                if (effect.senderId) {
                  const sender = players.find(p => p.id === effect.senderId && p.hp > 0);
                  if (sender) sender.heal(5);
                }

                effects.push({
                  type: "ghostTag",
                  x: target.x, y: target.y,
                  team: target.team,
                  life: 60, maxLife: 60,
                });
                for (let k = 0; k < 3; k++) {
                  const a = Math.random() * Math.PI * 2;
                  effects.push({
                    type: "emojiParticle",
                    x: target.x, y: target.y,
                    vx: Math.cos(a) * random(3, 6),
                    vy: Math.sin(a) * random(3, 6) - 2,
                    emoji: Math.random() < 0.5 ? "👻" : "💀",
                    life: 60, maxLife: 60,
                  });
                }
                if (target.hp <= 0) {
                  createKillEffect(target);
                  playKillSound(panForTeamRandom(target.team));
                  rewardSenderForGiftKill(effect.senderId, 25);
                }
              }
              effect.hitsDone = (effect.hitsDone || 0) + 1;
              effect.currentIndex++;
            } else {
              effect.x += (dx / dist) * speed;
              effect.y += (dy / dist) * speed;
            }

            effect.trail = effect.trail || [];
            effect.trail.push({ x: effect.x, y: effect.y });
            if (effect.trail.length > 20) effect.trail.shift();

            ctx.save();
            for (let t = 0; t < effect.trail.length; t++) {
              const tp = effect.trail[t];
              const alpha = (t / effect.trail.length) * 0.5;
              ctx.globalAlpha = alpha;
              ctx.font = `${30 + t * 0.8}px Arial`;
              ctx.textAlign = "center";
              ctx.shadowColor = "#88ffbb";
              ctx.shadowBlur = 20;
              ctx.fillStyle = "#ddffee";
              ctx.fillText("👻", tp.x, tp.y);
            }
            ctx.restore();

            ctx.save();
            const pulse = 1 + Math.sin(Date.now() * 0.01) * 0.1;
            const size = 90 * pulse;
            ctx.shadowColor = "#88ffbb";
            ctx.shadowBlur = 40;
            ctx.font = `${size}px Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "#ffffff";
            ctx.fillText("👻", effect.x, effect.y);
            ctx.restore();
          }

          if (effect.type === "ghostTag") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            ctx.save();
            ctx.globalAlpha = alpha;
            const y = effect.y - 60 - progress * 30;
            ctx.font = "50px Arial";
            ctx.textAlign = "center";
            ctx.fillText("👻", effect.x, y);
            ctx.restore();
          }

          if (effect.type === "chainLightning") {
            effect.stageTimer = (effect.stageTimer || 0) + 1;
            const chainList = effect.chainList || [];
            if (chainList.length === 0) continue;
            const strikeDuration = 20;
            const chainDuration = chainList.length * 14;
            const arcingDuration = 150;
            if (effect.stageTimer < strikeDuration) effect.phase = "strike";
            else if (effect.stageTimer < strikeDuration + chainDuration) {
              effect.phase = "chain";
              effect.currentIndex = Math.floor(
                (effect.stageTimer - strikeDuration) / 14);
            }
            else if (effect.stageTimer < strikeDuration + chainDuration + arcingDuration)
              effect.phase = "arcing";
            else { effect.phase = "done"; effect.life = Math.min(effect.life, 15); continue; }

            if (effect.phase === "strike") {
              const p = effect.stageTimer / strikeDuration;
              const first = chainList[0];
              if (!first || first.hp <= 0) continue;

              const sender = players.find(pl => pl.id === effect.senderId && pl.hp > 0);
              const startX = sender ? sender.x : first.x;
              const startY = sender ? sender.y : 0;

              ctx.save();
              ctx.strokeStyle = `rgba(180,220,255,${1 - p})`;
              ctx.lineWidth = 14;
              ctx.beginPath();
              ctx.moveTo(startX, startY);
              const segments = 12;
              for (let k = 1; k <= segments; k++) {
                const t = k / segments;
                const tx = startX + (first.x - startX) * t +
                           (Math.random() - 0.5) * 60;
                const ty = startY + (first.y - startY) * t +
                           (Math.random() - 0.5) * 60;
                ctx.lineTo(tx, ty);
              }
              ctx.lineTo(first.x, first.y);
              ctx.stroke();
              ctx.strokeStyle = `rgba(255,255,255,${1 - p})`;
              ctx.lineWidth = 5;
              ctx.stroke();
              ctx.restore();
            }

            if (effect.phase === "chain") {
              const idx = effect.currentIndex;
              for (let i = 0; i < idx; i++) {
                const a = chainList[i], b = chainList[i + 1];
                if (a && b && a.hp > 0 && b.hp > 0)
                  drawLightningArc(a.x, a.y, b.x, b.y, 0.7);
              }
              if (idx > 0 && chainList[idx]) {
                const prev = chainList[idx - 1];
                if (prev && prev.hp > 0)
                  drawLightningArc(prev.x, prev.y,
                                   chainList[idx].x, chainList[idx].y, 0.9);
              }
            }

            if (effect.phase === "arcing") {
              const alive = chainList.filter(t => t.hp > 0);
              effect.arcingCooldowns = effect.arcingCooldowns || {};

              for (let a = 0; a < alive.length; a++) {
                for (let b = a + 1; b < alive.length; b++) {
                  if (Math.random() < 0.7) {
                    const ta = alive[a];
                    const tb = alive[b];

                    drawLightningArc(ta.x, ta.y, tb.x, tb.y,
                                     0.5 + Math.random() * 0.3);

                    const key = ta.id + "|" + tb.id;
                    const lastHit = effect.arcingCooldowns[key] || 0;
                    if (effect.stageTimer - lastHit > 6) {
                      effect.arcingCooldowns[key] = effect.stageTimer;

                      if (ta.hp > 0) {
                        ta.hp -= 1;
                        createDamageNumber(ta.x, ta.y, 1);
                        if (ta.hp <= 0) {
                          createKillEffect(ta);
                          playKillSound(panForTeamRandom(ta.team));
                          rewardSenderForGiftKill(effect.senderId, 25);
                        }
                      }

                      if (tb.hp > 0) {
                        tb.hp -= 1;
                        createDamageNumber(tb.x, tb.y, 1);
                        if (tb.hp <= 0) {
                          createKillEffect(tb);
                          playKillSound(panForTeamRandom(tb.team));
                          rewardSenderForGiftKill(effect.senderId, 25);
                        }
                      }
                    }
                  }
                }
              }
            }
          }

          if (effect.type === "chainHit") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            ctx.save();
            ctx.globalAlpha = alpha;
            const r = 30 + progress * 60;
            const grad = ctx.createRadialGradient(
              effect.x, effect.y, 0, effect.x, effect.y, r);
            grad.addColorStop(0, `rgba(255,255,255,${alpha})`);
            grad.addColorStop(0.4, `rgba(180,220,255,${alpha * 0.7})`);
            grad.addColorStop(1, `rgba(100,150,255,0)`);
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          /* ===== MEGA STRIKE / DEATH SAW WITH EMERGE PHASE ===== */
          if (effect.type === "deathSawEmerge") {
            effect.stageTimer = (effect.stageTimer || 0) + 1;
            const st = effect.stageTimer;

            // PHASE 1: EMERGE at sender's avatar
            if (effect.phase === "emerging") {
              const p = Math.min(1, st / effect.emergeDuration);
              const sender = effect.senderRef;
              if (!sender || sender.hp <= 0) { effect.life = 0; continue; }

              effect.x = sender.x;
              effect.y = sender.y;
              effect.bladeAngle = (effect.bladeAngle || 0) + 0.5;
              effect.currentSize = 85 * p;
              effect.currentTeeth = Math.max(1, Math.floor(10 * p));

              // Draw emerging saw at sender
              ctx.save();
              ctx.translate(effect.x, effect.y);
              ctx.rotate(effect.bladeAngle);
              ctx.shadowColor = "#ff00ff";
              ctx.shadowBlur = 40 * p;

              ctx.beginPath();
              ctx.arc(0, 0, effect.currentSize, 0, Math.PI * 2);
              ctx.fillStyle = "rgba(20,0,40,0.9)";
              ctx.fill();
              ctx.beginPath();
              ctx.arc(0, 0, effect.currentSize, 0, Math.PI * 2);
              ctx.strokeStyle = `rgba(220,220,240,${p})`;
              ctx.lineWidth = 10 * p;
              ctx.stroke();

              for (let b = 0; b < effect.currentTeeth; b++) {
                const toothAngle = (Math.PI * 2 * b) / Math.max(1, effect.currentTeeth);
                const toothStartX = Math.cos(toothAngle) * (effect.currentSize - 5);
                const toothStartY = Math.sin(toothAngle) * (effect.currentSize - 5);
                const toothTipX = Math.cos(toothAngle) * (effect.currentSize + 30 * p);
                const toothTipY = Math.sin(toothAngle) * (effect.currentSize + 30 * p);
                const perpAngle = toothAngle + Math.PI / 2;
                const perpX = Math.cos(perpAngle) * 18 * p;
                const perpY = Math.sin(perpAngle) * 18 * p;

                ctx.beginPath();
                ctx.moveTo(toothStartX - perpX, toothStartY - perpY);
                ctx.lineTo(toothTipX, toothTipY);
                ctx.lineTo(toothStartX + perpX, toothStartY + perpY);
                ctx.closePath();
                ctx.fillStyle = `rgba(240,240,255,${p})`;
                ctx.fill();
              }

              ctx.beginPath();
              ctx.arc(0, 0, 30 * p, 0, Math.PI * 2);
              ctx.fillStyle = "#ff00ff";
              ctx.fill();
              ctx.beginPath();
              ctx.arc(0, 0, 15 * p, 0, Math.PI * 2);
              ctx.fillStyle = "#ffffff";
              ctx.fill();
              ctx.restore();

              // Emerge ring
              ctx.save();
              ctx.globalAlpha = (1 - p) * 0.7;
              ctx.beginPath();
              ctx.arc(effect.x, effect.y, 30 + p * 100, 0, Math.PI * 2);
              ctx.strokeStyle = `rgba(255,0,255,${1 - p})`;
              ctx.lineWidth = 8 * (1 - p) + 2;
              ctx.stroke();
              ctx.restore();

              if (p >= 1) {
                effect.phase = "flying";
                effect.stageTimer = 0;
              }
              continue;
            }

            // PHASE 2: FLYING to enemy center while growing
            if (effect.phase === "flying") {
              const p = Math.min(1, st / effect.flyDuration);
              const sx = effect.startX;
              const sy = effect.startY;
              const tx = effect.centerX;
              const ty = effect.centerY;

              effect.x = sx + (tx - sx) * p;
              effect.y = sy + (ty - sy) * p;
              effect.bladeAngle = (effect.bladeAngle || 0) + 0.6;
              effect.currentSize = 85 * p;
              effect.currentTeeth = Math.max(1, Math.floor(10 * p));

              // Draw flying saw
              ctx.save();
              ctx.translate(effect.x, effect.y);
              ctx.rotate(effect.bladeAngle);
              ctx.shadowColor = "#ff00ff";
              ctx.shadowBlur = 40;

              ctx.beginPath();
              ctx.arc(0, 0, effect.currentSize, 0, Math.PI * 2);
              ctx.fillStyle = "rgba(20,0,40,0.9)";
              ctx.fill();
              ctx.beginPath();
              ctx.arc(0, 0, effect.currentSize, 0, Math.PI * 2);
              ctx.strokeStyle = "rgba(220,220,240,1)";
              ctx.lineWidth = 10;
              ctx.stroke();

              for (let b = 0; b < effect.currentTeeth; b++) {
                const toothAngle = (Math.PI * 2 * b) / Math.max(1, effect.currentTeeth);
                const toothStartX = Math.cos(toothAngle) * (effect.currentSize - 5);
                const toothStartY = Math.sin(toothAngle) * (effect.currentSize - 5);
                const toothTipX = Math.cos(toothAngle) * (effect.currentSize + 30);
                const toothTipY = Math.sin(toothAngle) * (effect.currentSize + 30);
                const perpAngle = toothAngle + Math.PI / 2;
                const perpX = Math.cos(perpAngle) * 18;
                const perpY = Math.sin(perpAngle) * 18;

                ctx.beginPath();
                ctx.moveTo(toothStartX - perpX, toothStartY - perpY);
                ctx.lineTo(toothTipX, toothTipY);
                ctx.lineTo(toothStartX + perpX, toothStartY + perpY);
                ctx.closePath();
                ctx.fillStyle = "rgba(240,240,255,1)";
                ctx.fill();
              }

              ctx.beginPath();
              ctx.arc(0, 0, 30, 0, Math.PI * 2);
              ctx.fillStyle = "#ff00ff";
              ctx.fill();
              ctx.beginPath();
              ctx.arc(0, 0, 15, 0, Math.PI * 2);
              ctx.fillStyle = "#ffffff";
              ctx.fill();
              ctx.restore();

              // Trail
              if (Math.random() < 0.5) {
                effects.push({
                  type: "spark",
                  x: effect.x + random(-30, 30),
                  y: effect.y + random(-30, 30),
                  team: effect.sourceTeam,
                  life: 15, maxLife: 15,
                });
              }

              if (p >= 1) {
                // Transition to active death saw
                effect.phase = "active";
                effect.stageTimer = 0;
              }
              continue;
            }

            // PHASE 3: ACTIVE (existing deathSaw logic, but effect type stays "deathSawEmerge")
            if (effect.phase === "active") {
              const sawSize = 85;
              const teethCount = 10;
              const zoneR = effect.zoneRadius || 220;
              const tickEvery = effect.tickEvery || 10;
              const dmgPerTick = effect.damagePerTick || 15;

              effect.bladeAngle = (effect.bladeAngle || 0) + 0.4;

              // Zone ring
              ctx.save();
              ctx.beginPath();
              ctx.arc(effect.centerX, effect.centerY, zoneR, 0, Math.PI * 2);
              ctx.strokeStyle = "rgba(255,0,255,0.5)";
              ctx.lineWidth = 6;
              ctx.setLineDash([20, 14]);
              ctx.stroke();
              ctx.setLineDash([]);
              ctx.fillStyle = "rgba(255,0,255,0.06)";
              ctx.fill();
              ctx.restore();

              // Saw at enemy center
              ctx.save();
              ctx.translate(effect.x, effect.y);
              ctx.rotate(effect.bladeAngle);
              ctx.shadowColor = "#ff00ff";
              ctx.shadowBlur = 40;

              ctx.beginPath();
              ctx.arc(0, 0, sawSize, 0, Math.PI * 2);
              ctx.fillStyle = "rgba(20,0,40,0.9)";
              ctx.fill();
              ctx.beginPath();
              ctx.arc(0, 0, sawSize, 0, Math.PI * 2);
              ctx.strokeStyle = "rgba(220,220,240,1)";
              ctx.lineWidth = 10;
              ctx.stroke();

              for (let b = 0; b < teethCount; b++) {
                const toothAngle = (Math.PI * 2 * b) / teethCount;
                const toothStartX = Math.cos(toothAngle) * (sawSize - 5);
                const toothStartY = Math.sin(toothAngle) * (sawSize - 5);
                const toothTipX = Math.cos(toothAngle) * (sawSize + 30);
                const toothTipY = Math.sin(toothAngle) * (sawSize + 30);
                const perpAngle = toothAngle + Math.PI / 2;
                const perpX = Math.cos(perpAngle) * 18;
                const perpY = Math.sin(perpAngle) * 18;

                ctx.beginPath();
                ctx.moveTo(toothStartX - perpX, toothStartY - perpY);
                ctx.lineTo(toothTipX, toothTipY);
                ctx.lineTo(toothStartX + perpX, toothStartY + perpY);
                ctx.closePath();
                const toothGrad = ctx.createLinearGradient(
                  toothStartX, toothStartY, toothTipX, toothTipY);
                toothGrad.addColorStop(0, "rgba(240,240,255,1)");
                toothGrad.addColorStop(1, "rgba(180,180,220,0.9)");
                ctx.fillStyle = toothGrad;
                ctx.fill();
                ctx.strokeStyle = "rgba(255,255,255,0.9)";
                ctx.lineWidth = 1.5;
                ctx.stroke();
              }

              ctx.shadowColor = "#ff00ff";
              ctx.shadowBlur = 30;
              ctx.beginPath();
              ctx.arc(0, 0, 30, 0, Math.PI * 2);
              ctx.fillStyle = "#ff00ff";
              ctx.fill();
              ctx.beginPath();
              ctx.arc(0, 0, 15, 0, Math.PI * 2);
              ctx.fillStyle = "#ffffff";
              ctx.fill();
              ctx.restore();

              // Damage ticks
              if (st % tickEvery === 0) {
                for (const p of players) {
                  if (p.team !== effect.team) continue;
                  if (p.hp <= 0) continue;
                  const d = Math.hypot(p.x - effect.centerX, p.y - effect.centerY);
                  if (d <= zoneR) {
                    p.hp -= dmgPerTick;
                    createExplosion(p.x, p.y, p.team);
                    createDamageNumber(p.x, p.y, dmgPerTick);
                    effects.push({
                      type: "bladeCut",
                      x: p.x, y: p.y,
                      team: p.team,
                      life: 40, maxLife: 40,
                    });
                    playMeteorImpact(p.team, 0.4);
                    if (p.hp <= 0) {
                      createKillEffect(p);
                      playKillSound(panForTeamRandom(p.team));
                      rewardSenderForGiftKill(effect.senderId, 25);
                    }
                  }
                }
              }

              if (effect.life <= 5 && !effect.finished) {
                effect.finished = true;
                effects.push({
                  type: "bladeBurst",
                  x: effect.x, y: effect.y,
                  team: effect.team,
                  life: 70, maxLife: 70,
                });
                for (let k = 0; k < 15; k++) {
                  const a = (Math.PI * 2 * k) / 15;
                  effects.push({
                    type: "bladeShard",
                    x: effect.x, y: effect.y,
                    vx: Math.cos(a) * random(6, 14),
                    vy: Math.sin(a) * random(6, 14),
                    angle: a,
                    team: effect.team,
                    life: 80, maxLife: 80,
                  });
                }
                playLaserFire(effect.sourceTeam, 0.5);
              }
            }
          }

          /* ===== Legacy deathSaw (for backward compat) ===== */
          if (effect.type === "deathSaw") {
            effect.stageTimer = (effect.stageTimer || 0) + 1;
            const st = effect.stageTimer;
            const spinSpeed = 0.4;
            effect.bladeAngle = (effect.bladeAngle || 0) + spinSpeed;

            const sawSize    = 85;
            const teethCount = 10;
            const zoneR      = effect.zoneRadius || 220;
            const tickEvery  = effect.tickEvery || 10;
            const dmgPerTick = effect.damagePerTick || 15;

            ctx.save();
            ctx.beginPath();
            ctx.arc(effect.centerX, effect.centerY, zoneR, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(255,0,255,0.5)";
            ctx.lineWidth = 6;
            ctx.setLineDash([20, 14]);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = "rgba(255,0,255,0.06)";
            ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.translate(effect.x, effect.y);
            ctx.rotate(effect.bladeAngle);

            ctx.shadowColor = "#ff00ff";
            ctx.shadowBlur = 40;

            ctx.beginPath();
            ctx.arc(0, 0, sawSize, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(20,0,40,0.9)";
            ctx.fill();

            ctx.beginPath();
            ctx.arc(0, 0, sawSize, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(220,220,240,1)";
            ctx.lineWidth = 10;
            ctx.stroke();

            for (let b = 0; b < teethCount; b++) {
              const toothAngle = (Math.PI * 2 * b) / teethCount;
              const toothStartX = Math.cos(toothAngle) * (sawSize - 5);
              const toothStartY = Math.sin(toothAngle) * (sawSize - 5);
              const toothTipX = Math.cos(toothAngle) * (sawSize + 30);
              const toothTipY = Math.sin(toothAngle) * (sawSize + 30);
              const perpAngle = toothAngle + Math.PI / 2;
              const perpX = Math.cos(perpAngle) * 18;
              const perpY = Math.sin(perpAngle) * 18;

              ctx.beginPath();
              ctx.moveTo(toothStartX - perpX, toothStartY - perpY);
              ctx.lineTo(toothTipX, toothTipY);
              ctx.lineTo(toothStartX + perpX, toothStartY + perpY);
              ctx.closePath();
              const toothGrad = ctx.createLinearGradient(
                toothStartX, toothStartY, toothTipX, toothTipY);
              toothGrad.addColorStop(0, "rgba(240,240,255,1)");
              toothGrad.addColorStop(1, "rgba(180,180,220,0.9)");
              ctx.fillStyle = toothGrad;
              ctx.fill();
              ctx.strokeStyle = "rgba(255,255,255,0.9)";
              ctx.lineWidth = 1.5;
              ctx.stroke();
            }

            ctx.shadowColor = "#ff00ff";
            ctx.shadowBlur = 30;
            ctx.beginPath();
            ctx.arc(0, 0, 30, 0, Math.PI * 2);
            ctx.fillStyle = "#ff00ff";
            ctx.fill();
