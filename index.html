              const rp = Math.max(0, progress - ring * 0.12);
              const r = rp * (300 + ring * 120);
              ctx.beginPath();
              ctx.arc(effect.x, effect.y, r, 0, Math.PI * 2);
              ctx.strokeStyle = ring === 0
                ? `rgba(255,255,255,${alpha})`
                : ring === 1
                  ? `rgba(255,120,180,${alpha * 0.85})`
                  : `rgba(255,60,140,${alpha * 0.6})`;
              ctx.lineWidth = 18 * (1 - rp) + 3;
              ctx.stroke();
            }
          }

          if (effect.type === "huntingGhost") {
            effect.stageTimer = (effect.stageTimer || 0) + 1;

            if (effect.phase === "emerging") {
              const p = Math.min(1, effect.stageTimer / effect.emergeDuration);
              const sender = effect.senderRef;
              if (!sender || sender.hp <= 0) { effect.life = 0; continue; }

              effect.x = sender.x;
              effect.y = sender.y;

              const size = 90 * p;
              ctx.save();
              ctx.shadowColor = "#88ffbb";
              ctx.shadowBlur = 40 * p;
              ctx.font = `${size}px Arial`;
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.globalAlpha = p;
              ctx.fillStyle = "#ffffff";
              ctx.fillText("👻", effect.x, effect.y);
              ctx.restore();

              if (p >= 1) {
                effect.phase = "flying";
                effect.stageTimer = 0;
              }
              continue;
            }

            const huntList = effect.huntList || [];
            if (huntList.length === 0) continue;

            while (effect.currentIndex < huntList.length &&
                   (!huntList[effect.currentIndex] ||
                    huntList[effect.currentIndex].hp <= 0)) {
              effect.currentIndex++;
            }

            if (effect.currentIndex >= huntList.length) {
              effect.life = Math.min(effect.life, 20);
              continue;
            }

            const target = huntList[effect.currentIndex];
            const dx = target.x - effect.x;
            const dy = target.y - effect.y;
            const dist = Math.hypot(dx, dy);
            const speed = 14;

            if (dist < speed + 4) {
              if (target.hp > 0) {
                effects.push({
                  type: "ghostTag",
                  x: target.x, y: target.y,
                  team: target.team,
                  life: 60, maxLife: 60,
                });

                setTimeout(() => {
                  if (target.hp <= 0) return;
                  const DMG = 8;
                  target.hp -= DMG;
                  createDamageNumber(target.x, target.y, DMG);

                  if (effect.senderId) {
                    const sender = players.find(p => p.id === effect.senderId && p.hp > 0);
                    if (sender) {
                      const healed = sender.heal(4);
                      if (healed > 0) createHealNumber(sender.x, sender.y, healed);
                    }
                  }

                  if (target.hp <= 0) {
                    createKillEffect(target);
                    playKillSound(panForTeamRandom(target.team));
                    rewardSenderForGiftKill(effect.senderId, 25);
                  }
                }, 120);
              }
              effect.currentIndex++;
            } else {
              effect.x += (dx / dist) * speed;
              effect.y += (dy / dist) * speed;
            }

            effect.trail = effect.trail || [];
            effect.trail.push({ x: effect.x, y: effect.y });
            if (effect.trail.length > 20) effect.trail.shift();

            ctx.save();
            for (let t = 0; t < effect.trail.length; t++) {
              const tp = effect.trail[t];
              const alpha = (t / effect.trail.length) * 0.5;
              ctx.globalAlpha = alpha;
              ctx.font = `${30 + t * 0.8}px Arial`;
              ctx.textAlign = "center";
              ctx.shadowColor = "#88ffbb";
              ctx.shadowBlur = 20;
              ctx.fillStyle = "#ddffee";
              ctx.fillText("👻", tp.x, tp.y);
            }
            ctx.restore();

            ctx.save();
            const pulse = 1 + Math.sin(Date.now() * 0.01) * 0.1;
            ctx.shadowColor = "#88ffbb";
            ctx.shadowBlur = 40;
            ctx.font = `${90 * pulse}px Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "#ffffff";
            ctx.fillText("👻", effect.x, effect.y);
            ctx.restore();
          }

          if (effect.type === "ghostTag") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            ctx.save();
            ctx.globalAlpha = alpha;
            const y = effect.y - 60 - progress * 30;
            ctx.font = "50px Arial";
            ctx.textAlign = "center";
            ctx.fillText("👻", effect.x, y);
            ctx.restore();
          }

          if (effect.type === "chainLightning") {
            effect.stageTimer = (effect.stageTimer || 0) + 1;
            const chainList = effect.chainList || [];
            if (chainList.length === 0) continue;
            const strikeDuration = 20;
            const chainDuration = chainList.length * 14;
            const arcingDuration = 150;
            if (effect.stageTimer < strikeDuration) effect.phase = "strike";
            else if (effect.stageTimer < strikeDuration + chainDuration) {
              effect.phase = "chain";
              effect.currentIndex = Math.floor(
                (effect.stageTimer - strikeDuration) / 14);
            }
            else if (effect.stageTimer < strikeDuration + chainDuration + arcingDuration)
              effect.phase = "arcing";
            else { effect.phase = "done"; effect.life = Math.min(effect.life, 15); continue; }

            if (effect.phase === "strike") {
              const first = chainList[0];
              if (!first || first.hp <= 0) continue;
              const sender = players.find(pl => pl.id === effect.senderId && pl.hp > 0);
              const startX = sender ? sender.x : first.x;
              const startY = sender ? sender.y : 0;
              drawLightningArc(startX, startY, first.x, first.y, 0.9);
            }

            if (effect.phase === "chain") {
              const idx = effect.currentIndex;
              for (let ci = 0; ci < idx; ci++) {
                const a = chainList[ci], b = chainList[ci + 1];
                if (a && b && a.hp > 0 && b.hp > 0)
                  drawLightningArc(a.x, a.y, b.x, b.y, 0.7);
              }
            }

            if (effect.phase === "arcing") {
              const alive = chainList.filter(t => t.hp > 0);
              effect.arcingCooldowns = effect.arcingCooldowns || {};
              for (let a = 0; a < alive.length; a++) {
                for (let b = a + 1; b < alive.length; b++) {
                  if (Math.random() < 0.7) {
                    const ta = alive[a];
                    const tb = alive[b];
                    drawLightningArc(ta.x, ta.y, tb.x, tb.y,
                                     0.5 + Math.random() * 0.3);
                    const key = ta.id + "|" + tb.id;
                    const lastHit = effect.arcingCooldowns[key] || 0;
                    if (effect.stageTimer - lastHit > 6) {
                      effect.arcingCooldowns[key] = effect.stageTimer;
                      if (ta.hp > 0) {
                        ta.hp -= 1;
                        createDamageNumber(ta.x, ta.y, 1);
                        if (ta.hp <= 0) {
                          createKillEffect(ta);
                          playKillSound(panForTeamRandom(ta.team));
                          rewardSenderForGiftKill(effect.senderId, 25);
                        }
                      }
                      if (tb.hp > 0) {
                        tb.hp -= 1;
                        createDamageNumber(tb.x, tb.y, 1);
                        if (tb.hp <= 0) {
                          createKillEffect(tb);
                          playKillSound(panForTeamRandom(tb.team));
                          rewardSenderForGiftKill(effect.senderId, 25);
                        }
                      }
                    }
                  }
                }
              }
            }
          }

          if (effect.type === "chainHit") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            ctx.save();
            ctx.globalAlpha = alpha;
            const r = 30 + progress * 60;
            const grad = ctx.createRadialGradient(
              effect.x, effect.y, 0, effect.x, effect.y, r);
            grad.addColorStop(0, `rgba(255,255,255,${alpha})`);
            grad.addColorStop(0.4, `rgba(180,220,255,${alpha * 0.7})`);
            grad.addColorStop(1, `rgba(100,150,255,0)`);
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          if (effect.type === "deathSawEmerge") {
            effect.stageTimer = (effect.stageTimer || 0) + 1;
            const st = effect.stageTimer;
            const SMALL_SIZE = 22;
            const BIG_SIZE = 85;

            if (effect.phase === "emerging") {
              const p = Math.min(1, st / effect.emergeDuration);
              const sender = effect.senderRef;
              if (!sender || sender.hp <= 0) { effect.life = 0; continue; }
              effect.x = sender.x;
              effect.y = sender.y;
              effect.bladeAngle = (effect.bladeAngle || 0) + 0.5;
              effect.currentSize = SMALL_SIZE * p;

              drawSawBlade(effect.x, effect.y, effect.currentSize, effect.bladeAngle);

              if (p >= 1) {
                effect.phase = "flying";
                effect.stageTimer = 0;
              }
              continue;
            }

            if (effect.phase === "flying") {
              const p = Math.min(1, st / effect.flyDuration);
              const sx = effect.startX, sy = effect.startY;
              const tx = effect.centerX, ty = effect.centerY;
              effect.x = sx + (tx - sx) * p;
              effect.y = sy + (ty - sy) * p;
              effect.bladeAngle = (effect.bladeAngle || 0) + 0.6;
              effect.currentSize = SMALL_SIZE;

              drawSawBlade(effect.x, effect.y, SMALL_SIZE, effect.bladeAngle);

              if (p >= 1) {
                effect.phase = "growing";
                effect.stageTimer = 0;
              }
              continue;
            }

            if (effect.phase === "growing") {
              const p = Math.min(1, st / effect.growDuration);
              effect.bladeAngle = (effect.bladeAngle || 0) + 0.7;
              effect.currentSize = SMALL_SIZE + (BIG_SIZE - SMALL_SIZE) * p;

              drawSawBlade(effect.x, effect.y, effect.currentSize, effect.bladeAngle);

              if (p >= 1) {
                effect.phase = "active";
                effect.stageTimer = 0;
              }
              continue;
            }

            if (effect.phase === "active") {
              const zoneR = effect.zoneRadius || 220;
              const tickEvery = effect.tickEvery || 10;
              const dmgPerTick = effect.damagePerTick || 12;
              effect.bladeAngle = (effect.bladeAngle || 0) + 0.4;

              ctx.save();
              ctx.beginPath();
              ctx.arc(effect.centerX, effect.centerY, zoneR, 0, Math.PI * 2);
              ctx.strokeStyle = "rgba(255,0,255,0.5)";
              ctx.lineWidth = 6;
              ctx.setLineDash([20, 14]);
              ctx.stroke();
              ctx.setLineDash([]);
              ctx.fillStyle = "rgba(255,0,255,0.06)";
              ctx.fill();
              ctx.restore();

              drawSawBlade(effect.x, effect.y, BIG_SIZE, effect.bladeAngle, "#f0f0ff", "#ff00ff", 14);

              if (st % tickEvery === 0) {
                for (const p of players) {
                  if (p.team !== effect.team) continue;
                  if (p.hp <= 0) continue;
                  const d = Math.hypot(p.x - effect.centerX, p.y - effect.centerY);
                  if (d <= zoneR) {
                    p.hp -= dmgPerTick;
                    createExplosion(p.x, p.y, p.team);
                    createDamageNumber(p.x, p.y, dmgPerTick);
                    playMeteorImpact(p.team, 0.4);
                    if (p.hp <= 0) {
                      createKillEffect(p);
                      playKillSound(panForTeamRandom(p.team));
                      rewardSenderForGiftKill(effect.senderId, 25);
                    }
                  }
                }

                if (effect.senderId) {
                  const sender = players.find(
                    sp => sp.id === effect.senderId && sp.hp > 0);
                  if (sender) {
                    const healed = sender.heal(8);
                    if (healed > 0) {
                      createHealNumber(sender.x, sender.y, healed);
                    }
                  }
                }
              }

              if (effect.life <= 5 && !effect.finished) {
                effect.finished = true;
                effects.push({
                  type: "bladeBurst",
                  x: effect.x, y: effect.y,
                  team: effect.team,
                  life: 70, maxLife: 70,
                });
                playLaserFire(effect.sourceTeam, 0.5);
              }
            }
          }

          if (effect.type === "bladeBurst") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            for (let ring = 0; ring < 3; ring++) {
              const rp = Math.max(0, progress - ring * 0.12);
              const r = rp * (500 + ring * 150);
              ctx.beginPath();
              ctx.arc(effect.x, effect.y, r, 0, Math.PI * 2);
              ctx.strokeStyle = ring === 0
                ? `rgba(255,255,255,${alpha})`
                : ring === 1
                  ? `rgba(255,80,180,${alpha * 0.8})`
                  : `rgba(180,60,255,${alpha * 0.6})`;
              ctx.lineWidth = 20 * (1 - rp) + 3;
              ctx.stroke();
            }
          }

          if (effect.type === "meteor") {
            const p = progress;
            const startX = effect.startX, startY = effect.startY;
            const curX = startX + (effect.targetX - startX) * p;
            const curY = startY + (effect.targetY - startY) * p;

            ctx.save();
            for (let k = 1; k <= 20; k++) {
              const tp = Math.max(0, p - k * 0.035);
              const tx = startX + (effect.targetX - startX) * tp;
              const ty = startY + (effect.targetY - startY) * tp;
              const alpha = (1 - k / 20) * (1 - p * 0.3);
              const size = 45 - k * 2;
              ctx.beginPath();
              ctx.arc(tx, ty, size, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(255,80,0,${alpha * 0.5})`;
              ctx.fill();
            }
            ctx.restore();

            ctx.save();
            ctx.shadowColor = "#ff4400";
            ctx.shadowBlur = 50;
            ctx.fillStyle = "#ff5500";
            ctx.beginPath();
            ctx.arc(curX, curY, 50, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            if (progress >= 0.95 && !effect.exploded) {
              effect.exploded = true;
              const impactX = effect.targetX;
              const impactY = effect.targetY;
              const target = effect.targetRef;
              if (target && target.hp > 0) {
                const DMG = effect.damage || 15;
                target.hp -= DMG;
                createDamageNumber(target.x, target.y, DMG);
                if (target.hp <= 0) {
                  createKillEffect(target);
                  playKillSound(panForTeamRandom(target.team));
                  rewardSenderForGiftKill(effect.senderId, 25);
                }
              }
              const splashR = effect.splashRadius || 180;
              const splashDmg = effect.splashDamage || 8;
              for (const p of players) {
                if (p.team !== effect.team) continue;
                if (p === target) continue;
                if (p.hp <= 0) continue;
                const d = Math.hypot(p.x - impactX, p.y - impactY);
                if (d <= splashR) {
                  p.hp -= splashDmg;
                  createDamageNumber(p.x, p.y, splashDmg);
                  if (p.hp <= 0) {
                    createKillEffect(p);
                    playKillSound(panForTeamRandom(p.team));
                    rewardSenderForGiftKill(effect.senderId, 25);
                  }
                }
              }
              createExplosion(impactX, impactY, effect.team);
              screenShake = Math.max(screenShake, 30);
              if (effect.senderId) {
                const sender = players.find((p) => p.id === effect.senderId && p.hp > 0);
                if (sender) sender.heal(10);
              }
              effects.push({
                type: "meteorImpact",
                x: impactX, y: impactY,
                team: effect.team,
                life: 60, maxLife: 60,
                splashRadius: splashR,
              });
              playMeteorImpact(effect.team, 0.5);
            }
          }

          if (effect.type === "meteorImpact") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            for (let ring = 0; ring < 3; ring++) {
              const rp = Math.max(0, progress - ring * 0.12);
              const r = rp * (250 + ring * 80);
              ctx.beginPath();
              ctx.arc(effect.x, effect.y, r, 0, Math.PI * 2);
              ctx.strokeStyle = ring === 0
                ? `rgba(255,255,200,${alpha})`
                : ring === 1
                  ? `rgba(255,140,40,${alpha * 0.8})`
                  : `rgba(200,60,0,${alpha * 0.6})`;
              ctx.lineWidth = 15 * (1 - rp) + 3;
              ctx.stroke();
            }
          }

          if (effect.type === "wipeEnemyDarken") {
            const alpha = Math.min(1, effect.life / 60) *
                          Math.min(1, (effect.maxLife - effect.life + 30) / 40) * 0.7;
            if (alpha < 0.05) continue;
            const w = effect.right - effect.left;
            ctx.fillStyle = `rgba(0,0,0,${alpha})`;
            ctx.fillRect(effect.left, 0, w, GAME_HEIGHT);
          }

          if (effect.type === "vortexSpiral") {
            const alpha = Math.min(1, effect.life / 40) * 0.85;
            if (alpha < 0.05) continue;
            const spin = Date.now() * 0.004;
            const maxR = effect.maxRadius || GAME_HEIGHT * 0.5;
            ctx.save();
            for (let arm = 0; arm < 5; arm++) {
              const armOffset = (Math.PI * 2 * arm) / 5 + spin;
              ctx.beginPath();
              for (let t = 0; t < 1; t += 0.03) {
                const r = t * maxR;
                const angle = armOffset + t * 3;
                const x = effect.x + Math.cos(angle) * r;
                const y = effect.y + Math.sin(angle) * r;
                if (t === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
              }
              ctx.strokeStyle = `rgba(180,80,255,${alpha * 0.7})`;
              ctx.lineWidth = 14;
              ctx.stroke();
            }
            ctx.restore();
          }

          if (effect.type === "vortexPull") {
            const player = effect.playerRef;
            if (!player || player.hp <= 0) continue;

            const maxFrames = effect.pullFrames + effect.holdFrames + 60;
            const totalElapsed = effect.maxLife - effect.life;
            if (totalElapsed > maxFrames) {
              effect.life = 0;
              continue;
            }

            let progressInPull;
            if (totalElapsed < effect.pullFrames) {
              progressInPull = totalElapsed / effect.pullFrames;
            } else {
              progressInPull = 1;
            }

            const spinAngle = effect.startAngle +
                              progressInPull * 12 * Math.PI * effect.spinSpeed * effect.spinDirection;
            const easedProgress = 1 - Math.pow(1 - progressInPull, 2);
            const radius = effect.startRadius * (1 - easedProgress);
            const px = effect.centerX + Math.cos(spinAngle) * radius;
            const py = effect.centerY + Math.sin(spinAngle) * radius;
            player.x = px;
            player.y = py;
          }

          if (effect.type === "wipeExplosion") {
            const p = progress;
            const alpha = 1 - p;
            if (p < 0.25) {
              ctx.fillStyle = `rgba(255,255,255,${(1 - p * 4) * 0.95})`;
              ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            }
            for (let layer = 0; layer < 3; layer++) {
              const layerP = Math.max(0, p - layer * 0.1);
              const r = layerP * (600 + layer * 200);
              const layerAlpha = (1 - layerP) * alpha;
              ctx.beginPath();
              ctx.arc(effect.x, effect.y, r, 0, Math.PI * 2);
              ctx.strokeStyle = layer === 0
                ? `rgba(255,255,255,${layerAlpha})`
                : layer === 1
                  ? `rgba(255,180,100,${layerAlpha * 0.8})`
                  : `rgba(180,60,255,${layerAlpha * 0.6})`;
              ctx.lineWidth = (30 - layer * 8) * (1 - layerP) + 3;
              ctx.stroke();
            }
          }

          if (effect.type === "wipeShockwave") {
            const alpha = 1 - progress;
            if (alpha < 0.05) continue;
            const maxR = Math.hypot(GAME_WIDTH, GAME_HEIGHT) * 0.6;
            const r = progress * maxR;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, r, 0, Math.PI * 2);
            ctx.strokeStyle = effect.team === "A"
              ? `rgba(120,200,255,${alpha})`
              : `rgba(120,255,150,${alpha})`;
            ctx.lineWidth = 25 * (1 - progress) + 4;
            ctx.stroke();
          }
        }
      }

      function rewardSenderForGiftKill(senderId, amount = 25) {
        if (!senderId) return;
        const sender = players.find((p) => p.id === senderId && p.hp > 0);
        if (!sender) return;
        sender.kills++;
        sender.radius = Math.min(62, 50 + sender.kills * 1.8);
        sender.maxHp = Math.min(
          MAX_HP_CAP,
          Math.max(sender.maxHp, START_HP + sender.kills * 15)
        );
        sender.hp = Math.min(sender.maxHp, sender.hp + amount);
        logDebug(`GIFT KILL reward → ${sender.username} (+${amount} HP)`);
      }

      /* ============================================================
         GIFT ATTACK
      ============================================================ */
      function giftAttack(coins, senderTeam, giftName, senderId) {
        const enemyTeam = senderTeam === "A" ? "B" : "A";
        const targets = players.filter((p) => p.team === enemyTeam && p.hp > 0);
        const name = (giftName || "").toLowerCase();

        logDebug(`giftAttack coins=${coins} name="${giftName}" sender=${senderId} targets=${targets.length}`);

        let launchIcon = "✨";
        if (name.includes("rose")) launchIcon = "🌹";
        else if (name.includes("heart")) launchIcon = "💗";
        else if (name.includes("mind")) launchIcon = "🧠";
        else if (name.includes("ghost")) launchIcon = "👻";
        else if (name.includes("lightning")) launchIcon = "⚡";
        else if (coins >= 10 && coins < 50) launchIcon = "💥";
        else if (coins >= 100 && coins < 500) launchIcon = "🪚";
        else if (coins >= 500 && coins < 1000) launchIcon = "☄️";
        else if (coins >= 1000) launchIcon = "💀";

        spawnGiftLaunch(senderId, senderTeam, launchIcon);

        if (targets.length === 0) {
          logDebug("NO TARGETS — gift fired with no banner");
          playRoseSound(senderTeam);
          return;
        }

        if (name.includes("rose")) {
          playRoseSound(senderTeam);
          const lockedTarget = targets[Math.floor(Math.random() * targets.length)];
          fireRoseVolley(senderTeam, senderId, lockedTarget);
          return;
        }

        if (name.includes("heart me") || name.includes("heartme")) {
          playHeartSound(senderTeam);
          const shuffled = [...targets].sort(() => Math.random() - 0.5);
          fireHeartVolley(senderTeam, senderId, shuffled);
          return;
        }

        if (name.includes("mind blown") || name.includes("mindblown")) {
          playMindSound(senderTeam);

          const origin = getSenderOrigin(senderId, senderTeam);

          effects.push({
            type: "mindCharge",
            x: origin.x, y: origin.y,
            team: senderTeam,
            life: 15, maxLife: 15,
          });

          const WAVES = 3;
          const BEAMS_PER_WAVE = 3;
          const WAVE_DELAY = 400;

          const shuffled = [...targets].sort(() => Math.random() - 0.5);

          for (let wave = 0; wave < WAVES; wave++) {
            setTimeout(() => {
              const enemyTeamNow = senderTeam === "A" ? "B" : "A";
              const alive = players.filter(p => p.team === enemyTeamNow && p.hp > 0);

              const pickStart = wave * BEAMS_PER_WAVE;
              const waveTargets = [];
              for (let bi = 0; bi < BEAMS_PER_WAVE; bi++) {
                let t = shuffled[(pickStart + bi) % shuffled.length];
                if (!t || t.hp <= 0) {
                  if (alive.length) t = alive[Math.floor(Math.random() * alive.length)];
                  else t = null;
                }
                if (t && !waveTargets.includes(t)) waveTargets.push(t);
              }

              waveTargets.forEach((target) => {
                if (!target || target.hp <= 0) return;

                effects.push({
                  type: "mindLaser",
                  startX: origin.x,
                  startY: origin.y,
                  endX: target.x,
                  endY: target.y,
                  team: senderTeam,
                  life: 22, maxLife: 22,
                });

                playLaserFire(senderTeam, 0.4);

                const DMG = 6;
                target.hp -= DMG;
                createDamageNumber(target.x, target.y, DMG);

                if (senderId) {
                  const sender = players.find(p => p.id === senderId && p.hp > 0);
                  if (sender) {
                    const healed = sender.heal(3);
                    if (healed > 0) createHealNumber(sender.x, sender.y, healed);
                  }
                }

                effects.push({
                  type: "mindImpact",
                  x: target.x, y: target.y,
                  team: target.team,
                  life: 40, maxLife: 40,
                });

                if (target.hp <= 0) {
                  createKillEffect(target);
                  playKillSound(panForTeamRandom(target.team));
                  rewardSenderForGiftKill(senderId, 25);
                }
              });
            }, 250 + wave * WAVE_DELAY);
          }

          return;
        }

        if (name.includes("ghost")) {
          playGhostAmbience(senderTeam, 0.35, 3);
          playGhostWail(senderTeam, 0.35, 0.1);
          const HOP_COUNT = 8;
          const shuffled = [...targets].sort(() => Math.random() - 0.5);
          const huntList = [];
          for (let i = 0; i < HOP_COUNT; i++) {
            huntList.push(shuffled[i % shuffled.length]);
          }
          const sender = players.find(p => p.id === senderId && p.hp > 0);
          const origin = getSenderOrigin(senderId, senderTeam);

          effects.push({
            type: "huntingGhost",
            x: origin.x, y: origin.y,
            startX: origin.x, startY: origin.y,
            team: senderTeam,
            targetTeam: enemyTeam,
            huntList,
            currentIndex: 0,
            phase: "emerging",
            stageTimer: 0,
            emergeDuration: 35,
            senderRef: sender,
            life: 700, maxLife: 700,
            trail: [],
            senderId,
          });

          setTimeout(() => playGhostScream(senderTeam, 0.35),
                     700 + HOP_COUNT * 260);
          return;
        }

        if (name.includes("lightning") || (coins >= 50 && coins < 100)) {
          playLightningCrack(senderTeam, 0.6);
          setTimeout(() => playThunderRumble(senderTeam, 0.5, 0), 200);
          setTimeout(() => playThunderBoom(senderTeam, 0.4, 0), 400);

          const CHAIN_COUNT = Math.min(10, targets.length);
          const shuffled = [...targets].sort(() => Math.random() - 0.5);
          const chainList = shuffled.slice(0, CHAIN_COUNT);

          effects.push({
            type: "chainLightning",
            chainList,
            currentIndex: 0,
            phase: "strike",
            stageTimer: 0,
            life: 220, maxLife: 220,
            sourceTeam: senderTeam,
            targetTeam: enemyTeam,
            senderId,
          });

          chainList.forEach((target, idx) => {
            setTimeout(() => {
              if (target.hp <= 0) return;

              effects.push({
                type: "chainHit",
                x: target.x, y: target.y,
                team: target.team,
                life: 60, maxLife: 60,
              });

              setTimeout(() => {
                if (target.hp <= 0) return;

                const DMG = 12;
                target.hp -= DMG;
                createDamageNumber(target.x, target.y, DMG);

                if (senderId) {
                  const sender = players.find((p) => p.id === senderId && p.hp > 0);
                  if (sender) {
                    const healed = sender.heal(5);
                    if (healed > 0) createHealNumber(sender.x, sender.y, healed);
                  }
                }

                if (target.hp <= 0) {
                  createKillEffect(target);
                  playKillSound(panForTeamRandom(target.team));
                  rewardSenderForGiftKill(senderId, 25);
                }
              }, 120);
            }, 220 + idx * 220);
          });

          setTimeout(() => {
            playThunderBoom(senderTeam, 0.5, 0);
            playThunderRumble(senderTeam, 0.4, 0);
          }, 220 + chainList.length * 220);
          return;
        }

        if (coins >= 1 && coins < 5) {
          playRoseSound(senderTeam);
          const lockedTarget = targets[Math.floor(Math.random() * targets.length)];
          fireRoseVolley(senderTeam, senderId, lockedTarget);
          return;
        }

        if (coins >= 5 && coins < 10) {
          playRocketLaunch(senderTeam);
          fireMissiles({
            senderTeam, targets, count: 5, damage: 4, missileType: "rocket",
            senderId,
          });
          return;
        }

        if (coins >= 10 && coins < 50) {
          playGrenadeLaunch(senderTeam);
          fireGrenadeVolley(senderTeam, senderId, targets);
          return;
        }

        if (coins >= 100 && coins < 500) {
          playLaserCharge(senderTeam, 0.35, 0.6);
          const enemyLeft  = enemyTeam === "A" ? 0 : GAME_WIDTH / 2;
          const enemyRight = enemyTeam === "A" ? GAME_WIDTH / 2 : GAME_WIDTH;
          const ZONE_CENTER_X = (enemyLeft + enemyRight) / 2;
          const ZONE_CENTER_Y = GAME_HEIGHT / 2;
          const ZONE_RADIUS   = 220;
          const sender = players.find(p => p.id === senderId && p.hp > 0);
          const origin = getSenderOrigin(senderId, senderTeam);

          effects.push({
            type: "deathSawEmerge",
            x: origin.x, y: origin.y,
            startX: origin.x, startY: origin.y,
            centerX: ZONE_CENTER_X, centerY: ZONE_CENTER_Y,
            zoneRadius: ZONE_RADIUS,
            team: enemyTeam,
            sourceTeam: senderTeam,
            senderId,
            senderRef: sender,
            bladeAngle: 0,
            stageTimer: 0,
            phase: "emerging",
            emergeDuration: 20,
            flyDuration: 25,
            growDuration: 15,
            currentSize: 0,
            life: 220, maxLife: 220,
            damagePerTick: 12,
            tickEvery: 10,
            finished: false,
          });

          playSawSpin(senderTeam, 0.35, 3);
          return;
        }

        if (coins >= 500 && coins < 1000) {
          playNukeSound(senderTeam);
          const enemyLeft = enemyTeam === "A" ? 0 : GAME_WIDTH / 2;
          const enemyRight = enemyTeam === "A" ? GAME_WIDTH / 2 : GAME_WIDTH;
          const METEOR_COUNT = Math.min(10, targets.length);
          const shuffled = [...targets].sort(() => Math.random() - 0.5);
          const meteorTargets = shuffled.slice(0, METEOR_COUNT);

          meteorTargets.forEach((target, idx) => {
            setTimeout(() => {
              if (target.hp <= 0) return;
              const origin = getSenderOrigin(senderId, senderTeam);
              effects.push({
                type: "meteor",
                startX: origin.x,
                startY: origin.y - 200,
                targetX: target.x,
                targetY: target.y,
                team: target.team,
                senderTeam,
                life: 70, maxLife: 70,
                targetRef: target,
                senderId,
                exploded: false,
                damage: 15,
                splashRadius: 180,
                splashDamage: 8,
              });
              playMeteorWhoosh(target.team, 0.3);
            }, idx * 350);
          });

          setTimeout(() => {
            effects.push({
              type: "wipeShockwave",
              x: (enemyLeft + enemyRight) / 2,
              y: GAME_HEIGHT / 2,
              team: senderTeam,
              life: 80, maxLife: 80,
            });
            playThunderBoom(senderTeam, 0.5, 0);
          }, METEOR_COUNT * 350 + 1500);
          return;
        }

        if (coins >= 1000) {
          if (senderId) {
            const sender = players.find(p => p.id === senderId && p.hp > 0);
            if (sender) {
              sender.maxHp = MAX_HP_CAP;
              sender.hp = MAX_HP_CAP;
              sender.megaScale = 2.0;
              sender.megaTimer = 420;
              createHealNumber(sender.x, sender.y, MAX_HP_CAP);
              logDebug(`TOTAL WIPE → ${sender.username} maxed to ${MAX_HP_CAP} HP + mega 2x`);
            }
          }

          players.forEach(p => {
            if (p.team === senderTeam && p.hp > 0) {
              const healed = p.heal(30);
              if (healed > 0) createHealNumber(p.x, p.y, healed);
            }
          });

          playApocalypseSiren(senderTeam, 0.35, 2.5);
          playTornadoSound(senderTeam, 0.35, 3.0);
          playWipeSound(senderTeam);

          const enemyLeft = enemyTeam === "A" ? 0 : GAME_WIDTH / 2;
          const enemyRight = enemyTeam === "A" ? GAME_WIDTH / 2 : GAME_WIDTH;
          const enemyCenterX = (enemyLeft + enemyRight) / 2;
          const enemyCenterY = GAME_HEIGHT / 2;

          effects.push({
            type: "wipeEnemyDarken",
            x: enemyCenterX, y: enemyCenterY,
            left: enemyLeft, right: enemyRight,
            team: enemyTeam,
            life: 450, maxLife: 450,
          });

          effects.push({
            type: "vortexSpiral",
            x: enemyCenterX, y: enemyCenterY,
            team: enemyTeam,
            maxRadius: (enemyRight - enemyLeft) * 0.45,
            life: 400, maxLife: 400,
          });

          targets.forEach((target, idx) => {
            const dx = target.x - enemyCenterX;
            const dy = target.y - enemyCenterY;
            effects.push({
              type: "vortexPull",
              startX: target.x,
              startY: target.y,
              centerX: enemyCenterX,
              centerY: enemyCenterY,
              startAngle: Math.atan2(dy, dx),
              startRadius: Math.hypot(dx, dy),
              playerRef: target,
              team: target.team,
              pullFrames: 180,
              holdFrames: 60,
              life: 240, maxLife: 240,
              delay: idx * 2,
              spinSpeed: 0.05 + Math.random() * 0.03,
              spinDirection: Math.random() < 0.5 ? 1 : -1,
            });
          });

          setTimeout(() => {
            playWipeBlast(senderTeam, 0.7);

              type: "wipeExplosion",

              team: enemyTeam,
              life: 120, maxLife: 120,

              type: "wipeShockwave",

            targets.forEach((target, idx) => {

                createExplosion(target.x, target.y, target.team);

                playKillSound(panForTeamRandom(target.team));
                rewardSenderForGiftKill(senderId, 25);
              }, idx * 100);
            });
          }, 4000);
          return;
        }

      /* ============================================================
         BACKGROUND — FULL ab.jpg + CENTER DIVIDER
      ============================================================ */
      function drawBackground() {
        const halfW = GAME_WIDTH / 2;

        if (IMG_BG.complete && IMG_BG.naturalWidth > 0) {
          ctx.drawImage(IMG_BG, 0, 0, GAME_WIDTH, GAME_HEIGHT);
        } else {
          ctx.fillStyle = FALLBACK_BG;
          ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        }

        ctx.fillStyle = "rgba(10,40,90,0.35)";
        ctx.fillRect(0, 0, halfW, GAME_HEIGHT);

        ctx.fillStyle = "rgba(0,40,10,0.35)";
        ctx.fillRect(halfW, 0, halfW, GAME_HEIGHT);

        const topGrad = ctx.createLinearGradient(0, 0, 0, 260);
        topGrad.addColorStop(0, "rgba(0,0,0,0.65)");
        topGrad.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = topGrad;
        ctx.fillRect(0, 0, GAME_WIDTH, 260);

        const botGrad = ctx.createLinearGradient(0, GAME_HEIGHT - 260, 0, GAME_HEIGHT);
        botGrad.addColorStop(0, "rgba(0,0,0,0)");
        botGrad.addColorStop(1, "rgba(0,0,0,0.65)");
        ctx.fillStyle = botGrad;
        ctx.fillRect(0, GAME_HEIGHT - 260, GAME_WIDTH, 260);

        ctx.save();
        ctx.shadowColor = "rgba(255,255,255,0.9)";
        ctx.shadowBlur = 25;
        ctx.fillStyle = "rgba(255,255,255,0.95)";
        ctx.fillRect(GAME_WIDTH / 2 - 4, 0, 8, GAME_HEIGHT);
        ctx.restore();

        drawDiagonalName("MESSI",   GAME_WIDTH * 0.25, GAME_HEIGHT * 0.5,  Math.PI / 2.6, "left");
        drawDiagonalName("RONALDO", GAME_WIDTH * 0.75, GAME_HEIGHT * 0.5, -Math.PI / 2.6, "right");

        drawTeamBadge(GAME_WIDTH * 0.25, 90, "MESSI",   "#2b7bd6", "#ffffff", "#9fd4ff");
        drawTeamBadge(GAME_WIDTH * 0.75, 90, "RONALDO", "#0f8a3c", "#d81f26", "#7dffa3");
      }

      function drawDiagonalName(text, cx, cy, angle, side) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);

        const halfW = GAME_WIDTH / 2;
        const maxTextWidth = halfW * 0.92;
        let fontSize = 260;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = `900 ${fontSize}px "Arial Black", Impact, sans-serif`;
        while (ctx.measureText(text).width > maxTextWidth && fontSize > 40) {
          fontSize -= 4;
          ctx.font = `900 ${fontSize}px "Arial Black", Impact, sans-serif`;
        }

        const isMessi = side === "left";
        const fillColor   = "rgba(255,255,255,0.32)";
        const strokeColor = isMessi ? "rgba(20,60,120,0.85)"   : "rgba(90,10,10,0.85)";
        const glowColor   = isMessi ? "rgba(120,200,255,0.55)" : "rgba(120,255,150,0.55)";
        const innerColor  = isMessi ? "rgba(180,220,255,0.55)" : "rgba(255,180,180,0.55)";

        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 80;
        ctx.lineJoin = "round";
        ctx.lineWidth = Math.max(8, fontSize * 0.07);
        ctx.strokeStyle = strokeColor;
        ctx.strokeText(text, 0, 0);

        ctx.shadowBlur = 0;
        ctx.fillStyle = fillColor;
        ctx.fillText(text, 0, 0);

        ctx.lineWidth = Math.max(2, fontSize * 0.018);
        ctx.strokeStyle = innerColor;
        ctx.strokeText(text, 0, 0);

        ctx.restore();
      }

      function drawTeamBadge(cx, cy, label, primary, secondary, accent) {
        const paddingX = 40;
        const height = 70;

        ctx.save();
        ctx.font = "900 40px 'Arial Black', Impact, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const textW = ctx.measureText(label).width;
        const pillW = textW + paddingX * 2;
        const pillX = cx - pillW / 2;
        const pillY = cy - height / 2;

        ctx.shadowColor = accent;
        ctx.shadowBlur = 40;

        ctx.fillStyle = primary;
        ctx.beginPath();
        ctx.roundRect(pillX, pillY, pillW, height, height / 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = secondary;
        ctx.beginPath();
        ctx.roundRect(pillX + 6, pillY + 6, pillW - 12, height - 12, (height - 12) / 2);
        ctx.fill();

        ctx.fillStyle = primary;
        ctx.fillText(label, cx, cy + 2);

        ctx.restore();
      }

      function removeDeadPlayers() {
        for (let i = players.length - 1; i >= 0; i--) {
          if (players[i].hp <= 0) players.splice(i, 1);
        }
      }

      function setStatus(text, cls) {
        const el = document.getElementById("status");
        el.textContent = text;
        el.classList.remove("connected", "disconnected", "connecting");
        if (cls) el.classList.add(cls);
      }

      function updateStatus() {
        const a = players.filter((p) => p.team === "A").length;
        const b = players.filter((p) => p.team === "B").length;

        let prefix = "🟡";
        let cls = "connecting";
        if (socket && socket.readyState === WebSocket.OPEN) {
          prefix = "🟢"; cls = "connected";
        } else if (socket && (socket.readyState === WebSocket.CLOSED ||
                              socket.readyState === WebSocket.CLOSING)) {
          prefix = "🔴"; cls = "disconnected";
        }

        setStatus(
          `${prefix} MESSI: ${a}  |  RONALDO: ${b}` +
          (cls === "connected" ? "" : "  (test mode)"),
          cls
        );
      }

      function gameLoop(now) {
        ctx.save();
        if (screenShake > 0) {
          const dx = random(-screenShake, screenShake);
          const dy = random(-screenShake, screenShake);
          ctx.translate(dx, dy);
          screenShake *= 0.9;
          if (screenShake < 1) screenShake = 0;
        }
        drawBackground();
        for (const player of players) {
          if (player.hp > 0) player.update(now);

          if (player.megaTimer > 0) {
            player.megaTimer--;
            if (player.megaTimer <= 0) {
              player.megaTimer = 0;
              player.megaScale = 1;
            }
          }
        }
        for (const player of players) {
          if (player.hp > 0) player.draw();
        }
        updateGrenades();
        updateBullets();
        drawEffects();
        removeDeadPlayers();
        updateStatus();
        ctx.restore();
        requestAnimationFrame(gameLoop);
      }

      /* ============================================================
         TIKFINITY WEBSOCKET
      ============================================================ */
      let socket = null;
      let reconnectTimer = null;

      function connectTikFinity() {
        try {
          setStatus("🟡 Connecting to TikFinity...", "connecting");
          logDebug("WS CONNECTING...");

          socket = new WebSocket("ws://localhost:21213/");

          socket.onopen = () => {
            setStatus("🟢 TikFinity CONNECTED", "connected");
            logDebug("WS CONNECTED");
          };

          socket.onmessage = (event) => {
            let data;
            try { data = JSON.parse(event.data); }
            catch (e) {
              logDebug("Non-JSON: " + String(event.data).slice(0, 120));
              return;
            }

            logDebug("EVENT: " + data.event + " | " +
                     JSON.stringify(data.data || {}).slice(0, 600));

            const evt = (data.event || data.type || "").toLowerCase();

            if (evt === "chat" || evt === "comment") handleChat(data);
            else if (evt === "gift") handleGift(data);
            else if (evt === "like") handleLike(data);
          };

          socket.onerror = () => {
            setStatus("🔴 TikFinity NOT CONNECTED (test mode)", "disconnected");
            logDebug("WS ERROR");
          };

          socket.onclose = () => {
            setStatus("🔴 TikFinity DISCONNECTED (test mode)", "disconnected");
            logDebug("WS CLOSED - retrying in 3s");
            if (reconnectTimer) clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(() => connectTikFinity(), 3000);
          };
        } catch (error) {
          console.log("WebSocket unavailable", error);
          setStatus("🔴 TikFinity NOT CONNECTED (test mode)", "disconnected");
          logDebug("WS THROW: " + error.message);
          if (reconnectTimer) clearTimeout(reconnectTimer);
          reconnectTimer = setTimeout(() => connectTikFinity(), 3000);
        }
      }

      function resolveGiftName(giftNameRaw) {
        const raw = String(giftNameRaw || "").trim();
        if (/^\d+$/.test(raw)) {
          const name = TIKTOK_GIFT_IDS[parseInt(raw)];
          return name || "";
        }
        return raw;
      }

      function handleChat(data) {
        const info = data.data || data;
        const username = deepPick(
          info,
          "uniqueId", "userId", "unique_id", "user_id",
          "nickname", "nickName", "nick_name", "displayName"
        ) || "viewer";
        const comment = String(
          deepPick(info, "comment", "text", "message", "content") || ""
        ).trim().toLowerCase();
        const avatar = deepPick(
          info,
          "profilePictureUrl", "profilePicture", "avatarUrl",
          "profile_picture_url", "avatar", "profilePicUrl"
        ) || DEFAULT_AVATAR;

        logDebug(`CHAT user=${username} comment="${comment}"`);

        if (comment === "a" || comment === "team a" || comment === "messi" || comment === "team messi") {
          const p = addPlayer(username, avatar, "A");
          if (p) showJoinPopup(p.username, "A");
        } else if (comment === "b" || comment === "team b" || comment === "ronaldo" || comment === "team ronaldo") {
          const p = addPlayer(username, avatar, "B");
          if (p) showJoinPopup(p.username, "B");
        }
      }

      function handleGift(data) {
        const info = data.data || data;
        const username = deepPick(
          info,
          "uniqueId", "userId", "unique_id", "user_id",
          "nickname", "nickName", "nick_name", "displayName",
          "userUniqueId", "user_unique_id"
        ) || ("viewer_" + Math.floor(Math.random() * 9999));
        const avatar = deepPick(
          info,
          "profilePictureUrl", "profilePicture", "avatarUrl",
          "profile_picture_url", "avatar", "profilePicUrl"
        ) || DEFAULT_AVATAR;
        const giftNameRaw = deepPick(
          info, "giftName", "gift_name", "giftId", "gift_id", "name"
        );
        const giftName = resolveGiftName(giftNameRaw);
        const coinsRaw = deepPick(
          info, "diamondCount", "diamonds", "coins",
          "diamond_count", "giftDiamondCount", "diamond_count"
        );
        const coins = parseInt(coinsRaw) || 1;

        logDebug(`GIFT user=${username} name="${giftName}" (raw="${giftNameRaw}") coins=${coins}`);

        let player = players.find((p) => p.id === username);
        if (!player) {
          const a = players.filter(p => p.team === "A").length;
          const b = players.filter(p => p.team === "B").length;
          const team = a <= b ? "A" : "B";
          player = addPlayer(username, avatar, team);
          logDebug(`Gift auto-joined ${username} to ${team}`);
        }
        if (!player) return;
        giftAttack(coins, player.team, giftName, player.id);
      }

      function handleLike(data) {
        const info = data.data || data;
        const username = deepPick(
          info,
          "uniqueId", "userId", "unique_id", "user_id",
          "nickname", "nickName", "nick_name", "displayName"
        );
        const likeCountRaw = deepPick(info, "likeCount", "count", "repeatCount");
        const likeCount = Math.max(1, parseInt(likeCountRaw) || 1);

        if (!username) {
          logDebug("LIKE with no username — ignored");
          return;
        }

        const player = players.find((p) => p.id === username && p.hp > 0);
        if (!player) {
          logDebug(`LIKE ignored — ${username} not on a team or dead`);
          return;
        }

        const healed = player.heal(LIKE_HEAL_AMOUNT * likeCount);
        if (healed > 0) {
          createHealNumber(player.x, player.y, healed);
          effects.push({
            type: "likeHeal",
            x: player.x,
            y: player.y,
            team: player.team,
            life: 40,
            maxLife: 40,
          });
          logDebug(`LIKE heal ${username} +${healed} HP`);
        } else {
          logDebug(`LIKE on ${username} — already at max HP`);
        }
      }

      /* ============================================================
         TEST BUTTONS
      ============================================================ */
      let testNumber = 0;
      let testGiftToggle = 0;

      document.getElementById("teamAButton").onclick = () => {
        testNumber++;
        const p = addPlayer("TestMessi" + testNumber, DEFAULT_AVATAR, "A");
        if (p) showJoinPopup(p.username, "A");
      };
      document.getElementById("teamBButton").onclick = () => {
        testNumber++;
        const p = addPlayer("TestRonaldo" + testNumber, DEFAULT_AVATAR, "B");
        if (p) showJoinPopup(p.username, "B");
      };
      document.getElementById("giftButton").onclick = () => {
        testGiftToggle++;
        const mod = testGiftToggle % 8;
        const sender = players.find(p => p.team === "A");
        const sid = sender ? sender.id : null;
        if (mod === 1) giftAttack(1, "A", "Rose", sid);
        else if (mod === 2) giftAttack(5, "A", "Heart Me", sid);
        else if (mod === 3) giftAttack(10, "A", "Mind Blown", sid);
        else if (mod === 4) giftAttack(20, "A", "Ghost", sid);
        else if (mod === 5) giftAttack(50, "A", "Lightning", sid);
        else if (mod === 6) giftAttack(100, "A", "Mega Strike", sid);
        else if (mod === 7) giftAttack(500, "A", "Nuke", sid);
        else giftAttack(1000, "A", "Total Wipe", sid);
      };
      document.getElementById("muteButton").onclick = () => {
        soundEnabled = !soundEnabled;
        document.getElementById("muteButton").textContent =
          soundEnabled ? "🔊" : "🔇";
      };
      document.getElementById("resetButton").onclick = () => {
        players = []; bullets = []; effects = []; grenades = [];
        screenShake = 0;
        updateStatus();
        logDebug("RESET");
      };

      /* ============================================================
         START
      ============================================================ */
      connectTikFinity();
      requestAnimationFrame(gameLoop);
    </script>
  </body>
</html>
